      <div class="stat"><small>Size</small><b>${esc(a.sizeText||'-')}</b></div>
      <div class="stat"><small>Version</small><b>${esc(a.version||'-')}</b></div>
      <div class="stat"><small>Android</small><b>${a.minSdk?('&ge; '+a.minSdk):'-'}</b></div>
      <div class="stat"><small>Updated</small><b style="font-size:14px">${esc(dateText(a.updated)||'-')}</b></div></div>
    ${(a.shots&&a.shots.length)?`<div class="eyebrow">Preview</div><div class="shots">${a.shots.map((c,i)=>'<div class="shot">'+imgTagFor(c,'')+'<div class="ph"></div><span>'+(i+1)+'</span></div>').join('')}</div>`:''}
    <div class="desc">${esc(a.description||a.summary||a.sum||'')}</div>
    ${links.length?`<div class="linkrow">${links.join('')}</div>`:''}
    <div class="meta-list"><b>Package</b> ${esc(a.pkg)}<br>${a.summary?`<b>Summary</b> ${esc(a.summary)}<br>`:''}</div>
    ${footer()}`,same);
  renderSheetActions(a);
  $('#sheet').classList.add('on');
}
/* The actions row of an app page, drawn from that app's catalogue entry.
 *
 * "That app's catalogue entry" is the part that was missing. The entry comes
 * from B.detail(S.sheetPkg), and detail() answers "{}" for a package the
 * catalogue being served does not hold - which is not a rare state. A refresh
 * does not build a second catalogue and swap it in at the end: every batch is
 * published as it parses (see publish() in StoreBridge), so for the whole
 * length of a refresh the store is serving the *prefix* of the new index. An
 * app page opened on an entry that is parsed later than that prefix is an app
 * the catalogue momentarily does not have, and refreshVisible() - which runs
 * on every one of those batches, and on every 'installed' event - patched the
 * open page from that empty answer.
 *
 * What it drew from it: a.pkg was undefined, so esc(a.pkg) was the empty
 * string and every branch below fell through to the last one. The reader's
 * Get/Open/Update button became <button data-install="">Get</button> - a
 * button that looks exactly like a working one, and whose tap runs
 * beginInstall('') and comes back "That app is not in the catalogue." - and
 * the Uninstall button beside it, which is drawn only when a.installed is
 * true, disappeared entirely: an installed app's own page lost the one
 * control that removes it. Measured on this page with a 300-app catalogue:
 * open an installed app, publish a batch that does not contain it, call
 * refreshVisible() - #sheetActions goes from "Update + Uninstall" to a single
 * dead "Get", and back again only when a later batch happens to include it.
 *
 * Returning early draws nothing, which is the right answer: the page still
 * describes the app the reader opened, and the buttons already in the row are
 * keyed on its package name, which is still valid on the device whatever the
 * catalogue currently holds - so Open and Uninstall go on working. The row is
 * patched again as soon as detail() can answer for the app, which is the same
 * moment the rest of the page's data becomes current.
 *
 * Nothing changes for a real entry: openSheet() only reaches this line after
 * detail() has given it a.pkg, and every other caller passes what detail()
 * returned, so the guard is false on exactly the answers that drew the dead
 * row.
 */
function renderSheetActions(a){
  const box=$('#sheetActions'); if(!box) return;
  if(!a||!a.pkg) return;              /* no catalogue entry - see above */
  const inst=S.installing[a.pkg];
  let primary;
  if(inst) primary=`<button class="pill" data-busy="${esc(a.pkg)}"><span class="fill" style="width:${inst.pct}%"></span><span>${inst.pct}%</span></button>`;
  else if(S.partial&&!a.installed) primary=`<button class="pill" data-busy="1" style="opacity:.55">&hellip;</button>`;
  else if(a.installed&&a.hasUpdate) primary=`<button class="pill" data-install="${esc(a.pkg)}">Update</button>`;
  else if(a.installed) primary=`<button class="pill" data-open="${esc(a.pkg)}">Open</button>`;
  else primary=`<button class="pill" data-install="${esc(a.pkg)}">Get</button>`;
  const secondary=a.installed?`<button class="pill2" data-uninstall="${esc(a.pkg)}">Uninstall</button>`:'';
  box.innerHTML=primary+secondary;
}
/* Which app, if any, the sheet is showing.

   The sheet is one surface with several pages behind it - an app's page, the
   Sources list, the Depth panel, and the "One permission needed" page - and
   S.sheetPkg is the app that the pagebar's More button, the install poll and
   refreshVisible() all act on. It was assigned in exactly two places: openSheet()
   set it, and closeSheet() cleared it. Nothing cleared it when the sheet swapped
   to a page that is not an app's, so those pages inherited whichever app had
   been open before them.

   The permission page is the one a reader really lands on, and it is reached
   from inside an app's page: open an app, tap Get on a device that has not
   allowed installs from this source yet, and the page that replaces it is
   still filed under that app. Its More button then opened that app's source
   URL in the browser - an app the reader was no longer looking at, and it took
   the store with it, with no way back but to relaunch. An install finishing in
   the background while the permission page was up did the same thing from the
   other side: pollInstall() saw S.sheetPkg match and called openSheet(),
   replacing the page the reader was reading with the app page underneath it.

   Every page now states what it is, so "the sheet is showing app X" is true
   exactly when it is. More on a page with no app returns silently, which is
   what it already did whenever no app had been opened at all. */
function sheetApp(pkg){ S.sheetPkg=pkg||null }
/* Closing the sheet used to hide the page, not let go of it.

   #sheet is never display:none - it is a flex box parked at
   transform:translateX(104%) - and closeSheet() only dropped .on. So every
   node of the last app page stayed in the document, including its icons and
   all eight screenshots, each one carrying the data URI the native cache
   handed it: the same base64 that IMG_DONE is carefully capped at 6 MB to
   hold was still pinned in the DOM afterwards, where nothing evicts it. The
   sheet is also still in the render tree at that offset, so the engine keeps
   the decoded bitmaps as well - a screenshot at 1080x1920 is 8.3 MB of
   pixels, and the page holds up to eight of them.

   Measured on this page with a stand-in bridge serving 300 KB per screenshot:
   after tapping back out of an app page, #sheetBody still held 9 images and
   2.64 MB of base64 - the same numbers as while the page was open - and 9.67
   MB across the whole document with every overlay closed. The next app page
   replaced it, so the peak was one page, but that peak outlived the surface
   by the rest of the session: browse a few apps and the store sits on tens of
   megabytes of pixels nobody can see. Nothing visual changes - the page is
   off screen the whole time - and openSheet() writes a fresh page into
   #sheetBody before it shows the sheet again, so a reopened sheet cannot tell
   the difference.

   The clear waits for the slide-out. Dropping the content the instant .on
   goes would empty the page while it is still travelling off screen, which is
   the one moment it is visible; 420 ms clears the .38s transform even when
   the transition starts late. The guard covers a sheet reopened inside that
   window, which must keep the page it has just been given. */
const SHEET_RELEASE_MS=520;
function closeSheet(){
  const sh=$('#sheet');
  sh.classList.remove('on');
  sheetApp(null);
  clearTimeout(sh.releaseT);
  sh.releaseT=setTimeout(function(){
    if(sh.classList.contains('on')) return;      /* reopened while it slid out */
    const b=$('#sheetBody');
    if(b) b.innerHTML='';
  },SHEET_RELEASE_MS);
}

/* ---------- install ---------- */
/* Starting an install changes the same two controls a progress tick does.
 *
 * beginInstall() rebuilt the whole visible view for it - refreshVisible() -
 * which is the call paintProgress() was written to replace. That fix covered
 * every tick of a download and left the first one on the old path, so the
 * most expensive frame of the whole install was the one the reader paid by
 * tapping Get: the list was thrown away and re-created from a fresh bridge
 * query, to turn one button into its ring.
 *
 * Measured on this page with 320 rows scrolled into Apps, tapping Get on one
 * of them: refreshVisible() re-queried the catalogue once for all 320 rows,
 * shipped them back as JSON, parsed them, and wrote 225 KB of HTML over a
 * view that was already correct - one list() call, two innerHTML writes and
 * 320 rows rebuilt, on the thread that is also starting the download. The
 * ring it drew is byte for byte the markup getBtnHtml() produces from
 * S.installing alone, which is exactly what paintProgress() patches in.
 *
 * So patch the two controls and nothing else. The list keeps every row it
 * had (and its scroll position, which the rebuild used to clamp to 0 and put
 * back), and the app page keeps its pill - renderSheetActions() draws that
 * from the same S.installing entry, so it reads the same as it did. Nothing
 * that was drawn changes: the same ring appears on the same buttons at the
 * same moment, and the rows around them were never different.
 *
 * The other paths that answer "an install started" are untouched - the
 * progress ticks still go through paintProgress() (see there), and the end of
 * an install still redraws the view through refreshVisible(), because that
 * one really does change every row it touches: the button becomes Open, the
 * badge appears and the size line is rewritten. */
function beginInstall(pkg){
  const r=B.install(pkg);
  if(r&&r.ok){
    S.installing[pkg]={pct:0};
    paintProgress(pkg);
    if(S.sheetPkg===pkg) renderSheetActions(B.detail(pkg));
    pollStart();return
  }
  const msg=(r&&r.error)||'Could not start the install.';
  if(msg==='permission') showPermission(); else toast(msg);
}
function showPermission(){
  const c=B.canInstall();
  sheetBody(`<div class="sheet-head"><div style="flex:1"><h2>One permission needed</h2><div class="cat">Install unknown apps</div></div></div>
    <div class="desc">${esc(c.message||'Android needs your permission before Liquid Store can install apps. This is a one-time switch - after that installs start straight from the store.')}</div>
    <div class="installrow"><button class="bigget g press" id="grantBtn"><span>Open settings</span></button></div>
    <div class="meta-list">Nothing else is requested: no account, no sign-in, no advertising identifier.</div>`);
  sheetApp(null);                       /* not an app's page - see sheetApp() */
  const b=$('#grantBtn');
  if(b) b.addEventListener('click',()=>{B.requestInstallPermission();toast('Turn on "Allow from this source", then press Get again.')});
  $('#sheet').classList.add('on');
}
/* One progress tick changes exactly one control: the ring on that package's
   Get button, and - if its detail page happens to be open - the fill of its
   pill. refreshVisible() rebuilt the entire visible list for that, so every
   half second of a download threw away and re-created every loaded row (and
   re-queried the catalogue behind it): 250 ms per tick over 240 rows on a
   throttled CPU, i.e. the list froze for the length of the download. Patch
   the two controls in place instead - same markup getBtnHtml() would emit,
   so nothing visual differs.

   Finding the controls is the expensive half of that, and it was done the
   wrong way. The scan asked for '[data-detail]', an attribute selector, so
   the engine had to walk every element in the document and test an attribute
   on each one before it could return a single node: measured at 10.7 ms a
   call over a 5,160-element document (five views, 550 rows loaded), against
   0.6 ms for the same 556 nodes found by class. That ran on every progress
   tick - the poll asks twice a second for the length of a download, and the
   bridge pushes once more for every percentage point - on the thread that is
   also painting the list the reader is scrolling, so a long install made
   scrolling stutter at exactly the moment the device was busiest.

   data-detail is emitted in exactly three places, each with a class of its
   own - rowHtml() a .row, bigCard() a .bigcard, hcard() a .hcard - so three
   single-class lookups return the identical nodes through the class index
   instead of a walk. The guard below still drops anything without the
   attribute (the Sources panel draws plain .row elements), so the set that
   gets patched is the same set, in the same document order. */
function detailNodes(){
  const out=[];
  const classes=['row','bigcard','hcard'];
  for(let c=0;c<classes.length;c++){
    const list=document.getElementsByClassName(classes[c]);
    for(let i=0;i<list.length;i++) out.push(list[i]);
  }
  return out;
}
function paintProgress(pkg){
  const inst=S.installing[pkg]; if(!inst) return;
  const html=getBtnHtml({pkg:pkg});
  const nodes=detailNodes();
  for(let i=0;i<nodes.length;i++){
    const el=nodes[i];
    if(el.getAttribute('data-detail')!==pkg) continue;
    const btn=el.querySelector('.get');
    if(btn) btn.outerHTML=html;
  }
  if(S.sheetPkg===pkg){
    const pill=document.querySelector('#sheetActions [data-busy]');
    if(pill){
      const fill=pill.querySelector('.fill'), lbl=pill.querySelector('span:last-child');
      if(fill) fill.style.width=inst.pct+'%';
      if(lbl) lbl.textContent=inst.pct+'%';
    }
  }
}
function pollInstall(){
  if(!hasNative) return;
  const p=B.progress(); if(!p.pkg) return;
  if(p.phase==='download'||p.phase==='installing'){S.installing[p.pkg]={pct:p.pct};paintProgress(p.pkg)}
  else if(p.phase==='success'){delete S.installing[p.pkg];toast('Installed - open it any time');refreshVisible();if(S.sheetPkg===p.pkg)openSheet(p.pkg);pollStop()}
  else if(p.phase==='failed'){delete S.installing[p.pkg];toast(p.error||'Install failed');refreshVisible();if(S.sheetPkg===p.pkg)openSheet(p.pkg);pollStop()}
  else if(p.phase!=='confirm'){
    /* An install that ended without a result.

       The bridge reports six phases: download and installing while it works,
       confirm while the installer is waiting for the reader, success and
       failed when it is over - and idle, which is what cancel() writes when a
       session is abandoned. This loop had a branch for four of them, so the
       fifth fell straight through and nothing ended the install the page was
       drawing.

       What that left: S.installing[pkg] was never deleted, so every copy of
       that app's Get button - the row, the card, the app page - kept drawing
       the progress ring, and getBtnHtml() draws the ring *instead of* the Get
       button, so the app could not be installed again from any of them for
       the rest of the session. pollStop() was never reached either, so the
       500 ms interval went on calling progress() - a synchronous bridge call
       across the WebView, building its JSON on the JavaScript thread - for
       ever, for an install that had been over since the first tick.

       Reproduced by driving the poller exactly as the bridge does - a live
       install, then phase "idle" - with the fix reverted: three rings still on
       screen, no Get button left on the app, S.installing holding the entry,
       pollTimer still set, and three progress() calls in the next 1.6 s. With
       the branch below: none of those, and the button is back.

       confirm is the one non-terminal phase outside the live pair - the
       installer is waiting for the reader to accept the package - so it keeps
       its ring and keeps the poller running, exactly as it did before.
       Nothing visual changes for any install that finishes or fails: those
       two branches above are untouched. */
    delete S.installing[p.pkg];refreshVisible();pollStop()
  }
}
/* The install poll belongs to an install, and only to an install.

   pollStart() used to be called from boot() and from doRefresh(), so every
   launch - and every refresh - opened a 500 ms interval that asked the bridge
   for install progress before any install existed, and pollStop() was reached
   only by an install that finished or by a catalogue that finished loading. A
   catalogue that never finishes - no network, every mirror down, the "Could
   not load" screen - therefore left that timer running for the rest of the
   session: two synchronous progress() calls across the WebView bridge every
   second, for ever, on a page that had nothing to report and no way to be rid
   of it. It is started by beginInstall() now, stopped by the terminal phase of
   the install that started it, and stopped by the error screen; a catalogue
   that merely finishes loading no longer stops it, because a refresh can land
   while an install is still running. */
let pollTimer=null;
function pollStart(){if(pollTimer||!hasNative)return;pollTimer=setInterval(pollInstall,500)}
function pollStop(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
/* true while any install is still in flight */
function installingNow(){for(const k in S.installing) return true; return false}
function refreshVisible(){
  if(!S.ready) return;
  const v=document.querySelector('.view.on'), top=v?v.scrollTop:0;
  if(S.view==='today') renderToday();
  else if(S.view==='search') runSearch();
  else if(S.view==='arcade') renderArcade(true);
  else renderCategoryView(S.view,true);
  const v2=document.querySelector('.view.on'); if(v2) v2.scrollTop=top;
  if(S.sheetPkg) renderSheetActions(B.detail(S.sheetPkg));
}

/* ---------- loader ---------- */
function showLoader(on,title,text,pct,action){
  $('#loader').classList.toggle('on',!!on);
  if(title) $('#loadTitle').textContent=title;
  if(text!==undefined) $('#loadText').textContent=text;
  if(pct!==undefined) $('#loadBar').style.width=Math.max(0,Math.min(100,pct))+'%';
  const b=$('#loadAction');
  if(action){b.style.display='grid';b.querySelector('span').textContent=action}else b.style.display='none';
  $('#spin').style.display=action?'none':'block';
}
function boot(){
  const st=B.state();
  if(st.phase==='ready'&&st.count>0){onReady();return}
  if(st.phase==='error'){showError(st);return}
  if(st.count>0) applyPartial(st); else showLoader(true,'Loading catalogue','Contacting the app repository\u2026',st.pct||0);
  $('#loadAction').onclick=null;
  B.load(false);
}
function showError(st){
  showLoader(true,'Could not load',st.error||'The catalogue could not be reached.',0,'Retry');
  /* nothing is loading any more, so nothing needs polling */
  if(!installingNow()) pollStop();
  $('#loadAction').onclick=function(){showLoader(true,'Loading catalogue','Contacting the app repository\u2026',0);$('#strip').classList.add('on');B.load(true)};
}
/* A failed refresh must not take the store with it.

   Every load ends in one of two states, and the page treated both the same:
   phase "error" put the full-screen "Could not load" card up, whatever the
   bridge was still holding. That is right for a first load - there is nothing
   behind the card - and wrong for a refresh, because a refresh that fails
   leaves the catalogue it was refreshing untouched: the index is still in
   memory, every list still answers, every app page still opens, and the saved
   copy on disk is still there for the next launch. The card covered all of it
   with an opaque background, so a reader who tapped Refresh on a flaky
   connection - or with all ten mirrors down, which is the case the error
   message is written for - lost the store they were using and could not get it
   back: Retry needs the network that just failed, and the back button quits
   the app. Measured from a good catalogue of 200 rows: one failed refresh left
   zero rows reachable.

   The card is for "nothing to show" only. With a catalogue in hand the failure
   is reported the way every other transient failure is - a toast - the
   progress strip goes away, and the store stays exactly where it was.

   "Exactly where it was" was still not true of the two halves of this the
   page cannot see. A refresh streams the new catalogue in batches, and every
   batch is published as it parses - so by the time the mirror dropped, the
   bridge was serving the prefix of the new catalogue rather than the one the
   reader had, and it was flagged partial. That flag is what getBtnHtml()
   draws as the greyed-out "..." placeholder on every Get button that is not
   already installed, and renderSheetActions() draws the same thing on an app
   page, so one failed refresh left the store readable and unable to install
   anything at all: measured on this page, a refresh that failed after the
   first batch left all 40 rows in place and 40 of 40 Get buttons dead, and
   nothing brings them back but a load that succeeds - which needs the
   connection that just failed.

   Both halves are undone now. The bridge puts the last complete catalogue
   back before it reports the failure (see StoreBridge.restoreComplete), which
   republishes it as a whole one, and this clears the flag and redraws so the
   buttons the reader can see match it. refreshVisible() keeps the loaded
   pages and the scroll position, so the list is the list they were reading -
   the same call the streaming batches and the 'installed' event already use. */
function refreshFailed(st){
  $('#strip').classList.remove('on');
  S.refreshing=false;
  S.partial=false;
  refreshVisible();
  toast('Could not refresh \u2014 '+(st.error||'the catalogue could not be reached.'));
}
function applyPartial(st){
  /* no B.stats() here: it belongs to the render that draws it - see the note
     on renderToday() */
  S.partial=!!st.partial;showLoader(false);
  $('#strip').classList.add('on');updateStrip(st);paintNow(false);
}
function updateStrip(st){
  const label=st.phase==='probe'?'Finding the fastest source':(st.phase==='parse'||st.phase==='apps')?'Reading catalogue':(st.phase==='cache'?'Opening saved catalogue':'Downloading catalogue');
  $('#stripBar').style.width=Math.max(0,Math.min(100,st.pct||0))+'%';
  $('#stripText').textContent=label+(st.detail?'  \u00b7  '+st.detail:'');
}
let lastPaint=0;
const PAINT_GAP=400;
function paintNow(force){
  const now=Date.now(); if(!force&&now-lastPaint<PAINT_GAP) return; lastPaint=now;
  if(S.view==='search') return;
  const v=document.querySelector('.view.on'), top=v?v.scrollTop:0;
  if(S.view==='today') renderToday(); else if(S.view==='arcade') renderArcade(true); else renderCategoryView(S.view,true);
  const v2=document.querySelector('.view.on'); if(v2) v2.scrollTop=top;
}
/* Redraw the visible view at most once per PAINT_GAP while the catalogue
   streams in, and always once more for the last batch.

   A load publishes the catalogue every BATCH apps (IndexLoader.BATCH, 250) as
   it parses, and the page treats each publish as "the catalogue changed
   underneath you". That is the right reading, but on a *refresh* it was paid
   in full every time: the store is already ready, so the 'apps' event went
   straight to refreshVisible(), which throws the visible list away and builds
   it again from every page the reader had scrolled to. A cold load never did
   this - while !S.ready the same event goes through paintNow(), which is
   throttled to one redraw per PAINT_GAP for exactly this reason - so the
   expensive path was the one the reader triggers deliberately.

   Measured on a 3000-app catalogue with 280 rows scrolled in: one refresh
   publishes twelve times and rebuilt those 280 rows twelve times, 3360 rows
   of HTML and about a second of the thread that is also painting, all to end
   up with the same list. The reader sees the list they are scrolling flicker
   and stall for the length of the download. On F-Droid's real index - about
   twice that - it is two seconds and twenty-four rebuilds.

   Trailing redraw matters: the GitHub half of the catalogue is merged in from
   the network seconds after the store is ready and arrives as a single
   'apps' publish (see the 'apps' branch below, which exists so it is not
   dropped). A leading-edge-only throttle could swallow it if a redraw had
   just run, so a timer guarantees the last event is always drawn, one gap
   later. Nothing about the drawing changes - refreshVisible() restores the
   scroll position and the pages already loaded, so the list is the same list
   either way, just built once instead of once per batch. */
let appsPaintT=0;
function refreshSoon(){
  const wait=PAINT_GAP-(Date.now()-lastPaint);
  if(wait<=0){ clearTimeout(appsPaintT); appsPaintT=0; lastPaint=Date.now(); refreshVisible(); return; }
  if(appsPaintT) return;
  appsPaintT=setTimeout(function(){ appsPaintT=0; lastPaint=Date.now(); refreshVisible(); },wait);
}
/* The store reaches "ready" twice in a session: once at the end of the load
   that filled it, and once at the end of every refresh the reader asks for.

   The two are not the same thing, and this function used to treat them as if
   they were. Its whole body is the cold-start path - build Today, Games, Apps,
   Arcade and Search from their first page - and that is exactly right when
   there is nothing on screen yet: five empty <section>s get their first rows.
   Run again over a store that is already drawn, the same five calls throw away
   the list the reader is reading and rebuild it from page one, at the top.

   A refresh reaches this line with all of that work already done properly.
   Every batch that streams in is drawn through refreshVisible(), which keeps
   the pages already scrolled to and puts the scroll position back (see the
   note on refreshSoon) - so for the length of the download the reader's place
   is preserved. Then the load publishes its last event and this function
   rebuilt all five views from scratch: measured on a 320-app catalogue with
   280 rows scrolled into Apps, the refresh that kept 280 rows and 20766px of
   scroll through every batch dropped to 40 rows at 0px on the ready event -
   the list collapsed under the reader and the rows above them were gone, at
   the exact moment the store told them the catalogue was updated.

   Search paid a second bill for the same rebuild. renderSearch() replaces the
   search field, so a refresh that landed while the reader was typing took the
   keyboard away mid-word - on Android that is the IME closing and the view
   jumping up, once per refresh - and re-drew the results from their first
   sixty while the reader was 220 rows into them.

   So only a cold start draws the store. A refresh redraws what is on screen
   through refreshVisible(), the same call the streaming batches and the
   'installed' event already use for "the catalogue changed underneath you":
   it keeps the loaded pages, restores the scroll position, leaves the search
   field (and its focus, and its query) alone, and patches the open sheet's
   actions. The views that are not on screen are not left stale by this -
   switchTab() rebuilds whichever one the reader moves to, from the catalogue
   as it stands now, which is what it already did for every view a refresh had
   never touched. */
let readyAt=0;
function onReady(){
  const st=B.state(); if(st.phase!=='ready') return;
  const now=Date.now(); if(now-readyAt<300) return; readyAt=now;
  const first=!S.ready; S.ready=true;S.partial=false;if(!installingNow()) pollStop();showLoader(false);
  $('#strip').classList.remove('on');
  const upd=B.list('','','updated',0,30);
  if(upd.apps.length){const day=Math.floor(Date.now()/86400000);S.featured=upd.apps[day%upd.apps.length]}
  if(first){
    renderToday();renderCategoryView('games');renderCategoryView('apps');renderArcade();renderSearch();
    if(S.sheetPkg){try{renderSheetActions(B.detail(S.sheetPkg))}catch(e){}}
  }else{
    /* a refresh: redraw the view that is on screen, in place - see above */

   the way down, the one the motion was bothering, kept roughly a fifth of a

   style work per 3 idle seconds, every one of them invisible.

var WIDE=matchMedia('(min-width:640px)');

     layers the sway moves - .lb and .lbx are not in the depth selector list,
     and the <img> fills the screen. So a reader who taps a screenshot and
     looks at it for a while paid the full ambient price for a document they
     could not see: measured with the viewer open, 54 style recalculations and

     viewer is exactly where a reader lingers, so it was the worst of the
     three. Pausing here is the same trade the sheet already makes: ambT stops

     where it left off. At 96% black the 4% that could still show through is

     the stage really is visible around the frame - still returns false above,

   because two of those three surfaces hold depth layers of their own that
   really do tilt: the sheet is .sheet-body>* and the loader card is .loadcard,
   both in the depth selector list, so pausing the tilt for either would be a
   change you can see. The viewer holds neither: it is z-index 130 over the
   whole frame on rgba(0,0,0,.96), and its only children are the <img> and the
   .lbx close button, neither of which is in that list.

   document nobody can see - and it is the most expensive restyle on the page:

   pointerleave has already sprung --dx/--dy back to rest, so the store behind

   that is paused here reports again on its next event, which is the same angle

/* scroll: compact nav title + pagination.

   Only the view on screen may act on a scroll event.

   All five views stay in the document and each one is its own scroll box, and
   a view that is not on screen is skipped by the stylesheet -
   .view:not(.on):not(.fading){content-visibility:hidden}. Skipping the contents
   also collapses that box: with nothing laid out inside it, scrollHeight falls
   back to clientHeight and the browser clamps scrollTop to 0. Changing scrollTop
   fires a scroll event, so leaving a scrolled view fires exactly one more of
   them, on the view being left, the moment its fade-out ends and .fading is
   dropped (see switchTab).

   Both scroll handlers - this one and bindScrollParallax() above - then
   treated it as a reader scrolling:

   - Pagination. The near-the-end test was scrollTop+clientHeight < scrollHeight-400,
     which for a collapsed box is 0+clientHeight < clientHeight-400 - false, so it
     read as "the reader is at the bottom" and pulled the next page in. Measured
     on a 420-app catalogue, four tab switches away from a part-loaded Apps list:
     one list('', '', 'name', 40, 40) each time - a synchronous bridge call that
     builds and sorts the page in Java and ships it back as JSON - and forty rows
     of HTML inserted into a view nobody can see, 40 rows growing to 80, then
     thrown away by the next renderCategoryView(). 3-5 ms of JavaScript thread per
     switch on a desktop CPU, several times that on a phone, for output that is
     always discarded. It also left S.pages['apps:'].offset ahead of the rows that
     exist, which is the count refreshVisible()/paintNow() restore from.

   - Parallax. The same event reached bindScrollParallax(), where scrollTop is now
     0, so setScrollOffset() wrote --sy=0 over the offset of the view the reader
     had just moved to. Measured: scroll Apps to 500, switch to Games, scroll Games
     to 300 - --sy on .stage reads 300, then snaps to 0 about 600 ms later while
     the reader is still on Games. The background and Today's cards lost their lag
     and only got it back on the next scroll event.

   The view being left can show neither of them, so both handlers return here. The
   view on screen is unaffected: it carries .on, its box is not collapsed, and its
   own scroll events take the same path they always did. */
document.querySelectorAll('.view').forEach(function(v){
  v.addEventListener('scroll',function(){
    if(!v.classList.contains('on')) return;
    $('#navbar').classList.toggle('show',v.scrollTop>50);
    if(!S.ready) return;

/* ================= Bounce + water sound ================= */
(function(){
  var SEL='button,.press,[data-detail],[data-cat],.tab,.chip,.mi,.get,.pill,.pill2,.bigget,.iconbtn,.avatar,.row,a[href]';

     second pointer's pointerdown overwrote both: the first control's press
     animation was never cancelled, and it is created with fill:'forwards', so
     it goes on holding that control at 0.86-0.97 scale. Press a row with one
     thumb and another row with the other, then lift both: the first row stays
     at scale 0.97 with a finished animation still in effect - a control left
     visibly smaller than the ones beside it until its list happens to be
     re-rendered, plus an animation object the document keeps alive with it.

     the one-finger path is exactly what it was: one entry in, one entry out. */

    }catch(e){}
  }
  function release(el){
    if(!canAnim||!el)return;
    /* the control's own press animation, not whatever was pressed last */
    var held=pressed.get(el);
    if(held){held.cancel();pressed.delete(el)}
    try{
      var s=depth(el);
      el.animate([
        {scale:String(s)},
        {scale:String(Math.min(1.12,1+(1-s)*0.9)),offset:.35},
        {scale:String(1-(1-s)*0.3),offset:.6},
        {scale:String(1+(1-s)*0.12),offset:.82},
        {scale:'1'}
      ],{duration:520,easing:'cubic-bezier(.2,.8,.3,1)'});
    }catch(e){}
  }

  var ac=null;

    try{
      if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}

    var c=ctx();if(!c)return;

    bloop(c,t+0.07,520,1500,0.17,0.16);  /* small bubble */
    bloop(c,t+0.15,210, 560,0.22,0.14);  /* low glug   */

  }

    ctx();                               /* unlock audio on first touch */
    var el=e.target.closest&&e.target.closest(SEL);
    if(!el||el.disabled)return;
    downBy.set(e.pointerId,el);
    pressIn(el);
  },true);
  /* release the control this pointer pressed - a finger that lifts must not
     let go of a control another finger is still holding */
  function up(e){
    var el=downBy.get(e.pointerId);
    if(el===undefined)return;
    downBy.delete(e.pointerId);

  }
  document.addEventListener('pointerup',up,true);
  document.addEventListener('pointercancel',up,true);

  /* Get / Update button -> water sound */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-install]');
    if(b)waterSound();
  },true);
})();

    var any=[].some.call(row.children,function(c){return c.style.display!=='none'});
    if(!any){row.style.display='none';var pv=row.previousElementSibling;if(pv&&pv.classList.contains('eyebrow'))pv.style.display='none'}
  },0);
},true);
