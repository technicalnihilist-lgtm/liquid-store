// panel drawn with the platform shape and lit by a circular-corner field is subtly wrong at
// exactly the place the eye checks. Swapping the corner's L2 norm for an Ln one fixes the
// outline without changing anything else; the field is no longer a true Euclidean distance in
// the corner, but its zero set is exact and its gradient points the right way, which is all
// the refraction and the lighting read from it.
float sdRoundRect(float2 p, float2 halfSize, float4 r) {
    float2 rr = (p.x > 0.0) ? r.yz : r.xw;
    float radius = (p.y > 0.0) ? rr.y : rr.x;
    radius = min(radius, min(halfSize.x, halfSize.y));
    float2 q = abs(p) - halfSize + radius;
    return min(max(q.x, q.y), 0.0) + lnNorm(max(q, float2(0.0)), uCornerPower) - radius;
}

// Two shapes fused rather than merely overlapped: the polynomial smooth minimum, which pulls
// the surface out by up to k/4 where the two outlines cross and leaves each alone beyond k.
//
// This is what a tab bar does under a finger on iOS 27. The selection lens is proud of the bar,
// and where its outline crosses the bar's the silhouette does not make a crease: it bows out to
// meet it. Measured on the reference at the settled lens, the bar's top edge is 12 px above both
// outlines at the crossing and rejoins the flat run about 40 px away, which is k = 48 px, 16 pt
// (FINDINGS 23).
float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}


// The sRGB transfer is approximated as gamma 2.0 rather than the exact piecewise 2.4. The error
// is a fraction of a code value, on a term that is itself a highlight, and it buys three squares
// and three square roots in place of six pow calls.
float3 toLinearApprox(float3 c) { return c * c; }
float3 fromLinearApprox(float3 c) { return sqrt(max(c, float3(0.0))); }

float3 linearToOklab(float3 c) {
    float l = 0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b;
    float m = 0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b;
    float s = 0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b;
    float l_ = pow(max(l, 0.0), 0.3333333333);
    float m_ = pow(max(m, 0.0), 0.3333333333);
    float s_ = pow(max(s, 0.0), 0.3333333333);
    return float3(
        0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
        1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
        0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_);
}

float3 oklabToLinear(float3 lab) {
    float l_ = lab.x + 0.3963377774 * lab.y + 0.2158037573 * lab.z;
    float m_ = lab.x - 0.1055613458 * lab.y - 0.0638541728 * lab.z;
    float s_ = lab.x - 0.0894841775 * lab.y - 1.2914855480 * lab.z;
    float l = l_ * l_ * l_;
    float m = m_ * m_ * m_;
    float s = s_ * s_ * s_;
    return float3(
         4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
}

// Apply \`amount\` of highlight to \`col\`. \`chroma\` crossfades between adding white, which is what
// this did before and what the measured presets still do, and raising lightness and chroma in
// Oklab. Lightness is deliberately allowed past its own ceiling: the core of a lobe should still
// clip to white, which is what a specular does, and only the shoulder should stay coloured. That
// asymmetry is most of the difference between glass that glows and a white overlay.
half3 applyHighlight(half3 col, float amount, float chroma) {
    if (amount <= 0.0) {
        return col;
    }
    half3 additive = col + half3(half(amount));
    if (chroma <= 0.0) {
        return additive;
    }
    float3 lab = linearToOklab(toLinearApprox(float3(col)));
    lab.x = lab.x + amount * 0.90;
    lab.yz = lab.yz * (1.0 + amount * 1.20);
    half3 lifted = half3(fromLinearApprox(clamp(oklabToLinear(lab), float3(0.0), float3(1.0))));
    return mix(additive, lifted, half(clamp(chroma, 0.0, 1.0)));
}


// One backdrop sample, bounded by the region that actually holds recorded pixels.
//
// The layer is filled with the ground before the backdrop is drawn into it, so it is opaque by
// construction and any alpha shortfall here is filtering error at its own boundary rather than
// real transparency. Dividing it out reconstructs the colour; compositing toward the ground
// instead paints a halo of the ground colour around every panel.
// The shape, as a signed distance in px: negative inside, zero on the outline.
//
// Rectangles, rounded rectangles, capsules, circles and squircles all have a closed form and
// are evaluated directly. Anything else - a star, a blob, a hand-drawn GenericShape - has no
// closed form, so the host rasterises it once and measures it, and this reads the measurement.
// The two paths are interchangeable from here on: everything downstream asks the same two
// questions of whichever one is in play.
float sdShape(float2 p, float2 halfSize) {
    if (uBodyKind > 0.5) {
        // A selector body joins a neighbour through the same neck (GlassTabBarAccessory.lensFusion).
        float b = (uBodyKind > 1.5) ? poseQuery(p, uPoseA, uPoseAInv, uPoseC, uPoseD).x : bodyQuery(p, uBody, uBodyY).x;
        if (uFuseShape.y > 0.0) {
            b = smin(b, sdRoundRect(p - uFuse.xy, uFuse.zw, float4(uFuseShape.x)), uFuseShape.y);
        }
        return b;
    }
    if (uShapeKind < 0.5) {
        float d = sdRoundRect(p, halfSize, uRadii);
        if (uFuseShape.y > 0.0) {
            d = smin(d, sdRoundRect(p - uFuse.xy, uFuse.zw, float4(uFuseShape.x)), uFuseShape.y);
        }
        return d;
    }
    // Field coordinates are the padded layer's, so undo the centring the caller applied \u2014 and
    // then scale into the field's own resolution, which is lower than the layer's because a
    // distance field is smooth and bilinear sampling puts back more than the halving takes out.
    float2 layerCoord = (p + halfSize + float2(uPad)) * uFieldScale;
    float stored = float(field.eval(layerCoord).r);
    return (stored - 0.5) * 2.0 * uFieldRange;
}

half3 backdropAt(float2 p) {
    float2 q = clamp(p, uBackdrop.xy, uBackdrop.zw);
    half4 c = content.eval(q);
    return (c.a > half(0.004)) ? c.rgb / c.a : half3(uBase);
}

float2 rotate(float2 v, float2 rot) {
    return float2(v.x * rot.x - v.y * rot.y, v.x * rot.y + v.y * rot.x);
}

// A cheap per-pixel angle; any hash with no visible structure will do.
float2 tapRotation(float2 coord) {
    float3 q = fract(float3(coord.x, coord.y, coord.x) * 0.1031);
    q += dot(q, q.yzx + 33.33);
    float a = fract((q.x + q.y) * q.z) * 6.2831853;
    return float2(cos(a), sin(a));
}

// Nineteen taps: three rings of six at staggered angles plus the centre. Too few to blur
// legible text on their own, so the whole pattern is rotated per pixel and the ghosts break up
// into noise, which the eye integrates as blur. Only ever called with a radius that falls to
// zero at the rim, so the expensive case never coincides with the case that needs detail.
half3 blurredAt(float2 p, float radius, float2 rot) {
    if (radius < 0.5) {
        return backdropAt(p);
    }
    if (radius < 4.0) {
        // The measured fine kernel is under a point, and a sub-point Gaussian needs no nineteen
        // taps: a rotated square at 0.8 of the radius plus a double-weighted centre is within
        // noise of it and costs a quarter as much. Measured on a Pixel 7 with six panels: the
        // frame time this saves is the difference between the material and the budget.
        float r = radius * 0.8;
        half3 sum = backdropAt(p) * half(2.0);
        sum += backdropAt(p + r * rotate(float2( 1.0,  0.0), rot));
        sum += backdropAt(p + r * rotate(float2( 0.0,  1.0), rot));
        sum += backdropAt(p + r * rotate(float2(-1.0,  0.0), rot));
        sum += backdropAt(p + r * rotate(float2( 0.0, -1.0), rot));
        return sum * half(1.0 / 6.0);
    }
    float inner = radius * 0.55;
    float mid = radius * 0.8;
    half3 sum = backdropAt(p);
    sum += backdropAt(p + inner * rotate(float2( 1.000,  0.000), rot));
    sum += backdropAt(p + inner * rotate(float2( 0.500,  0.866), rot));
    sum += backdropAt(p + inner * rotate(float2(-0.500,  0.866), rot));
    sum += backdropAt(p + inner * rotate(float2(-1.000,  0.000), rot));
    sum += backdropAt(p + inner * rotate(float2(-0.500, -0.866), rot));
    sum += backdropAt(p + inner * rotate(float2( 0.500, -0.866), rot));
    sum += backdropAt(p + radius * rotate(float2( 0.866,  0.500), rot));
    sum += backdropAt(p + radius * rotate(float2( 0.000,  1.000), rot));
    sum += backdropAt(p + radius * rotate(float2(-0.866,  0.500), rot));
    sum += backdropAt(p + radius * rotate(float2(-0.866, -0.500), rot));
    sum += backdropAt(p + radius * rotate(float2( 0.000, -1.000), rot));
    sum += backdropAt(p + radius * rotate(float2( 0.866, -0.500), rot));
    sum += backdropAt(p + mid * rotate(float2( 0.966,  0.259), rot));
    sum += backdropAt(p + mid * rotate(float2( 0.259,  0.966), rot));
    sum += backdropAt(p + mid * rotate(float2(-0.707,  0.707), rot));
    sum += backdropAt(p + mid * rotate(float2(-0.966, -0.259), rot));
    sum += backdropAt(p + mid * rotate(float2(-0.259, -0.966), rot));
    sum += backdropAt(p + mid * rotate(float2( 0.707, -0.707), rot));
    return sum * half(1.0 / 19.0);
}

// The measured material's fine term is one-dimensional (MODEL.md section 2a, FINDINGS 22): it
// carries detail along a bar and none at all across it. Two readings of the Photos toolbar pill
// pin it down. Where the target's 8 px stripe band ends under the pill the detail stops within
// two rows, so nothing is averaged across; and the target's 20-row black band under the same
// pill leaves no step at all, though it is a 122-level boundary. Content that does not vary
// along the bar produces no fine term, which is what a high-pass along one axis does.
//
// So the detail is the fine sample minus the backdrop averaged along the element's long axis,
// five taps spanning the along-axis wide kernel, jittered per pixel so periodic content does not
// beat against the tap spacing. Five rather than seven: the pair at 2.25 sigma carries 5% of the
// weight and cost 1.5 ms a frame on an S24.
half3 axisMeanAt(float2 p, float span, float2 rot) {
    float2 t = (uSize.x >= uSize.y) ? float2(1.0, 0.0) : float2(0.0, 1.0);
    float k = span * (0.85 + 0.3 * abs(rot.x));
    half3 sum = backdropAt(p);
    half3 acc = (backdropAt(p + t * (0.75 * k)) + backdropAt(p - t * (0.75 * k))) * half(0.7548);
    acc += (backdropAt(p + t * (1.60 * k)) + backdropAt(p - t * (1.60 * k))) * half(0.4043);
    return (sum + acc) * half(1.0 / 3.3182);
}

float luma(half3 c) {
    return dot(float3(c), float3(0.2126, 0.7152, 0.0722));
}

// Superellipse bevel height h(e) = T * (1 - (1-e)^p)^(1/p), for e = depth/band in [0,1].
// This returns dh/ds, the surface slope: p = 2 is a true circular arc, p = 4 the
// squircle-matched profile. The slope is 0 at the inner edge of the band and diverges at the
// rim, so e is clamped a hair inside both ends.
float bevelSlope(float e, float p) {
    float u = 1.0 - clamp(e, 0.002, 0.998);
    float up = pow(u, p);
    return pow(u, p - 1.0) / pow(max(1.0 - up, 1e-4), 1.0 - 1.0 / p);
}

// Exact Snell deviation for a surface of that slope, returned as tan(theta - theta_t) via the
// tangent difference identity, so it contains no transcendental at all.
//
// The usual shortcut is slope * (1 - 1/n), which overestimates by about a fifth at this
// profile's own peak and diverges at the rim, which is why every shader that uses it also
// carries an ad-hoc clamp. The exact form is self-bounding: as the slope goes vertical it
// tends to sqrt(n^2 - 1), so no clamp is needed and the index of refraction becomes a knob on
// the shape of the falloff rather than on its magnitude.
float snellShift(float slope, float ior) {
    float inv = inversesqrt(1.0 + slope * slope);
    float si = slope * inv;
    float ci = inv;
    float st = si / max(ior, 1.0001);
    float ct = sqrt(max(1.0 - st * st, 0.0));
    return (si * ct - ci * st) / max(ci * ct + si * st, 1e-4);
}


// One radial source field for a standalone lens, shared verbatim by material and ink.
// f(r) = r [1 - m (1-r^2)^2], 0<=r<=1. f(1)=1 and f'(1)=1;
// f'(r)>=1-m>0 for m<=0.6, so it cannot fold or hide an internal annulus.
float2 clearLensDelta(float2 p, float2 halfSize, float magnification) {
    float2 q = p / max(halfSize, float2(0.001));
    float r2 = clamp(dot(q, q), 0.0, 1.0);
    float shoulder = 1.0 - r2;
    return -p * (clamp(magnification, 0.0, 0.6) * shoulder * shoulder);
}

// The lens under a finger on a tab bar (FINDINGS 19; measured model, section 2c). Over the outer
// half of the band a pixel at depth u shows the exterior from 1.3u - 0.29 W: the content just
// outside the rim is pulled in and compressed 1.3x (the bar's own edge line lands 10 px inside
// the lens's rim, the header text above an App Store bar becomes a thin stripe along it). From
// half the band inward the content is shown where it is. The source content between 0.36 W and
// 0.5 W is never displayed: the seam hides the bar's end and the gap beside it when the lens
// hangs over the end of a bar. Blended from identity, so a resting indicator in the same family
// has no optics at all.
float heldSource(float u) {
    return (u < 0.5) ? (1.3 * u - 0.29) : u;
}

// The same outward correspondence, connected to the interior instead of cut at half the band.
//
// The captures never established that the 0.14 W step at u = 0.5 was a true discontinuity, and a
// smooth ray path meeting one source plane has a continuous source coordinate, so the sharp ink
// map does not carry that jump (V3-MODEL section 10.3). w(u) fades the outward term out across
// 0.45..0.55; below 0.45 this is exactly 1.3u - 0.29 and above 0.55 it is identity. The 1.3 and
// 0.29 are inherited effective-map values, not a recovered index or thickness, and the
// connection band is authored regularization.
float heldSourceContinuous(float u) {
    float w = 1.0 - smoothstep(0.45, 0.55, u);
    return u + w * (0.3 * u - 0.29);
}


// The lens of chrome at rest, at the curved parts of an outline only (FINDINGS 18): the shipping map. A
// pixel at depth u = d/W inside a rounded end shows the ring 0.55 W (0.33 R) inside, the same ring for the
// whole of 0.14-0.38 W, then eases to identity by 0.76 W; the outer 0.14 W shows slightly deeper content
// again. A straight run shows none of it (the dock's top edge leaves a boundary 30 px inside in place).
float restSourceLegacy(float u) {
    if (u >= 0.76) {
        return u;
    } else if (u >= 0.62) {
        return 0.64 + 0.857 * (u - 0.62);
    } else if (u >= 0.38) {
        return 0.55 + 0.375 * (u - 0.38);
    } else if (u >= 0.14) {
        return 0.55;
    }
    return 0.55 + 0.93 * (0.14 - u);
}

// The measured resting-corner map (GlassRestMap.Measured; GlassRestMapTable is the authority and this text
// is generated from it). Fitted on the Photos toolbar's 72 px ends over 190 measured landmark pairs: the
// source depth falls from 0.876 W at the rim band's inner edge to a minimum of 0.643 W at 0.44 W, rises
// again and meets identity at 0.833 W with slope 1. Below 0.139 W (d < 6 px at R = 72) it is a constant,
// unmeasured extension. At radii other than 72 reference px this is a scale extrapolation.
float restSourceMeasured(float u) {
    if (u >= 0.833333) {
        return u;
    }
    if (u >= 0.729167) {
        float h = 0.104166;
        float t = (u - 0.729167) / h;
        float t2 = t * t;
        float t3 = t2 * t;
        return (2.0 * t3 - 3.0 * t2 + 1.0) * 0.745278 + (t3 - 2.0 * t2 + t) * h * 0.608446
            + (-2.0 * t3 + 3.0 * t2) * 0.833333 + (t3 - t2) * h * 1.000000;
    }
    if (u >= 0.625000) {
        return 0.681898 + 0.608446 * (u - 0.625000);
    }
    if (u >= 0.532407) {
        return 0.649884 + 0.345750 * (u - 0.532407);
    }
    if (u >= 0.439815) {
        return 0.642755 + 0.076994 * (u - 0.439815);
    }
    if (u >= 0.347222) {
        return 0.661713 + -0.204746 * (u - 0.347222);
    }
    if (u >= 0.300926) {
        return 0.681921 + -0.436496 * (u - 0.300926);
    }
    if (u >= 0.254630) {
        return 0.711296 + -0.634504 * (u - 0.254630);
    }
    if (u >= 0.219907) {
        return 0.741898 + -0.881317 * (u - 0.219907);
    }
    if (u >= 0.185185) {
        return 0.784259 + -1.220005 * (u - 0.185185);
    }
    if (u >= 0.162037) {
        return 0.823079 + -1.677033 * (u - 0.162037);
    }
    if (u >= 0.138889) {
        return 0.875903 + -2.282012 * (u - 0.138889);
    }
    return 0.875903;
}

float restSource(float u) {
    return (uRestMap > 0.5) ? restSourceMeasured(u) : restSourceLegacy(u);
}


// Whether a point's nearest bit of outline is a corner arc (1) or a straight run (0), with a
// short blend along the run so the rest lens does not begin at a seam. Inside a corner's own
// quadrant both q components are positive; along a run one is negative by the distance to the
// arc. A circle is all arc. Radii are clamped as sdRoundRect clamps them.
float cornerWeight(float2 p, float2 halfSize, float4 r) {
    float2 rr = (p.x > 0.0) ? r.yz : r.xw;
    float radius = (p.y > 0.0) ? rr.y : rr.x;
    radius = min(radius, min(halfSize.x, halfSize.y));
    float2 q = abs(p) - halfSize + radius;
    float soft = max(radius * 0.2, 1.0);
    return smoothstep(-soft, 0.0, min(q.x, q.y));
}

// The measured cover-sheet lens, as a lookup: a pixel at depth u = d/W inside the edge shows
// backdrop content from depth s = foldSource(u) * W. Fitted on 13k frames of a real finger pull
// and reproduced at Tint 0, 50 and 100 (MODEL.md section 5): identity from 0.9 W inward; a 2x
// stretch over 0.52-0.9 W showing 0.71-0.9 W; a stationary seam at 0.70 W over 0.28-0.52 W;
// and the outer 0.28 W showing 0.71-1.07 W upside down. Content 0-0.69 W inside the edge is never
// displayed and nothing outside the edge is sampled. Static chrome and a committed (fast) pull
// show none of it, only a slight inward offset, so \`formation\` blends between the two.
float foldSource(float u, float formation, float corner) {
    float full;
    if (u >= 0.9) {
        full = u;
    } else if (u >= 0.52) {
        full = 0.71 + 0.5 * (u - 0.52);
    } else if (u >= 0.28) {
        full = 0.70;
    } else {
        full = 0.71 + 1.2857 * (0.28 - u);
    }
    // At rest a straight run shows almost nothing: a fast sheet pull shows only a 2-7 px inward
    // offset across its 90 px band (FINDINGS 1b-iii), and the dock's top edge leaves what is
    // under it in place. A corner arc at rest shows the measured rest lens (restSource). Both
    // give way to the full fold as the lens forms under a tracked drag.
    // The straight-run candidate of V3-MODEL section 10.2: f(u) = u + a (1-u)^3, which joins
    // identity in value, first and second derivative and, for a > 1/3, folds once at
    // uFold = 1 - 1/sqrt(3a) with minimum source depth 1 - 2/(3 sqrt(3a)). Page structure
    // therefore appears twice near a straight edge, with opposite orientation, which is the
    // mechanism the reference shows. \`a\` is authored, not measured. At 0 this degenerates to the
    // shallow inward offset the measured sheet pull showed, which every existing consumer keeps.
    float v = 1.0 - u;
    float straight = (uEdgeFold > 0.0)
        ? (u + uEdgeFold * v * v * v)
        : (u + 0.06 * v * v);
    float rest = mix(straight, restSource(u), clamp(corner, 0.0, 1.0));
    return mix(rest, full, clamp(formation, 0.0, 1.0));
}


// GlassStyle.rimMirrorGain: how much deeper content the mirrored rim reaches per unit of band.
// 1 (or unset) is the plain mirror; below 1 the cap content is drawn out radially toward the rim.
float rimGain() { return (uRimMirrorGain > 0.0) ? clamp(uRimMirrorGain, 0.05, 1.0) : 1.0; }

// The measured family's source map, or the reflective rim (GlassStyle.rimMirror): within b of
// the band a pixel at depth u shows depth 2b - u, mirrored about b; inside it, identity.
// A moving held lens (GlassStyle.rimMirror with the held family): blend the held map toward the
// reflective rim at its caps by uFormation, here the lens's travel. Still lenses keep the map.
float heldMirror(float u, float map, float corner) {
    if (uRimMirror <= 0.0) return map;
    float b = clamp(uRimMirror, 0.0, 1.0);
    float mirrored = (u < b) ? (b + (b - u) * rimGain()) : u;
    float k = clamp(uFormation, 0.0, 1.0) * mix(1.0, corner, clamp(uFoldCorners, 0.0, 1.0));
    return mix(map, mirrored, k);
}

// The colour-split zone of the measured family: the fold's measured outer 0.28, or the
// reflective rim's own mirrored band when GlassStyle.rimMirror is set.
float rimZone(float u) {
    if (uRimMirror <= 0.0) return 1.0 - smoothstep(0.24, 0.32, u);
    float b = clamp(uRimMirror, 0.0, 1.0);
    return 1.0 - smoothstep(b * 0.8, b * 1.1, u);
}

float measuredSource(float u, float formation, float corner) {
    if (uRimMirror <= 0.0) return foldSource(u, formation, corner);
    float b = clamp(uRimMirror, 0.0, 1.0);
    float mirrored = (u < b) ? (b + (b - u) * rimGain()) : u;
    return mix(u, mirrored, clamp(formation, 0.0, 1.0));
}

// The wide tone kernel. The host records a quarter-scale copy of the padded backdrop under a
// real Gaussian blur into a strip below the sharp copy; sampling it is one bilinear tap. It only
// ever decides the material's tone, never its detail.
half3 wideAt(float2 p) {
    float2 q = clamp(p, uBackdrop.xy, uBackdrop.zw);
    float2 c = float2(q.x * uWideScale, uWideStrip + q.y * uWideScale);
    half4 s = content.eval(c);
    return (s.a > half(0.004)) ? s.rgb / s.a : half3(uBase);
}

// Tone-map one tint colour across the backdrop's brightness, the way a pane of coloured glass
// does: it darkens and saturates over bright ground, lifts and desaturates over dark ground,
// and stays recognisably the same colour throughout. At uAdaptive 0 it does nothing at all,
// which is what Apple's clear variant requires \u2014 it "does not have adaptive behaviours".
half3 toneMappedTint(half3 tint, float bgLuma, float adapt) {
    float g = clamp(bgLuma, 0.0, 1.0);
    float value = mix(1.0, mix(1.10, 0.88, g), adapt);
    float sat   = mix(1.0, mix(0.88, 1.06, g), adapt);
    half mean = half(dot(float3(tint), float3(1.0 / 3.0)));
    half3 shifted = half3(mean) + (tint - half3(mean)) * half(sat);
    return clamp(shifted * half(value), half3(0.0), half3(1.0));
}

// The outer contour's opacity at a pixel [band] deep in its profile, for an outline normal [n]:
// zero at the lit poles (or uOuterContour.y of the side value), full at the unlit sides.
float outerContourAlpha(float2 n, float band) {
    float side = pow(max(1.0 - abs(dot(n, uLight)), 0.0), 0.75);
    return clamp(band * uOuterContour.x * mix(uOuterContour.y, 1.0, side), 0.0, 1.0);
}

half4 main(float2 coord) {
    // The panel is inset inside the padded backdrop.
    float2 local = coord - float2(uPad);
    float2 halfSize = uSize * 0.5;
    float2 p = local - halfSize;

    float d = sdShape(p, halfSize);
    float coverage = 1.0 - smoothstep(-0.75, 0.75, d);
    // The contour outside the outline (GlassStyle.outerContour): about 1.5 px wide, centred
    // 0.25 px outside, so the outermost wholly covered pixel is untouched, as measured.
    float outerBand = (uOuterContour.x > 0.0) ? clamp(1.0 - abs(d - 0.25) / 0.75, 0.0, 1.0) : 0.0;
    if (coverage <= 0.0) {
        if (outerBand <= 0.0) return half4(0.0);
        // Wholly outside: only the contour. Black at its opacity darkens what is behind it.
        float oe = 1.0;
        float2 og = float2(sdShape(p + float2(oe, 0.0), halfSize) - sdShape(p - float2(oe, 0.0), halfSize),
            sdShape(p + float2(0.0, oe), halfSize) - sdShape(p - float2(0.0, oe), halfSize));
        float2 on = og / max(length(og), 1e-5);
        return half4(0.0, 0.0, 0.0, half(outerContourAlpha(on, outerBand)));
    }
    if (uDebugCoverage > 0.5) {
        // Padding/coordinate diagnostic (Astra round 7): the geometry, field, recording and draw-back path
        // exactly as in production, with the material replaced by a flat colour, so a silhouette can be read
        // from coverage alone.
        return half4(1.0, 0.0, 1.0, 1.0) * half(coverage);
    }

    float scale = clamp(uScale, 0.0, 1.0);

    // Geometry. A one-pixel epsilon collapses the gradient magnitude from 1 to 0 to 1 across
    // the medial axis of a pill and leaves a one-pixel seam of zero refraction down its middle.
    // Widening the epsilon to the scale of the band lets the two sides cancel gradually, and
    // the gradient magnitude that falls out doubles as a confidence term that fades the lens
    // toward the axis instead of letting its direction flip.
    //
    // When the shape is analytic and its band stops short of the axis, none of that applies and
    // the normal has a closed form: four fewer field evaluations per pixel, and no fade.
    float inradius = min(halfSize.x, halfSize.y);
    float2 n;
    float axisFade;
    if (uBodyKind > 1.5) {
        // The pose body carries its own transformed normal from the same shared query that
        // produced d, so a deforming outline never falls back to a differenced estimate.
        float4 pq = poseQuery(p, uPoseA, uPoseAInv, uPoseC, uPoseD);
        n = float2(pq.y, pq.z);
        axisFade = 1.0;
    } else if (uBodyKind > 0.5) {
        // The V3 body carries its own exact normal from the same shared query that produced d,
        // so a deforming outline never falls back to a differenced estimate of itself.
        float4 bq = bodyQuery(p, uBody, uBodyY);
        n = float2(bq.y, bq.z);
        axisFade = 1.0;
    } else if (analyticNormalEligible(uShapeKind, uRefractBand, halfSize, uFuseShape.y) > 0.5) {
        // The shared closed-form normal (GlassNormalSource.kt); the content and container shaders take
        // the same decision for equivalent geometry, so the three paths bend alike.
        n = analyticNormal(p, halfSize, uRadii, uCornerPower, uProfile);
        axisFade = 1.0;
    } else {
        float eps = clamp(uRefractBand * 0.3, 1.0, 16.0);
        float2 ex = float2(eps, 0.0);
        float2 ey = float2(0.0, eps);
        float2 g = float2(
            sdShape(p + ex, halfSize) - sdShape(p - ex, halfSize),
            sdShape(p + ey, halfSize) - sdShape(p - ey, halfSize));
        float gLen = length(g);
        n = g / max(gLen, 1e-5);
        axisFade = smoothstep(0.15, 0.80, gLen / (2.0 * eps));
    }

    float depth = max(-d, 0.0);

    // A dome field for wide shapes whose band reaches their own centre line.
    //
    // Distance-to-edge collapses along the medial axis of a long pill: the two sides cancel, the
    // gradient has no direction, and the fade above gives up refraction exactly down the spine.
    // Past an aspect ratio of 1.5, and once the band approaches the inradius, blend the distance
    // field into a dome instead \u2014 a smooth rectangular radius that is zero at the centre and one
    // on every edge, with a closed-form gradient everywhere and no axis to collapse on. The idea
    // is chrisbanes/haze's; the blend into our own field and profile is ours.
    //
    // Only the refraction reads this. The lighting keeps the true distance, because the lit edge
    // belongs to the outline and not to the dome.
    float aspect = max(halfSize.x, halfSize.y) / max(min(halfSize.x, halfSize.y), 1e-4);
    float domeWeight = (uBodyKind > 0.5) ? 0.0 :
        smoothstep(1.5, 3.0, aspect) *
        smoothstep(0.75, 1.0, uRefractBand / max(inradius, 1e-4));
    float opticalDepth = depth;
    if (domeWeight > 0.001) {
        float2 q = p / max(halfSize, float2(1e-4));
        float2 q2 = q * q;
        float domeRadius = sqrt(clamp(q2.x + q2.y - q2.x * q2.y, 0.0, 1.0));
        opticalDepth = mix(depth, (1.0 - domeRadius) * uRefractBand, domeWeight);
        float2 domeGrad = float2(q.x * (1.0 - q2.y), q.y * (1.0 - q2.x));
        float domeLen = length(domeGrad);
        if (domeLen > 1e-4) {
            n = normalize(mix(n, domeGrad / domeLen, domeWeight));
        }
        axisFade = mix(axisFade, 1.0, domeWeight);
    }

    float e = clamp(opticalDepth / max(uRefractBand, 0.001), 0.0, 1.0);
    float pw = max(uBevelPower, 1.5);
    float slope = bevelSlope(e, pw);

    // Refraction, normalised by the shift at the rim so uRefractDepth is literally the peak
    // displacement in px. Faded over the inner quarter of the band so the warp field is C1
    // where it meets the flat interior; a kink there resamples as a visible ring. The 1.5px
    // guard stops the outermost antialiased pixel fetching from beyond coverage.
    float bend = snellShift(slope, uIor) / max(snellShift(bevelSlope(0.0, pw), uIor), 1e-4);
    bend *= smoothstep(1.0, 0.75, e) * axisFade * smoothstep(0.0, 1.5, depth);
    // The dome has no rim of its own, so its bend must still die at the real outline.
    bend *= mix(1.0, smoothstep(0.0, 2.0, depth), domeWeight);
    bend = clamp(bend, 0.0, 1.0);

    float mat = clamp(uMaterialize, 0.0, 1.0);
    float lens = uRefractDepth * mix(0.85, 1.25, scale) * mat;

    // The touch magnifier. Apple describes the material moving in tandem with the interaction
    // and illuminating from within, starting under the fingertip; this is the optical half of
    // that \u2014 the backdrop swells slightly toward the finger. A Gaussian of sigma = the panel's
    // short edge, so a press near one end still lifts the far end a little, which is what lets
    // a press on one member of a container light its neighbours with no extra term.
    float2 touchDelta = local - uTouch;
    float touchSigma = max(min(uSize.x, uSize.y), 1.0);
    float touchFall = exp(-dot(touchDelta, touchDelta) / (touchSigma * touchSigma))
        * clamp(uTouchAmt, 0.0, 1.0);
    float2 base = coord - touchDelta * (touchFall * 0.17);
    // Interior magnification of the held lens ([GlassStyle.heldMagnification]): the aperture
    // zooms about the body's centre, so the held item reads larger and the bar's own edge is
    // carried outward inside the lens, which is what the calm held references show. Zero for
    // every other profile, and it rises and falls with the lens itself.
    // The held magnification belongs to the INK pass only. Magnifying the material here carried
    // the bar's own edge outward inside the lens, and the strip between that edge and the rim
    // read as a grey haze over the page (FABLE r10 optics audit, items 2 and 13); in every
    // reference the bar's hairline lands 11-12 px INSIDE the rim and the overhang shows the
    // page. uHeldMagnification stays declared for the shared uniform contract.
    float magUnused = uHeldMagnification * 0.0;
    base += float2(magUnused, 0.0);

    // Sampling outward pulls the surroundings inward and compresses them into the rim band.
    // That is the only direction consistent with sampling "an area larger than itself", and it
    // is why the host has to record uPad beyond the edge.
    float measured = step(0.5, uProfile);
    float2 push = n * bend * lens;
    // Dispersion. Legacy: blue carries the higher index and lands furthest out, as a fraction
    // of the displacement. Measured: red shows content 0.07 W deeper than blue, and only in the
    // mirrored zone; the stretched zone has no colour split at all (FINDINGS 1b).
    float split = uAberration * bend;
    float2 pushR = push * (1.0 - split);
    float2 pushB = push * (1.0 + split);
    if (measured > 0.5 && uProfile < 2.5) {
        // Inward only. A pixel at depth d shows content from depth s inside the same edge.
        float W = max(uRefractBand, 0.001);
        float u = clamp(depth / W, 0.0, 1.0);
        // Chrome at rest lenses at its corner arcs only; a field shape has no runs to exempt.
        float corner = (uBodyKind > 1.5)
            ? poseCorner(p, uPoseAInv, uPoseC, uPoseD)
            : ((uBodyKind > 0.5)
                ? bodyCorner(p, uBody, uBodyY)
                : ((uShapeKind < 0.5) ? cornerWeight(p, halfSize, uRadii) : 1.0));
        // The fold family, or the held-lens family blended from identity (GlassProfile.Held).
        float heldFamily = step(1.5, uProfile);
        float held = heldFamily * clamp(uHeldLens, 0.0, 1.0);
        float src = mix(measuredSource(u, uFormation * mix(1.0, corner, clamp(uFoldCorners, 0.0, 1.0)), corner), mix(u, heldMirror(u, heldSource(u), corner), held), heldFamily);
        // GlassStyle.capFold (uFoldCorners above 1): the rounded ends of a resting bar lens what lies
        // beyond them, as the held lens does, while its straight runs keep the rest offset.
        float capLens = clamp(uFoldCorners - 1.0, 0.0, 1.0) * corner * (1.0 - heldFamily);
        src = mix(src, heldSource(u), capLens);
        float shift = (depth < W) ? (src * W - depth) : 0.0;
        // The fold samples inward only; the held lens pulls the exterior in, so its shift may
        // point outward, into the margin the host recorded for it.
        shift = mix(max(shift, 0.0), shift, max(heldFamily, capLens)) * mat * axisFade * smoothstep(0.0, 1.5, depth);
        // Dispersion lives in the fold's mirrored zone, and in the held lens's whole outer band.
        // The colour split lives where the fold does: at the caps when uFoldCorners confines it.
        float foldMask = mix(1.0, corner, clamp(uFoldCorners, 0.0, 1.0));
        float mirrorZone = mix(rimZone(u) * clamp(uFormation, 0.0, 1.0) * foldMask,
            (1.0 - smoothstep(0.45, 0.55, u)) * held, heldFamily);
        float delta = uAberration * W * 0.5 * mirrorZone * mat;
        push = -n * shift;
        // The fold shows red the deeper content; the held lens shows blue the deeper content,
        // so blue's copy of the pulled-in edge lands outermost (FINDINGS 19).
        float heldOrder = heldFamily * (1.0 - ((uRimMirror > 0.0) ? clamp(uFormation, 0.0, 1.0) * foldMask : 0.0));
        float dR = mix(delta, -delta, heldOrder);
        pushR = -n * (shift + dR);
        pushB = -n * mix(max(shift - delta, 0.0), shift + delta, heldOrder);
        bend = clamp(abs(shift) / W, 0.0, 1.0);
    }
    if (uProfile >= 2.5) {
        // Do not layer a tab fold or fingertip-centred warp over a free magnifier.
        base = coord + clearLensDelta(p, halfSize, uHeldMagnification * mat);
        push = float2(0.0);
        pushR = float2(0.0);
        pushB = float2(0.0);
        bend = 0.0;
    }
    half3 sharp;
    float soften = uRimSoft * bend;
    if (soften > 0.05) {
        // Smear each channel along the normal, by an amount that grows with the bend.
        //
        // Where the rim compresses a hard boundary it lands as a single bright line, which reads
        // as a drawn stroke rather than as compressed image. Averaging three taps across the
        // direction the compression runs turns that line into the short gradient the reference
        // actually shows. After QWEA0/Liquid-Glass-Android, which calls it rimSoft.
        float2 sm = n * soften;
        float2 cr = base + pushR;
        float2 cg = base + push;
        float2 cb = base + pushB;
        sharp = half3(
            (backdropAt(cr).r + backdropAt(cr - sm).r + backdropAt(cr + sm).r) / 3.0,
            (backdropAt(cg).g + backdropAt(cg - sm).g + backdropAt(cg + sm).g) / 3.0,
            (backdropAt(cb).b + backdropAt(cb - sm).b + backdropAt(cb + sm).b) / 3.0);
    } else {
        sharp = half3(
            backdropAt(base + pushR).r,
            backdropAt(base + push).g,
            backdropAt(base + pushB).b);
    }

    // Scatter, keyed to distance from the edge. Squared, so the crisp compressed image stays
    // tight against the rim while the displacement itself still spans the whole band.
    // A soft copy ([GlassStyle.softDetail]) samples its scatter unrotated: the rotation is what
    // turns a sparse kernel's ghosts into grain.
    float2 rot = (uSoftDetail >= 0.5) ? float2(1.0, 0.0) : tapRotation(coord);
    // At Tinted the fine share is 0 and the fine scatter would be thrown away: skip it.
    half3 soft = (uWideStrip >= 1.0 && uFineShare < 0.02)
        ? sharp
        : blurredAt(base + push, uBlur * mat * e, rot);
    float rimSharp = (1.0 - e) * (1.0 - e);
    half3 bg;
    if (uWideKernel * mat >= 2.0) {
        // Across a bar the phone keeps no detail at all, in the edge band as in the middle
        // (FINDINGS 22), so the rim's crisp copy may only contribute its colour fringe. The
        // fine term is already sharp along the axis here, because its scatter falls to zero at
        // the rim; mixing the crisp copy back in whole is what drew a step the phone has not
        // got, 23 levels against 9 over the target's black band.
        half3 axis = half3(backdropAt(base + push));
        bg = soft + (sharp - axis) * half(rimSharp);
    } else {
        bg = mix(soft, sharp, half(rimSharp));
    }

    if (measured < 0.5) {
        // The mirrored edge band of the legacy profile: a broad, soft, upside-down echo of
        // nearby content over roughly the outer third of the surface. The measured profile
        // needs none: its fold IS the mirror.
        float mirrorWidth = max(14.0, min(halfSize.x, halfSize.y) * 0.7);
        float mirrorBand = 1.0 - clamp(depth / mirrorWidth, 0.0, 1.0);
        float mirrorMask = mirrorBand * mirrorBand * axisFade * smoothstep(0.0, 1.5, depth);
        half3 echo = backdropAt(base - n * (mirrorMask * lens * 3.0));
        bg = mix(bg, echo, half(clamp(mirrorMask * uMirror * mat, 0.0, 1.0)));
    }

    // The measured material is two kernels: a fine one that carries the detail seen through
    // the glass and a wide one (about 25 pt) that decides its tone, mixed by the fine share.
    // Sixteen-pixel stripes keep 36% of their contrast at Tint 50 where a single blur wide
    // enough to explain the tone would leave 3% (MODEL.md section 2a).
    half3 wide = bg;
    if (uWideStrip >= 1.0 && mat > 0.001) {
        wide = wideAt(base);
        // The fine term is a high-pass along the element's long axis, not a share of a second
        // blurred copy: the tone comes from the wide kernel and the detail is what the backdrop
        // does along the bar, which is why a boundary running across a bar leaves no step on the
        // phone (FINDINGS 22). The along-axis average is the wide kernel's own sigma, so where
        // the backdrop does not vary across the bar the two cancel exactly and the wide kernel
        // is left alone, and where it does not vary along the bar this is the old two-kernel mix
        // with no halo. The 0.7 calibrates the seven taps against the strip's own Gaussian: at
        // 1.0 the step response overshoots by 11 levels, at 0.7 by none.
        half3 line = axisMeanAt(base + push, uWideKernel * 0.7 * mat, rot);
        // A soft copy takes its detail against the wide kernel's own tone: the two-kernel mix,
        // with no ghost copies of the glyphs along the bar ([GlassStyle.softDetail]).
        line = mix(line, wide, half(clamp(uSoftDetail, 0.0, 1.0)));
        bg = wide + (bg - line) * half(clamp(uFineShare, 0.0, 1.0));
    }

    float bgLuma = luma(bg);

    // Local contrast, free: the rim sample and the interior sample already bracket the
    // backdrop's high frequencies, so their luma difference stands in for text scrolling
    // underneath. Apple raises tint and dynamic range exactly then, to keep controls legible.
    float contrast = clamp(abs(luma(sharp) - luma(soft)) * 4.0, 0.0, 1.0);

    half3 tinted = (measured > 0.5)
        ? half3(uTint.rgb)
        : toneMappedTint(half3(uTint.rgb), bgLuma, uAdaptive);
    tinted = mix(tinted, half3(1.0) - tinted, half(clamp(uFlip, 0.0, 1.0)));

    // Larger elements sit a little more opaque. Kept gentle: the material has to stay
    // transparent enough that the refracted detail survives, which is the whole point.
    // Reduce Transparency has no Android setting behind it, so uFrost is whatever in-app
    // control the app exposes. It raises opacity rather than disabling the material, which
    // keeps the shape and the lighting intact for anyone who still wants to see the edges.
    // The measured opacity is per role and already includes the element's size, so it is not
    // scaled by size again; the legacy path keeps its gentle size term.
    // Navigation's dark inset is a treatment of the bar substrate. A still-compressed
    // recovering body must not paint that inset onto the page above/below the bar.
    // Refraction, highlights and the geometric coverage stay independent of this tint mask.
    // A held lens tints what it shows, so its mask is read where the refracted view comes
    // from: read at the pixel, the bar's footprint tinted the black band the lens pulls in
    // beyond the bar's image (pass 14). Every other profile keeps the pixel's own mask.
    float heldMask = step(1.5, uProfile) * (1.0 - step(2.5, uProfile)) * step(0.001, uHeldLens);
    float2 maskLocal = local + (base + push - coord) * heldMask;
    float2 maskPoint = float2(dot(uTintMaskX.xy, maskLocal) + uTintMaskX.z,
        dot(uTintMaskY.xy, maskLocal) + uTintMaskY.z);
    float tintCoverage = (uTintMaskX.w > 0.5)
        ? clamp(float(field.eval(maskPoint).a), 0.0, 1.0) : 1.0;
    float strength = uTint.a * tintCoverage * mix(mix(0.9, 1.25, scale), 1.0, measured)
        + contrast * uLegibility * 0.25
        + clamp(uFrost, 0.0, 1.0) * 0.35;
    strength = clamp(strength * mat, 0.0, 0.95);
    // Two ways to apply a tint, and they differ over textured ground.
    //
    // A blend pulls every pixel the same distance toward one colour, which flattens the
    // backdrop's own light and shade. Multiplying by the tint instead scales what is there, so
    // the structure survives; a small additive term, strongest where the backdrop is darkest,
    // keeps the hue readable over black. That is how a coloured transparent medium behaves.
    // After QWEA0/Liquid-Glass-Android.
    //
    // The blend is the default because its strength is fitted to measurement: the value that
    // lifts pure black by 20 and passes 64% of white text is what pins this material.
    half3 blended = mix(bg, tinted, half(strength));
    half3 col;
    float absorb = clamp(uTintAbsorb, 0.0, 1.0);
    if (absorb > 0.001) {
        half3 absorbed = bg * mix(half3(1.0), tinted, half(0.85));
        half3 scattered = tinted * half(0.38 * (1.0 - clamp(bgLuma, 0.0, 1.0)));
        half3 medium = mix(bg, clamp(absorbed + scattered, half3(0.0), half3(1.0)), half(strength));
        col = mix(blended, medium, half(absorb));
    } else {
        col = blended;
    }
    // The measured lift: the dark in-app material is black at its opacity plus a fixed 35/255;
    // the system backdrops lift by 142/255 minus 0.864 of the mean luma behind them, which is
    // what makes Control Center read light over dark content and dark over light.
    float lift = (uLift - uLiftAdapt * luma(wide)) * tintCoverage;
    // Clamped only when it adapts: a fixed lift may be negative (the resting tab-bar indicator).
    lift = ((uLiftAdapt > 0.0) ? max(lift, 0.0) : lift) * mat;
    col += half3(half(lift));

    float facing = dot(n, uLight);
    float heldAmt = step(1.5, uProfile) * (1.0 - step(2.5, uProfile)) * clamp(uHeldLens, 0.0, 1.0);
    // Two rim geometries. At uBevelPeak 0 the bevel is a chamfer: brightest at the very edge,
    // fading inward, which is what a hairline-edged bar wants. Above 0 it is a bead: dark at
    // the edge, brightest a fraction of the bevel's width inside it, fading again toward the
    // interior \u2014 the profile the reference lens shows, rising over about three points from a
    // dark outermost pixel to its peak and falling over three more.
    float peakAt = clamp(uBevelPeak, 0.0, 0.9) * uBevel;
    float bevelBand = (peakAt < 0.5)
        ? smoothstep(uBevel, 0.0, depth)
        : smoothstep(0.0, peakAt, depth) * smoothstep(uBevel, peakAt, depth);

    // The faint dark line that reads as thickness, sitting just inside the bevel rather than on
    // the rim. Deliberately weak \u2014 see note 5 about outlines.
    float innerLine = max(smoothstep(uBevel * 2.2, 0.0, depth) - bevelBand, 0.0);
    col -= half3(half(innerLine * uInnerShadow * mix(0.9, 1.15, scale) * mat));

    // Schlick, using the same bevel slope the refraction used, so the rim brightens where it
    // turns away from the viewer. It stands in for an environment we do not have.
    float cosI = inversesqrt(1.0 + slope * slope);
    float f0 = (uIor - 1.0) / (uIor + 1.0);
    f0 = f0 * f0;
    float fresnel = f0 + (1.0 - f0) * pow(max(1.0 - cosI, 0.0), 5.0);

    // The bevel is lit where its normal faces the light, with a counter-lobe opposite: a bead
    // lit from one side only reads as a gradient rather than as a solid. How much reaches the
    // far side is the style's call \u2014 a free-standing lens is lit from above and wants a little,
    // while a bar measured against the reference is lit identically top and bottom and wants
    // all of it. The counter-lobe tightens as it weakens, so the historical 0.35 keeps the
    // narrower lobe it was tuned with.
    //
    // The edge line is the outermost two pixels, and it is *entirely* directional: where the
    // normal is perpendicular to the light there is no line at all. A floor here reads as a
    // stroke drawn round the shape, and the reference has none \u2014 its lens is a bright line top
    // and bottom and a one-pixel dark step at the sides. What defines the shape where nothing
    // is lit is uEdgeShadow, below. Its brightness is set apart from the
    // bevel lobe's: the reference bar is a hairline with almost no lobe behind it, and the
    // reference lens is a broad lobe whose peak sits inside an edge that stays dark.
    float counterLight = clamp(uCounterLight, 0.0, 1.0);
    float counterPow = uSpecularPow * mix(1.6, 1.0, smoothstep(0.35, 1.0, counterLight));
    float key = pow(max(facing, 0.0), uSpecularPow) * bevelBand;
    float counter = pow(max(-facing, 0.0), counterPow) * bevelBand * counterLight;
    float edge = smoothstep(2.0, 0.0, depth);
    float edgeLine = edge * 0.5 * (max(facing, 0.0) + counterLight * max(-facing, 0.0));

    // The measured rim line trails a faint glow inward, decaying over about a bevel width: on
    // the pill +10 at 4 px falling to +3 at 8 (rim fit, 2026-09-12); on the held tab-bar lens
    // 16 -> 1 over 15 px (FINDINGS 19). Top and bottom alike, nothing at the sides.
    float glowAmt = ((uProfile >= 0.5 && uProfile < 2.5) ? mix(0.05, 0.063, heldAmt) : 0.0)
        * mix(1.0, clamp(uHeldGlow, 0.0, 2.0), heldAmt);
    float glowReach = (uHeldGlowReach > 0.0) ? mix(max(uBevel, 1.0), uHeldGlowReach, heldAmt) : max(uBevel, 1.0);
    float heldGlow = glowAmt * exp(-max(depth - 0.67 * uBevel, 0.0) / glowReach)
        * (max(facing, 0.0) + counterLight * max(-facing, 0.0));
    float glowFloor = clamp(uHeldGlowFloor, 0.0, 1.0);
    float highlight = ((key + counter) * uSpecular
        + edgeLine * uSpecular * uEdgeLight
        + fresnel * uFresnel * bevelBand
        + heldGlow * (1.0 - glowFloor)) * mat;
    col = applyHighlight(col, highlight, uHiChroma);
    // The floor share of the glow lifts only glass darker than it (GlassStyle.heldGlowFloor).
    if (glowFloor > 0.0) col = max(col, half3(half(heldGlow * glowFloor * mat)));

    // The dark contour that separates glass from its backdrop. Apple's 2026 revision pairs it

// The Ln norm. At n = 2 this is \`length\`, so the rounded rect below is bit-identical to a
// circular-cornered one; at n = 4 the corner becomes the superellipse Apple actually uses.
float lnNorm(float2 v, float n) {
    if (n <= 2.001 && n >= 1.999) {
        return length(v);
    }
    return pow(pow(v.x, n) + pow(v.y, n), 1.0 / n);

// The outward unit normal of sdRoundRect, in closed form.
//
// Only valid away from the medial axis, where the true gradient is discontinuous; the caller
// checks that before using it. \`gradRadius\` is deliberately larger than the outline's radius,
// which rotates the normal through the corner over a wider arc than the outline turns and
// removes the direction kink where the corner meets the flat run. It does not move the outline.
//
// The closed-form gradient and the wider-radius trick are Kyant0/AndroidLiquidGlass's; the Ln
// corner, the degenerate guards and the caller's medial-axis handling are ours. See NOTICE.
float2 gradRoundRect(float2 p, float2 halfSize, float4 r, float power, float widen) {
    float2 rr = (p.x > 0.0) ? r.yz : r.xw;
    float radius = (p.y > 0.0) ? rr.y : rr.x;
    radius = min(radius, min(halfSize.x, halfSize.y));
    float gradRadius = min(radius * widen, min(halfSize.x, halfSize.y));
    float2 q = abs(p) - halfSize + gradRadius;
    float2 s = float2(p.x < 0.0 ? -1.0 : 1.0, p.y < 0.0 ? -1.0 : 1.0);
    if (q.x > 0.0 && q.y > 0.0) {
        float L = lnNorm(q, power);
        if (L <= 1e-5) {
            return s * float2(0.70710678, 0.70710678);
        }
        float2 w = float2(
            pow(q.x / L, power - 1.0),
            pow(q.y / L, power - 1.0));
        float wl = length(w);
        return (wl <= 1e-5) ? s * float2(0.70710678, 0.70710678) : s * (w / wl);
    }
    // Flat run: the nearest edge is whichever of the two is closer.
    float ax = step(q.y, q.x);
    return s * float2(ax, 1.0 - ax);

// of the inradius (three quarters of it) so the medial axis is never reached, and no fusion. The same
// decision in every shader; a shader that cannot describe its geometry this way must not call it.
float analyticNormalEligible(float shapeKind, float band, float2 halfSize, float fuseWidth) {
    float inradius = min(halfSize.x, halfSize.y);
    return (shapeKind < 0.5 && band < inradius * 0.75 && fuseWidth <= 0.0) ? 1.0 : 0.0;

// bend the ring. Axis fade is 1 wherever this applies.
float2 analyticNormal(float2 p, float2 halfSize, float4 r, float power, float profile) {
    return gradRoundRect(p, halfSize, r, power, mix(1.5, 1.0, step(0.5, profile)));

float4 bodyQuery(float2 p, float4 uBody, float uBodyY) {
    float clx = uBody.x;

float bodyBand(float4 uBody) {

 * so it is geometry rather than a screen-space heuristic.
 */
float bodyCorner(float2 p, float4 uBody, float uBodyY) {
    float clx = uBody.x;

 * deep Euclidean SDF and is deliberately named for what it is used for.

float cornerWeight(float2 p, float2 halfSize, float4 r) {
    float2 rr = (p.x > 0.0) ? r.yz : r.xw;
    float radius = (p.y > 0.0) ? rr.y : rr.x;
    radius = min(radius, min(halfSize.x, halfSize.y));
    float2 q = abs(p) - halfSize + radius;
    float soft = max(radius * 0.2, 1.0);
    return smoothstep(-soft, 0.0, min(q.x, q.y));
}

// The measured cover-sheet lens, as a lookup: a pixel at depth u = d/W inside the edge shows
// backdrop content from depth s = foldSource(u) * W. Fitted on 13k frames of a real finger pull
// and reproduced at Tint 0, 50 and 100 (MODEL.md section 5): identity from 0.9 W inward; a 2x
// stretch over 0.52-0.9 W showing 0.71-0.9 W; a stationary seam at 0.70 W over 0.28-0.52 W;
// and the outer 0.28 W showing 0.71-1.07 W upside down. Content 0-0.69 W inside the edge is never
// displayed and nothing outside the edge is sampled. Static chrome and a committed (fast) pull
// show none of it, only a slight inward offset, so \`formation\` blends between the two.
float foldSource(float u, float formation, float corner) {
    float full;
    if (u >= 0.9) {
        full = u;
    } else if (u >= 0.52) {
        full = 0.71 + 0.5 * (u - 0.52);
    } else if (u >= 0.28) {
        full = 0.70;
    } else {
        full = 0.71 + 1.2857 * (0.28 - u);
    }
    // At rest a straight run shows almost nothing: a fast sheet pull shows only a 2-7 px inward
    // offset across its 90 px band (FINDINGS 1b-iii), and the dock's top edge leaves what is
    // under it in place. A corner arc at rest shows the measured rest lens (restSource). Both
    // give way to the full fold as the lens forms under a tracked drag.
    // The straight-run candidate of V3-MODEL section 10.2: f(u) = u + a (1-u)^3, which joins
    // identity in value, first and second derivative and, for a > 1/3, folds once at
    // uFold = 1 - 1/sqrt(3a) with minimum source depth 1 - 2/(3 sqrt(3a)). Page structure
    // therefore appears twice near a straight edge, with opposite orientation, which is the
    // mechanism the reference shows. \`a\` is authored, not measured. At 0 this degenerates to the
    // shallow inward offset the measured sheet pull showed, which every existing consumer keeps.
    float v = 1.0 - u;
    float straight = (uEdgeFold > 0.0)
        ? (u + uEdgeFold * v * v * v)
        : (u + 0.06 * v * v);
    float rest = mix(straight, restSource(u), clamp(corner, 0.0, 1.0));
    return mix(rest, full, clamp(formation, 0.0, 1.0));
}


// GlassStyle.rimMirrorGain: how much deeper content the mirrored rim reaches per unit of band.
// 1 (or unset) is the plain mirror; below 1 the cap content is drawn out radially toward the rim.
float rimGain() { return (uRimMirrorGain > 0.0) ? clamp(uRimMirrorGain, 0.05, 1.0) : 1.0; }

// The measured family's source map, or the reflective rim (GlassStyle.rimMirror): within b of
// the band a pixel at depth u shows depth 2b - u, mirrored about b; inside it, identity.
// A moving held lens (GlassStyle.rimMirror with the held family): blend the held map toward the
// reflective rim at its caps by uFormation, here the lens's travel. Still lenses keep the map.
float heldMirror(float u, float map, float corner) {
    if (uRimMirror <= 0.0) return map;
    float b = clamp(uRimMirror, 0.0, 1.0);
    float mirrored = (u < b) ? (b + (b - u) * rimGain()) : u;
    float k = clamp(uFormation, 0.0, 1.0) * mix(1.0, corner, clamp(uFoldCorners, 0.0, 1.0));
    return mix(map, mirrored, k);
}

// The colour-split zone of the measured family: the fold's measured outer 0.28, or the
// reflective rim's own mirrored band when GlassStyle.rimMirror is set.
float rimZone(float u) {
    if (uRimMirror <= 0.0) return 1.0 - smoothstep(0.24, 0.32, u);
    float b = clamp(uRimMirror, 0.0, 1.0);
    return 1.0 - smoothstep(b * 0.8, b * 1.1, u);
}

float measuredSource(float u, float formation, float corner) {
    if (uRimMirror <= 0.0) return foldSource(u, formation, corner);
    float b = clamp(uRimMirror, 0.0, 1.0);
    float mirrored = (u < b) ? (b + (b - u) * rimGain()) : u;
    return mix(u, mirrored, clamp(formation, 0.0, 1.0));
}

half4 main(float2 coord) {
    float2 local = coord - float2(uPad);
    float2 halfSize = uSize * 0.5;
    float2 p = local - halfSize;

    float d = sdShape(p, halfSize);
    float coverage = 1.0 - smoothstep(-0.75, 0.75, d);
    if (coverage <= 0.0) {
        return half4(0.0);
    }

    float scale = clamp(uScale, 0.0, 1.0);

    // The measured fold profile takes the panel's closed-form normal under the panel's own decision, so
    // the content bends exactly as the material it sits in (closeout Phase 3). The held lens and the
    // legacy profile keep the differenced field they shipped with; their output is unchanged.
    float2 n;
    float axisFade;
    if (uBodyKind > 1.5) {
        // The pose body's own transformed normal, from the same shared query as its distance.
        float4 pq = poseQuery(p, uPoseA, uPoseAInv, uPoseC, uPoseD);
        n = float2(pq.y, pq.z);
        axisFade = 1.0;
    } else if (uBodyKind > 0.5) {
        // The body's own exact normal, from the same shared query as its distance.
        float4 bq = bodyQuery(p, uBody, uBodyY);
        n = float2(bq.y, bq.z);
        axisFade = 1.0;
    } else if (abs(uProfile - 1.0) < 0.5 && analyticNormalEligible(uShapeKind, uRefractBand, halfSize, uFuseShape.y) > 0.5) {
        n = analyticNormal(p, halfSize, uRadii, uCornerPower, uProfile);
        axisFade = 1.0;
    } else {
        float eps = clamp(uRefractBand * 0.3, 1.0, 16.0);
        float2 ex = float2(eps, 0.0);
        float2 ey = float2(0.0, eps);
        float2 g = float2(
            sdShape(p + ex, halfSize) - sdShape(p - ex, halfSize),
            sdShape(p + ey, halfSize) - sdShape(p - ey, halfSize));
        float gLen = length(g);
        n = g / max(gLen, 1e-5);
        axisFade = smoothstep(0.15, 0.80, gLen / (2.0 * eps));
    }

    float depth = max(-d, 0.0);
    float e = clamp(depth / max(uRefractBand, 0.001), 0.0, 1.0);
    float pw = max(uBevelPower, 1.5);
    float slope = bevelSlope(e, pw);

    float bend = snellShift(slope, uIor) / max(snellShift(bevelSlope(0.0, pw), uIor), 1e-4);
    bend *= smoothstep(1.0, 0.75, e) * axisFade * smoothstep(0.0, 1.5, depth);
    bend = clamp(bend, 0.0, 1.0);

    float mat = clamp(uMaterialize, 0.0, 1.0);
    float lens = uRefractDepth * mix(0.85, 1.25, scale) * mat;

    float2 touchDelta = local - uTouch;
    float touchSigma = max(min(uSize.x, uSize.y), 1.0);
    float touchFall = exp(-dot(touchDelta, touchDelta) / (touchSigma * touchSigma))
        * clamp(uTouchAmt, 0.0, 1.0);
    float2 base = coord - touchDelta * (touchFall * 0.17);
    // Interior magnification of the held lens ([GlassStyle.heldMagnification]): the aperture
    // zooms about the body's centre, so the held item reads larger and the bar's own edge is
    // carried outward inside the lens, which is what the calm held references show. Zero for
    // every other profile, and it rises and falls with the lens itself.
    if (uHeldMagnification > 0.0 && uProfile >= 1.5 && uProfile < 2.5) {
        float2 magCentre = (uBodyKind > 1.5) ? uPoseC.xy
            : ((uBodyKind > 0.5) ? float2((uBody.x + uBody.y) * 0.5, uBodyY) : float2(0.0));
        base -= (p - magCentre) * (uHeldMagnification * clamp(uHeldLens, 0.0, 1.0) * mat);
    }

    float2 push = n * bend * lens;
    float split = uInkSplit * bend;
    float2 pushR = push * (1.0 - split);
    float2 pushB = push * (1.0 + split);
    if (uProfile >= 0.5 && uProfile < 2.5) {
        // The same inward fold the backdrop goes through; see the panel shader.
        float W = max(uRefractBand, 0.001);
        float u = clamp(depth / W, 0.0, 1.0);
        float corner = (uBodyKind > 1.5)
            ? poseCorner(p, uPoseAInv, uPoseC, uPoseD)
            : ((uBodyKind > 0.5)
                ? bodyCorner(p, uBody, uBodyY)
                : ((uShapeKind < 0.5) ? cornerWeight(p, halfSize, uRadii) : 1.0));
        float heldFamily = step(1.5, uProfile);
        float held = heldFamily * clamp(uHeldLens, 0.0, 1.0);
        float heldMap = (uHeldInk > 0.5) ? heldSourceContinuous(u) : heldSource(u);
        float src = mix(measuredSource(u, uFormation * mix(1.0, corner, clamp(uFoldCorners, 0.0, 1.0)), corner), mix(u, heldMirror(u, heldMap, corner), held), heldFamily);
        float capLens = clamp(uFoldCorners - 1.0, 0.0, 1.0) * corner * (1.0 - heldFamily);
        src = mix(src, heldMap, capLens);
        float shift = (depth < W) ? (src * W - depth) : 0.0;
        shift = mix(max(shift, 0.0), shift, max(heldFamily, capLens)) * mat * axisFade * smoothstep(0.0, 1.5, depth);
        // The colour split lives where the fold does: at the caps when uFoldCorners confines it.
        float foldMask = mix(1.0, corner, clamp(uFoldCorners, 0.0, 1.0));
        float mirrorZone = mix(rimZone(u) * clamp(uFormation, 0.0, 1.0) * foldMask,
            (1.0 - smoothstep(0.45, 0.55, u)) * held, heldFamily);
        float delta = uInkSplit * W * 0.5 * mirrorZone * mat;
        push = -n * shift;
        // The fold shows red the deeper content; the held lens shows blue the deeper content,
        // so blue's copy of the pulled-in edge lands outermost (FINDINGS 19).
        float heldOrder = heldFamily * (1.0 - ((uRimMirror > 0.0) ? clamp(uFormation, 0.0, 1.0) * foldMask : 0.0));
        float dR = mix(delta, -delta, heldOrder);
        pushR = -n * (shift + dR);
        pushB = -n * mix(max(shift - delta, 0.0), shift + delta, heldOrder);
    }

    if (uProfile >= 2.5) {
        // Do not layer a tab fold or fingertip-centred warp over a free magnifier.
        base = coord + clearLensDelta(p, halfSize, uHeldMagnification * mat);
        push = float2(0.0);
        pushR = float2(0.0);
        pushB = float2(0.0);
        bend = 0.0;
    }
    // One sharp sample is the default for semantic ink: a maximum-of-three-alpha union is not
    // correct per-channel transmission over an arbitrary background, so bulk ink dispersion is
    // off unless a consumer asks for it (V3-MODEL section 8.3). uAberration still drives the
    // page material's split in the panel pass; uInkSplit is this pass's own, and 0 there means
    // the alpha below is exactly the glyph's own.
    half4 col;
    if (uInkSplit > 0.0001) {
        half4 r = content.eval(base + pushR);
        half4 gg = content.eval(base + push);
        half4 b = content.eval(base + pushB);
        half a = max(max(r.a, gg.a), b.a);
        col = half4(min(half3(r.r, gg.g, b.b), half3(a)), a);
    } else {
        col = content.eval(base + push);
    }
    // Endpoint mode returns the ink premultiplied and unmasked, to be composited once over the
    // opaque endpoint material before one aperture coverage is applied to the whole endpoint.
    float outAlpha = (uEndpointAlpha > 0.5) ? 1.0 : coverage;
    return col * half(outAlpha);
}

// The Ln norm. At n = 2 this is \`length\`, so the rounded rect below is bit-identical to a
// circular-cornered one; at n = 4 the corner becomes the superellipse Apple actually uses.
float lnNorm(float2 v, float n) {
    if (n <= 2.001 && n >= 1.999) {
        return length(v);
    }
    return pow(pow(v.x, n) + pow(v.y, n), 1.0 / n);
}

// The outward unit normal of sdRoundRect, in closed form.
//
// Only valid away from the medial axis, where the true gradient is discontinuous; the caller
// checks that before using it. \`gradRadius\` is deliberately larger than the outline's radius,
// which rotates the normal through the corner over a wider arc than the outline turns and
// removes the direction kink where the corner meets the flat run. It does not move the outline.
//
// The closed-form gradient and the wider-radius trick are Kyant0/AndroidLiquidGlass's; the Ln
// corner, the degenerate guards and the caller's medial-axis handling are ours. See NOTICE.
float2 gradRoundRect(float2 p, float2 halfSize, float4 r, float power, float widen) {
    float2 rr = (p.x > 0.0) ? r.yz : r.xw;
    float radius = (p.y > 0.0) ? rr.y : rr.x;
    radius = min(radius, min(halfSize.x, halfSize.y));
    float gradRadius = min(radius * widen, min(halfSize.x, halfSize.y));
    float2 q = abs(p) - halfSize + gradRadius;
    float2 s = float2(p.x < 0.0 ? -1.0 : 1.0, p.y < 0.0 ? -1.0 : 1.0);
    if (q.x > 0.0 && q.y > 0.0) {
        float L = lnNorm(q, power);
        if (L <= 1e-5) {
            return s * float2(0.70710678, 0.70710678);
        }
        float2 w = float2(
            pow(q.x / L, power - 1.0),
            pow(q.y / L, power - 1.0));
        float wl = length(w);
        return (wl <= 1e-5) ? s * float2(0.70710678, 0.70710678) : s * (w / wl);
    }
    // Flat run: the nearest edge is whichever of the two is closer.
    float ax = step(q.y, q.x);
    return s * float2(ax, 1.0 - ax);
}

// Whether the closed-form normal applies: an analytic shape (no sampled field), a band that stops short
// of the inradius (three quarters of it) so the medial axis is never reached, and no fusion. The same
// decision in every shader; a shader that cannot describe its geometry this way must not call it.
float analyticNormalEligible(float shapeKind, float band, float2 halfSize, float fuseWidth) {
    float inradius = min(halfSize.x, halfSize.y);
    return (shapeKind < 0.5 && band < inradius * 0.75 && fuseWidth <= 0.0) ? 1.0 : 0.0;
}

// The measured lens maps a corner's rim onto the ring inside it, so its normal has to be the true one
// (radial from the corner's centre); the wider arc that smooths the legacy profile's direction kink would
// bend the ring. Axis fade is 1 wherever this applies.
float2 analyticNormal(float2 p, float2 halfSize, float4 r, float power, float profile) {
    return gradRoundRect(p, halfSize, r, power, mix(1.5, 1.0, step(0.5, profile)));
}



float4 bodyQuery(float2 p, float4 uBody, float uBodyY) {
    float clx = uBody.x;
    float crx = uBody.y;
    float rl  = uBody.z;
    float rr  = uBody.w;
    float h   = max(crx - clx, 1e-4);
    float b   = clamp((rl - rr) / h, -0.999999, 0.999999);
    float a   = sqrt(max(1.0 - b * b, 0.0));

    float along = p.x - clx;
    float signY = (p.y >= uBodyY) ? 1.0 : -1.0;
    float perp  = abs(p.y - uBodyY);

    float k = a * along - b * perp;
    if (k < 0.0) {
        float2 w = float2(along, perp);
        float len = length(w);
        float2 n = (len > 1e-5) ? (w / len) : float2(-1.0, 0.0);
        return float4(len - rl, n.x, n.y * signY, 1.0 / max(rl, 1e-4));
    }
    if (k > a * h) {
        float2 w = float2(along - h, perp);
        float len = length(w);
        float2 n = (len > 1e-5) ? (w / len) : float2(1.0, 0.0);
        return float4(len - rr, n.x, n.y * signY, 1.0 / max(rr, 1e-4));
    }
    // The straight tangent run: its outward normal is (b, \xB1a), which is exactly the direction
    // that makes one line touch both circles.
    return float4(b * along + a * perp - rl, b, a * signY, 0.0);
}

/** The optical band of a body: 0.6 of its smaller end radius, the same ratio a bar uses. */
float bodyBand(float4 uBody) {
    return 0.6 * min(uBody.z, uBody.w);

/**
 * How far the nearest boundary feature is an end arc rather than a straight tangent run, 1 to 0,
 * blended over a short geometric distance so the transport profile does not step where the
 * nearest feature changes identity. The blend coordinate is the same \`k\` the query branches on,
 * so it is geometry rather than a screen-space heuristic.
 */
float bodyCorner(float2 p, float4 uBody, float uBodyY) {
    float clx = uBody.x;
    float h   = max(uBody.y - clx, 1e-4);
    float b   = clamp((uBody.z - uBody.w) / h, -0.999999, 0.999999);
    float a   = sqrt(max(1.0 - b * b, 0.0));

float3 poseInverse(float2 x, float4 uPoseAInv, float4 uPoseC) {

    float2 y = float2(uPoseAInv.x * d.x + uPoseAInv.y * d.y,

    float2 b = uPoseC.zw;
    float h = dot(b, y);
    float disc = 1.0 + 4.0 * h;
    if (disc < 0.0) return float3(y, 0.0);
    // 2 / (1 + sqrt(1 + 4h)): the root that stays continuous at h = 0 instead of cancelling.
    float lambda = 2.0 / (1.0 + sqrt(disc));

 * deep Euclidean SDF and is deliberately named for what it is used for.

float4 poseQuery(float2 x, float4 uPoseA, float4 uPoseAInv, float4 uPoseC, float4 uPoseD) {

    float radius = uPoseD.y;
    float scaleX = uPoseD.z;

        halfSpine = spine / max(scaleX, 1e-6);

    float len = length(e);
    float d = len - radius;
    float2 n0 = (len > 1e-5) ? (e / len) : float2(0.0, 1.0);

    float2 b = uPoseC.zw;
    float s = 1.0 + dot(b, z);
    float j0 = s + z.x * b.x;
    float j1 = z.x * b.y;
    float j2 = z.y * b.x;
    float j3 = s + z.y * b.y;

    float m2 = uPoseA.z * j0 + uPoseA.w * j2;
    float m3 = uPoseA.z * j1 + uPoseA.w * j3;

                      invDet * (-m1 * n0.x + m0 * n0.y));

    // Curvature, transported to first order by the tangential stretch: exact for an affine map,
    // an approximation once the taper is on, which is why it is named transported.
    float kappa = 0.0;

    return float4(d / gl, g.x / gl, g.y / gl, kappa);

float poseCorner(float2 x, float4 uPoseAInv, float4 uPoseC, float4 uPoseD) {

    return clamp(smoothstep(halfSpine - soft, halfSpine, abs(zx)), 0.0, 1.0);

float sdRoundRect(float2 p, float2 halfSize, float4 r) {

<script>
/* The LiquidGlass material has a light and a dark tint, and picks between them
   from prefers-color-scheme. This app's Appearance switch writes data-theme on
   <html> instead, so the two disagree the moment a reader overrides the system
   setting: the glass stays light on a black page. Hand the resolved scheme to
   every <liquid-glass> whenever it changes, and to the ones the app renders
   later (sheets, search results, the menu). */
(function(){
  var sync=function(){
    var t=document.documentElement.getAttribute('data-theme');
    var dark=t?t==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
    var want=dark?'dark':'light';
    var all=document.querySelectorAll('liquid-glass');
    for(var i=0;i<all.length;i++){
      if(all[i].getAttribute('scheme')!==want) all[i].setAttribute('scheme',want);
    }
  };
  var queued=false, later=function(){
    if(queued) return; queued=true;
    requestAnimationFrame(function(){queued=false;sync()});
  };
  new MutationObserver(later).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  new MutationObserver(later).observe(document.body,{childList:true,subtree:true});
  if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener){
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',later);
  }
  sync();
})();
</script>

  if(url&&el.getAttribute('data-native')!=='1'&&hasNative){
    el.setAttribute('data-native','1');
    /* each parked URL remembers when it was parked, so a wait can expire */
    const w=IMG_WAIT[url]||(IMG_WAIT[url]={els:[],at:Date.now()});
    w.els.push(el);
    requestImage(url);
    /* The fetch can finish before the <img> has got through its own candidate
       chain, in which case its 'image' event has already been consumed and no
       later one is coming for this URL - the icon would stay blank until some
       unrelated image happened to arrive. requestImage() leaves IMG_REQ[url]
       at 2 once the bridge has reported that fetch (see applyImages), so the
       lookup is done here only in that case, and only for this URL. Pass
       false: no event has arrived here, and counting one anyway is what
       broke this. */
    if(IMG_REQ[url]===2) applyImages(url,false);
    return;
  }
  el.remove();
}
/* `countEvent` is false only for the pass imgFail() runs on its own behalf.
   Every other caller is the bridge reporting a finished fetch, so it is one
   event. Counting the manual pass as well left IMG_EV_N permanently ahead of
   IMG_REQ_N, and since the retirement test below is IMG_EV_N>=IMG_REQ_N it
   then read as "every fetch has reported" for the rest of the session: each
   later parked icon was dropped while its bytes were still in flight and
   stayed a letter placeholder instead of the real icon.

   `reported` is the URL whose fetch the bridge has just finished. The page is
   told which one now (see StoreBridge.pushImage) and only that URL's wait is
   looked up. Without it this loop asked imageData() about every parked image
   on every single image event, and imageData is a synchronous bridge call - a
   SHA-1 of the URL and then a file stat, on the thread that is also trying to
   paint. One screenful of forty icons therefore cost about forty calls per
   icon: measured on a 640-row catalogue, 22,699 imageData calls to page
   through it against 566 fetches. Now it is one call per fetch. */
/* Drop the "waiting" marker from every image parked under one URL.

   The marker is the only thing that puts an image in the list at the top of
   applyImages(), and it was removed in exactly one place: when the bytes
   finally arrived. An image whose bytes never arrive - the mirror has no icon
   for that app, which is what every guessed URL shape in iconCandidates()
   produces - kept its marker for the rest of the session, and the parked
   entry that used to point at it was deleted as soon as every fetch had
   reported. So the list stopped describing the images still waiting and
   started describing every icon the mirror does not have: measured after one
   screenful of a catalogue whose mirror was missing half its icons, 109 images
   still marked and 109 getAttribute() calls on every single image event -
   21,800 of them over 200 events, on the thread that is also painting, and one
   more per icon every time another page is scrolled in. A refresh that
   republishes the catalogue re-draws the views and adds the new ones.

   Nothing about the drawing changes: .iw has no rule in the stylesheet, the
   <img> is at opacity 0 until its onload sets it either way, and the letter
   placeholder under it is what the reader sees in both cases - which is
   exactly what they saw before. */
function unmarkWait(w){
  if(!w||!w.els) return;
  const els=w.els;
  for(let k=0;k<els.length;k++) els[k].classList.remove('iw');
}
function applyImages(reported, countEvent){
  if(countEvent!==false) IMG_EV_N++;
  /* 1 means requested, 2 means requested and answered - see requestImage() */
  if(reported) IMG_REQ[reported]=2;
  /* Hand the new bytes to the images still waiting for them.

     Scanning the document once per cached URL made this quadratic - with a
     hundred cached icons it ran a hundred full DOM queries for every single
     image that arrived. The scan that replaced it still ran on every image
     event, and it was still the expensive half of this function: an attribute
     selector like 'img[data-cand]' has to walk the whole document to build a
     static list, and it did that once per icon - 916 images meant 1.1 ms of
     selector for each one, measured over a 800-app catalogue, on a desktop
     CPU. The list is also nearly all noise: every image that had already
     resolved was returned only to be skipped by the data-native test below.

     The images that are actually waiting are the ones that were drawn before
     their URL was cached, and imgTagFor marks exactly those with the iw class
     (see there). getElementsByClassName returns a live collection the engine
     maintains as classes change - 0.002 ms against that same document, three
     orders of magnitude cheaper than the selector, and it holds only the
     images that still need an answer. Walked backwards because the collection
     is live and resolving an image drops it out of the list.

     Same set of images, same bytes, same moment: an image stops waiting the
     instant it has its data URI, or the instant it loads by itself. The one
     case that stays marked is an image whose URL the mirror never answers -
     exactly the image the old scan also re-examined on every event, so the
     worst case here is the old behaviour and the usual case is a list of a few
     dozen instead of every image on the page. */
  const imgs=document.getElementsByClassName('iw');
  for(let q=imgs.length-1;q>=0;q--){
    const im=imgs[q];
    const cd=im.getAttribute('data-cand')||'';
    const bar=cd.indexOf('|');
    const d=imgCacheGet(bar<0?cd:cd.slice(0,bar));
    if(!d) continue;
    im.setAttribute('data-native','2'); im.src=d; im.style.opacity=1;
    im.classList.remove('iw');
    if(im.parentNode) im.parentNode.classList.add('has');
  }
  const now=Date.now(), settled=IMG_EV_N>=IMG_REQ_N;
  for(const url in IMG_WAIT){
    /* Only the URL the bridge just reported can have new bytes behind it.
       Every other parked image is still downloading, so asking about it would
       be a bridge call for a file that cannot be there yet.

       But once every fetch we made has reported, none of them is still in
       flight - and a parked URL with nothing in the cache can never be filled,
       because requestImage() remembers it has already been asked and will not
       ask again, and no second event will ever name it. So nothing would look
       at that entry again: it stayed in this table for the life of the page,
       holding the <img> elements of a list that had long since been
       re-rendered, one entry per icon the mirror did not have. Measured at 85
       after six screenfuls of a 200-row catalogue, and it only grows as the
       reader scrolls and opens app pages. Retire them here, with a map lookup
       and no bridge call: a file that was never fetched cannot be on disk. */
    if(url!==reported){
      if(settled&&!IMG_DONE.has(url)){
        unmarkWait(IMG_WAIT[url]);delete IMG_WAIT[url];
        /* every fetch has reported and none of them had these bytes: this is
           the same conclusion the retirement below reaches, so record it -
           see IMG_NONE, which is what stops the next render asking again */
        noteDead(url);
      }
      continue;
    }
    const w=IMG_WAIT[url];
    let d=imgCacheGet(url);
    if(!d){
      try{d=Android.imageData(url)}catch(e){d=''}
      if(!d){
        /* Nothing cached. Retire the wait instead of polling it for the life
           of the page: imageData is a synchronous bridge call (a file stat on
           the device), and a mirror that has no icon for an app never answers,
           so every dead URL used to stay in this table for good and cost one
           call per image event - quadratic in the number of missing icons. A
           re-render also left the detached <img> parked here. */
        let live=0;
        for(let k=0;k<w.els.length;k++) if(w.els[k].parentNode) live++;
        if(!live||settled||now-w.at>IMG_WAIT_MS){
          /* settled: every fetch we made has reported and none of them had
             these bytes, so no later event can name this URL - see
             unmarkWait(). A timed-out wait keeps its marker, because a fetch
             that is still somehow in flight could yet report. */
          if(settled){unmarkWait(w);noteDead(url)}
          delete IMG_WAIT[url];continue
        }
        if(live!==w.els.length){
          const keep=[];
          for(let k=0;k<w.els.length;k++) if(w.els[k].parentNode) keep.push(w.els[k]);
          w.els=keep;
        }
        continue;
      }
      imgCachePut(url,d);
    }
    const els=w.els;
    for(let k=0;k<els.length;k++){
      const el=els[k]; el.setAttribute('data-native','2'); el.style.opacity=1;
      el.classList.remove('iw');
      if(el.parentNode) el.parentNode.classList.add('has'); el.src=d;
    }
    delete IMG_WAIT[url];
  }
}

/* 7420 -> "7.4k", 1200000 -> "1.2M". A downloads figure is a scale, not a

   line to say it in. */
function verText(v){

}
/* The line under an app: how many people have it, and by whose count. GitHub
   downloads are this catalogue's own; a Play bucket is Play's, and says so. */
function downloadsText(a){
  const n=countText(a.downloads);
  if(n) return n+' downloads';
  /* a GitHub entry with zero is a measured zero, not a missing figure */
  if(!a.downloads&&a.absApkUrl&&a.absApkUrl.indexOf('github.com')>=0) return '0 downloads';

function countText(n){
  n=Number(n)||0;
  if(n<=0) return '';
  if(n<1000) return String(n);
  if(n<1000000) return (n/1000).toFixed(n<10000?1:0).replace(/\.0$/,'')+'k';
  return (n/1000000).toFixed(1).replace(/\.0$/,'')+'M';
}

function subLine(a){

function rail(id,apps,art){
