<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Liquid Store</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f7; --card:#ffffff; --ink:#000; --dim:#6c6c70; --dimmer:#aeaeb2;
  --sep:rgba(60,60,67,.16); --blue:#007aff; --fill:rgba(120,120,128,.12); --getbg:rgba(120,120,128,.14);
  --glass:rgba(255,255,255,.46); --glass-hi:rgba(255,255,255,.70);
  --rim:rgba(255,255,255,.85); --rim-lo:rgba(255,255,255,.25); --shadow:rgba(20,30,70,.16);
  --stage:radial-gradient(60% 40% at 0% 0%,#dfe9ff 0%,transparent 70%),radial-gradient(55% 40% at 100% 20%,#ffe4f1 0%,transparent 70%),radial-gradient(60% 40% at 20% 100%,#dcfff4 0%,transparent 70%),#f2f2f7;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000; --card:#1c1c1e; --ink:#fff; --dim:#98989f; --dimmer:#636366;
    --sep:rgba(84,84,88,.55); --blue:#0a84ff; --fill:rgba(120,120,128,.24); --getbg:rgba(120,120,128,.30);
    --glass:rgba(44,44,50,.46); --glass-hi:rgba(70,70,80,.62);
    --rim:rgba(255,255,255,.30); --rim-lo:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.55);
    --stage:radial-gradient(60% 40% at 0% 0%,rgba(40,70,160,.45) 0%,transparent 70%),radial-gradient(55% 40% at 100% 20%,rgba(150,50,120,.35) 0%,transparent 70%),radial-gradient(60% 40% at 20% 100%,rgba(20,130,110,.35) 0%,transparent 70%),#000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000; --card:#1c1c1e; --ink:#fff; --dim:#98989f; --dimmer:#636366;
  --sep:rgba(84,84,88,.55); --blue:#0a84ff; --fill:rgba(120,120,128,.24); --getbg:rgba(120,120,128,.30);
  --glass:rgba(44,44,50,.46); --glass-hi:rgba(70,70,80,.62);
  --rim:rgba(255,255,255,.30); --rim-lo:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.55);
  --stage:radial-gradient(60% 40% at 0% 0%,rgba(40,70,160,.45) 0%,transparent 70%),radial-gradient(55% 40% at 100% 20%,rgba(150,50,120,.35) 0%,transparent 70%),radial-gradient(60% 40% at 20% 100%,rgba(20,130,110,.35) 0%,transparent 70%),#000;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
.stage{position:fixed;inset:0;background:var(--stage)}

/* The phone frame's height is the one declaration the whole layout hangs on:
   every child of .phone is absolutely positioned, so if this line is dropped
   the frame measures zero and the store draws nothing but its background.

   dvh arrived in Chrome 108, two years after everything else in this
   stylesheet - inset (87), aspect-ratio (88), content-visibility (85) - and
   WebView only gets it when the device updates it. On an Android 7-9 phone
   whose WebView has not been updated since 2022 (no Play Store, a frozen
   WebView, an AOSP build) the dvh declaration is invalid at parse time, the
   fallback below is what the frame gets, and the store looks exactly as it
   did before dvh existed. Where dvh is understood the second declaration wins
   and nothing about the layout changes by a pixel. */
.phone{position:relative;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:transparent}
@media (min-width:640px){
  body{display:grid;place-items:center}
  .phone{height:min(900px,94vh);height:min(900px,94dvh);border-radius:48px;background:var(--bg);border:1px solid var(--sep);box-shadow:0 40px 90px rgba(0,0,0,.35)}
}

/* ================= Liquid Glass ================= */
.g{position:relative;isolation:isolate;
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(190%) brightness(1.04);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.04);
  border:.5px solid var(--rim);
  box-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim-lo),inset 0 0 16px rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.08),0 10px 30px var(--shadow)}
.g::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.40) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.18) 100%)}
.press{transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.press:active{transform:scale(.94)}

/* ================= Top chrome ================= */
.navbar{position:absolute;top:0;left:0;right:0;z-index:55;height:calc(60px + var(--safe-t));
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;
  background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  border-bottom:.5px solid var(--sep);opacity:0;transition:opacity .2s;pointer-events:none}
.navbar.show{opacity:1}
.navbar b{font-size:17px;font-weight:600}

.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(56px + var(--safe-t)) 20px 150px;
  -webkit-overflow-scrolling:touch;opacity:0;visibility:hidden;transform:translateY(10px) scale(.995);
  transition:opacity .28s ease,transform .28s ease,visibility .28s}
.view.on{opacity:1;visibility:visible;transform:none}
/* A view that is not on screen is already invisible, but its whole subtree was
   still restyled on every write of the depth variables: all five views are
   rendered and kept in the document, and the four that are off screen hold
   about five sixths of every element, so the ambient sway alone re-resolved
   them ~13 times a second to produce nothing anyone can see. Skipping a
   skipped view is invisible by construction, and it takes roughly three
   quarters of the idle style work with it. .fading is the view we have just
   left: it keeps its contents painted until its fade-out has finished, so the
   cross-fade between tabs looks exactly as it did. */
.view:not(.on):not(.fading){content-visibility:hidden}
.view::-webkit-scrollbar{display:none}

.lt{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 0 12px;gap:12px}
.lt h1{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.lt .eb{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.avatar svg{width:20px;height:20px}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px;gap:10px;padding-top:14px;border-top:.5px solid var(--sep)}
.sec h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.sec span{font-size:15px;color:var(--blue);font-weight:500;white-space:nowrap}
.sec.first{border-top:none;margin-top:6px;padding-top:0}

/* ================= Big Today cards ================= */
.bigcard{position:relative;display:block;width:100%;aspect-ratio:.86;max-height:480px;border-radius:30px;overflow:hidden;margin-bottom:18px;
  color:#fff;cursor:pointer;text-align:left;isolation:isolate;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 18px 40px var(--shadow),0 2px 6px rgba(0,0,0,.12);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.bigcard:active{transform:scale(.97)}
.bc-art{position:absolute;inset:0;z-index:-1;overflow:hidden}
.bc-art::before{content:"";position:absolute;width:150%;aspect-ratio:1;left:-25%;top:-35%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.5),rgba(255,255,255,.08) 45%,transparent 68%)}
.bc-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 30%,transparent 55%,rgba(0,0,0,.26))}
.bc-ltr{position:absolute;right:-6%;top:12%;font-size:260px;font-weight:900;line-height:1;color:rgba(255,255,255,.16);letter-spacing:-10px}
.bc-top{padding:22px 22px 0}
.bc-tag{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.9}
.bc-top h3{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:6px 0 8px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.bc-top p{font-size:15px;line-height:1.4;opacity:.92;max-width:88%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.bc-foot{position:absolute;left:10px;right:10px;bottom:10px;border-radius:22px;padding:10px 12px;display:flex;align-items:center;gap:12px;color:#fff;
  background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
.bc-foot .meta b{color:#fff}.bc-foot .meta small{color:rgba(255,255,255,.82)}
.bc-foot .get{background:rgba(255,255,255,.92);color:#007aff}
.bc-foot .get.ring{background:rgba(255,255,255,.25)}

/* ================= Rows ================= */
.row{position:relative;display:flex;align-items:center;gap:14px;padding:11px 0;content-visibility:auto;contain-intrinsic-size:84px}
.row::after{content:"";position:absolute;left:76px;right:0;bottom:0;height:.5px;background:var(--sep)}
.row:last-child::after{display:none}
.ic{width:62px;height:62px;border-radius:22.5%;flex:0 0 auto;position:relative;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.4)}
.ic .ltr{font-size:26px;font-weight:700;color:rgba(255,255,255,.95)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ic.has{background:none !important}.ic.has .ltr{display:none}
.ic.sm{width:48px;height:48px}.ic.sm .ltr{font-size:20px}
.ic.lg{width:76px;height:76px}.ic.lg .ltr{font-size:31px}
.ic.xl{width:118px;height:118px;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 10px 24px var(--shadow),inset 0 1px 0 rgba(255,255,255,.45)}.ic.xl .ltr{font-size:50px}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;background:var(--fill);color:var(--dim);vertical-align:1px}
.badge.up{background:rgba(255,149,0,.18);color:#ff9500}
.rank{width:20px;text-align:center;font-size:17px;font-weight:700;flex:0 0 auto}

/* GET button + progress ring */
.get{min-width:74px;height:30px;padding:0 16px;border-radius:15px;background:var(--getbg);color:var(--blue);
  font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;display:inline-grid;place-items:center;flex:0 0 auto;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.get:active{transform:scale(.92)}
.get.open{font-weight:700}
.get.ring{min-width:30px;width:30px;padding:0;background:none;position:relative}
.get.ring svg{position:absolute;inset:0;width:30px;height:30px;transform:rotate(-90deg)}
.get.ring circle{fill:none;stroke-width:2.6}
.get.ring .trk{stroke:var(--getbg)}
.get.ring .prg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:69.115;transition:stroke-dashoffset .3s}
.get.ring i{width:10px;height:10px;border-radius:2.5px;background:var(--blue);display:block}
.bc-foot .get.ring .prg{stroke:#fff}.bc-foot .get.ring .trk{stroke:rgba(255,255,255,.3)}.bc-foot .get.ring i{background:#fff}

/* paged columns of 3 */
.cols{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 88%;scroll-snap-align:start;min-width:0}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:18px;font-size:14px;font-weight:600;white-space:nowrap;background:var(--card);color:var(--ink);
  box-shadow:0 0 0 .5px var(--sep)}
.chip span{color:var(--dim);margin-left:6px;font-weight:500}
.chip.act{background:var(--blue);color:#fff;box-shadow:none}.chip.act span{color:rgba(255,255,255,.8)}

.hcards{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hcards::-webkit-scrollbar{display:none}
.hcard{flex:0 0 auto;width:158px;border-radius:26px;padding:14px;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;background:var(--card);box-shadow:0 0 0 .5px var(--sep),0 8px 20px var(--shadow)}
.hcard b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard>span{font-size:12.5px;color:var(--dim);line-height:1.35;height:34px;overflow:hidden}
.hcard .get{align-self:flex-start}
.arc{border-radius:28px;padding:22px;margin:4px 0 2px}
.arc b{font-size:22px;font-weight:800;display:block;margin-bottom:6px;letter-spacing:-.4px}
.arc span{color:var(--dim);font-size:15px;line-height:1.45}

.searchbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;margin:2px 0 6px}
.searchbar svg{width:18px;height:18px;color:var(--dim);flex:0 0 auto}
.searchbar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:17px}
.searchbar input::placeholder{color:var(--dim)}
.empty{text-align:center;color:var(--dim);padding:56px 20px;font-size:16px;line-height:1.55}
.nofooter{display:flex;align-items:center;justify-content:center;gap:8px;padding:28px 0 8px;color:var(--dim);font-size:12.5px}
.nofooter svg{width:14px;height:14px}

.strip{position:absolute;left:16px;right:16px;top:calc(52px + var(--safe-t));z-index:52;border-radius:16px;padding:8px 14px;display:none}
.strip.on{display:block}
.strip-bar{height:3px;border-radius:3px;background:var(--fill);overflow:hidden}
.strip-bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--blue);transition:width .3s}
.strip-text{font-size:11.5px;color:var(--dim);margin-top:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= Dock: floating tab bar + search orb ================= */
.dock{position:absolute;left:16px;right:16px;bottom:calc(10px + var(--safe-b));display:flex;gap:10px;z-index:40}
#tabbar{touch-action:pan-y;user-select:none;-webkit-user-select:none;flex:1;height:66px;border-radius:33px;display:flex;align-items:center;padding:0 6px;overflow:hidden}
.lens{position:absolute;top:6px;bottom:6px;left:0;width:60px;border-radius:27px;z-index:0;pointer-events:none;opacity:1;transition:opacity .25s;will-change:transform;transform-origin:50% 50%;
  background:linear-gradient(165deg,rgba(255,255,255,.55),rgba(255,255,255,.10) 60%,rgba(255,255,255,.30));
  border:.5px solid var(--rim);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -6px 12px rgba(255,255,255,.12),0 4px 14px var(--shadow)}
:root[data-theme="dark"] .lens{background:linear-gradient(165deg,rgba(255,255,255,.28),rgba(255,255,255,.05) 60%,rgba(255,255,255,.14))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lens{background:linear-gradient(165deg,rgba(255,255,255,.28),rgba(255,255,255,.05) 60%,rgba(255,255,255,.14))}}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;height:100%;border-radius:27px;
  font-size:10px;font-weight:600;color:var(--dim);transition:color .25s}
.tab svg{width:24px;height:24px;transition:transform .35s cubic-bezier(.34,1.5,.5,1)}
.tab.on{color:var(--blue)}.tab.on svg{transform:translateY(-1px) scale(1.08)}
.fab{flex:0 0 66px;width:66px;height:66px;border-radius:50%}
.fab svg{width:25px;height:25px}
.fab.on{color:var(--blue);background:var(--glass-hi)}

/* ================= Detail page ================= */
.sheet{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--bg);
  transform:translateX(104%);transition:transform .38s cubic-bezier(.32,.9,.3,1);box-shadow:-20px 0 50px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.pagebar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 6px;pointer-events:none}
.pagebar .spacer{flex:1}
.pagebar .iconbtn{pointer-events:auto}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:19px;height:19px}
/* ---------- depth: every surface sits at its own depth ----------
   perspective() goes inside each transform so the effect does not depend on
   an ancestor chain of preserve-3d, which would force a huge layer tree.
   Each layer reads the touch tilt (--dx/--dy) plus a slow ambient sway
   (--ax/--ay), so the depth is visible even when nothing is being touched.

   --dx and --dy carry a 0 fallback like every other variable here, and it is
   not decoration. They are written by depthFrame(), which only ever runs from
   a pointer move, and depthApply() only writes them when depth is switched
   off - so on a normal launch, with depth on, they were simply not defined.
   A var() with no fallback and no value makes the whole declaration invalid
   at computed-value time, so all of these surfaces - every row, card, chip,
   the tab bar, the navbar, the stage - resolved to transform:none instead of
   the perspective they were written for, and the ambient sway wrote --ax/--ay
   twenty times a second into declarations that could not resolve. The depth
   the store is built around was therefore absent from first paint until the
   reader first touched the screen, at which point every one of those layers
   jumped to its depth at once. With the fallback the same layers resolve to
   the rest pose (dx=dy=0, the state the sway animates around) from the first
   frame, which is what the transform above always described. */
.hero,.bigcard,.row,.tile,.hcard,.chip,.searchbar,.mi,.ic,.tabbar,.navbar,
.pagebar,.setrow,.stat,.shot,.pill,.pill2,.bigget,.get,.arc,.loadcard,.avatar,
.sheet-body>*{
  transform:perspective(700px)
            rotateY(calc((var(--dx,0) + var(--ax,0)) * var(--amt) * var(--r,0deg)))
            rotateX(calc((var(--dy,0) + var(--ay,0)) * var(--amt) * var(--r,0deg) * -1))
            translateZ(calc(var(--z,0px) * var(--amt)))
}
/* near things lean more, far things barely move */
.tabbar{--z:34px;--r:9deg}
.hero,.bigcard{--z:26px;--r:11deg}
.pagebar{--z:22px;--r:7deg}
.navbar{--z:18px;--r:5deg}
.chip,.searchbar,.mi,.tile,.hcard,.arc,.loadcard{--z:16px;--r:7deg}
.row,.setrow,.stat,.sheet-body>*{--z:10px;--r:4.5deg}
.ic,.shot,.pill,.pill2,.bigget,.get,.avatar{--z:5px;--r:2.5deg}
/* the hero lags slightly behind the rows while the list scrolls */
.hero,.bigcard{transform:perspective(700px)
            rotateY(calc((var(--dx,0) + var(--ax,0)) * var(--amt) * var(--r,0deg)))
            rotateX(calc((var(--dy,0) + var(--ay,0)) * var(--amt) * var(--r,0deg) * -1))
            translateZ(calc(var(--z,0px) * var(--amt)))
            translateY(calc(var(--sy,0) * -0.05px))}
/* the background drifts against everything else, and lags the scroll */
.stage{transform:translate3d(calc((var(--dx,0) + var(--ax,0)) * var(--amt) * -34px),
                            calc((var(--dy,0) + var(--ay,0)) * var(--amt) * -30px + var(--sy,0) * 0.08px),
                            0) scale(1.08)}

/* settings controls */
.setrow{display:flex;align-items:center;gap:14px;padding:15px 2px;border-top:.5px solid var(--sep)}
.setrow:first-of-type{border-top:none}
.setrow .meta b{font-size:15px}
.setrow .meta small{font-size:12.5px;color:var(--dim);display:block;margin-top:2px}
.sw{flex:0 0 auto;width:50px;height:30px;border-radius:15px;background:var(--fill);position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw.on{background:var(--blue)}
.sw.on i{transform:translateX(20px)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--fill);outline:none;margin:10px 0 2px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--blue);box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.rngval{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);text-align:right}

/* full-screen screenshot viewer */
.lb{position:absolute;inset:0;z-index:130;display:none;place-items:center;background:rgba(0,0,0,.96)}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .lbx{position:absolute;top:calc(14px + var(--safe-t));right:16px;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.18);color:#fff;font-size:15px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.28);z-index:2}
.shot{cursor:zoom-in}
.sheet-body{flex:1;overflow-y:auto;padding:calc(66px + var(--safe-t)) 20px 50px;scrollbar-width:none}

.sheet-head{display:flex;gap:18px;align-items:flex-start}
.sheet-head h2{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.sheet-head .dev{font-size:15px;color:var(--blue);margin-top:4px}

.acts{display:flex;gap:10px;align-items:center;margin:18px 0 6px}
.pill{height:34px;min-width:96px;padding:0 24px;border-radius:17px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;text-transform:uppercase;
  display:grid;place-items:center;position:relative;overflow:hidden}
.pill .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.22);transition:width .2s linear}
.pill span{position:relative;z-index:2}
.pill2{height:34px;padding:0 18px;border-radius:17px;background:var(--getbg);color:var(--blue);font-size:15px;font-weight:600}
.stats{display:flex;margin:22px 0 4px;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.stat{flex:1;text-align:center;padding:14px 4px;position:relative;min-width:0}
.stat+.stat::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:.5px;background:var(--sep)}
.stat small{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:600}
.stat b{display:block;font-size:17px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shots{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:4px 20px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
.shots::-webkit-scrollbar{display:none}
.shot{flex:0 0 auto;width:158px;height:342px;border-radius:24px;box-shadow:0 0 0 .5px var(--sep);background:#0c1118;position:relative;overflow:hidden;scroll-snap-align:start}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.shot .ph{position:absolute;inset:14px;border-radius:14px;border:1px dashed var(--sep)}
.shot span{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11px;color:var(--dimmer);letter-spacing:1px}
.shot.has .ph,.shot.has span{opacity:0}
.eyebrow{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:22px 0 8px}
.desc{font-size:15.5px;line-height:1.5;margin:14px 0;white-space:pre-wrap}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.linkrow a{padding:9px 16px;border-radius:18px;font-size:14px;font-weight:600;text-decoration:none;color:var(--blue);background:var(--card);box-shadow:0 0 0 .5px var(--sep)}
.meta-list{margin:12px 0;font-size:14px;color:var(--dim);line-height:1.9;word-break:break-all}
.meta-list b{color:var(--ink);font-weight:600}
.bigget{height:50px;width:100%;border-radius:25px;font-size:17px;font-weight:700;color:var(--blue);display:grid;place-items:center;margin-top:8px}
.ghost{height:44px;padding:0 18px;border-radius:22px;font-size:15px;font-weight:600}
.installrow{display:flex;align-items:center;gap:12px;margin:18px 0 4px}

/* ================= Menu / toast / loader ================= */
.menuwrap{position:absolute;inset:0;z-index:80;display:none}
.menuwrap.on{display:block}
.menu{position:absolute;top:calc(62px + var(--safe-t));right:16px;width:250px;border-radius:24px;padding:6px;transform-origin:top right;animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:18px;font-size:16px;font-weight:500;text-align:left}
.mi svg{width:20px;height:20px;color:var(--blue);flex:0 0 auto}
.mi:active{background:var(--fill)}
.mi+.mi{border-top:.5px solid var(--sep);border-radius:0}
.toast{position:absolute;left:50%;bottom:calc(98px + var(--safe-b));transform:translate(-50%,20px) scale(.95);padding:12px 22px;border-radius:22px;font-size:14px;font-weight:600;
  opacity:0;transition:.32s cubic-bezier(.3,1.3,.5,1);z-index:90;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loader{position:absolute;inset:0;z-index:95;display:none;place-items:center;padding:32px;background:var(--stage),var(--bg)}
.loader.on{display:grid}
.loadcard{border-radius:32px;padding:30px 26px;text-align:center;width:100%;max-width:340px}
.loadcard h3{font-size:20px;font-weight:800;margin-bottom:8px}
.loadcard p{font-size:14px;color:var(--dim);line-height:1.5;min-height:40px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:18px 0 10px}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--blue);transition:width .3s}
.spin{width:36px;height:36px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---- bounce: JS drives the spring via the independent `scale` property ---- */
.press:active,.get:active,.bigcard:active{transform:none}
button,.press,[data-detail],.tab,.chip,.mi,.get,.pill,.pill2,.bigget,.iconbtn,.avatar,.row{-webkit-tap-highlight-color:transparent;will-change:scale}

<script>
/* ============================================================
   Liquid Store - bridge + logic unchanged; UI redesigned in the
   style of the iOS App Store with iOS 26 Liquid Glass.
   ============================================================ */
const hasNative = (typeof Android !== 'undefined') && Android && typeof Android.state === 'function';

/* ---------- offline demo bridge (browser only) ---------- */
const DEMO = [
 ['org.fdroid.fdroid','F-Droid','The free and open source app store. Browse, install and update apps from independent developers.','System','4.2 MB','GPL-3.0-only'],
 ['com.termux','Termux','A terminal emulator and Linux environment, no root required.','Development','38 MB','GPL-3.0-only'],
 ['org.videolan.vlc','VLC','Plays anything - every codec, every container, offline.','Multimedia','62 MB','GPL-3.0-only'],
 ['org.mozilla.fennec_fdroid','Fennec F-Droid','Firefox built without proprietary bits, with tracking protection on by default.','Internet','88 MB','MPL-2.0'],
 ['com.simplemobiletools.gallery','Simple Gallery','A gallery that does one thing well: your photos, in folders, fast.','Multimedia','9 MB','Apache-2.0'],
 ['net.osmand.plus','OsmAnd','Offline maps and navigation for the whole planet.','Navigation','112 MB','GPL-3.0-only'],
 ['com.aurora.store','Aurora Store','An unofficial client for the Play Store catalogue, no account needed.','System','6 MB','GPL-3.0-only'],
 ['org.schabi.newpipe','NewPipe','A lightweight YouTube front end with background play.','Multimedia','12 MB','GPL-3.0-only'],
 ['com.lichess.mobileapp','Lichess','Play chess online or against the computer, free forever.','Games','24 MB','GPL-3.0-only'],
 ['org.sufficientlysecure.keychain','OpenKeychain','Encryption for your email and files, built on OpenPGP.','Security','18 MB','GPL-3.0-only'],
 ['de.markusfisch.android.binaryeye','Binary Eye','A barcode and QR scanner with no ads and no tracking.','Utilities','3 MB','MIT'],
 ['com.kunzisoft.keepass.libre','KeePassDX','A password manager that keeps the database on your device.','Security','14 MB','GPL-3.0-only'],
 ['org.fossify.calendar','Simple Calendar','A calendar you can actually read, with no account required.','Time','7 MB','Apache-2.0'],
 ['com.github.axet.bookreader','Book Reader','Read EPUB, PDF and comics from your own library.','Reading','11 MB','GPL-3.0-only'],
 ['org.telegram.messenger','Telegram FOSS','A libre build of Telegram, without the proprietary libraries.','Internet','46 MB','GPL-2.0-only'],
 ['com.gianlu.music','Metro','A music player with a clean material design and no nagging.','Multimedia','8 MB','GPL-3.0-only'],
 ['org.breezyweather','Breezy Weather','A fast, beautiful weather app with multiple sources.','Weather','16 MB','LGPL-3.0-only'],
 ['com.junkfood.seal','Seal','Download videos and audio with a friendly interface.','Multimedia','10 MB','GPL-3.0-only'],
 ['org.sudoku.free','Open Sudoku','Classic sudoku with hints, notes and endless puzzles.','Games','5 MB','GPL-3.0-only'],
 ['org.chess.stockfish','Chess Engine','Play against a strong open-source engine.','Games','9 MB','GPL-3.0-only']
];
function demoApp(a){
  return {pkg:a[0], name:a[1], sum:a[2], cat:a[3], ver:'1.0', sizeText:a[4], icon:'',
          installed:false, installedVer:0, hasUpdate:false, iconAlt:'', iconCand:[], shots:[],
          description:a[2]+'\n\nThis is demo content shown because the store is running outside Android. Inside the app this page is filled from the live repository index.',
          license:a[5], author:'', source:'', issues:'', web:'', version:'1.0', versionCode:1,
          size:0, minSdk:24, updated:Date.now(), apkUrl:''};
}
const demoAll = DEMO.map(demoApp);
let mPhase='idle', mCount=0, mPct=0, mDetail='contacting the repository';
function mockPush(t){ try{ if(window.__store) window.__store(t); }catch(e){} }
function mockStartLoad(){
  if(mPhase==='download'||mPhase==='ready') return;
  mPhase='download'; mCount=0; mPct=0;
  const total=demoAll.length, step=Math.max(1,Math.ceil(total/10));
  const timer=setInterval(function(){
    mCount=Math.min(total,mCount+step); mPct=Math.round(mCount/total*100);
    mDetail=(mCount*0.1).toFixed(1)+' MB / 2.1 MB  \u00b7  '+(mCount*250)+' apps';
    mockPush('apps'); mockPush('state');
    if(mCount>=total){ clearInterval(timer); mPhase='ready'; mPct=100; mDetail=total+' apps'; mockPush('state'); mockPush('ready'); }
  },160);
}
const mockVisible=()=>demoAll.slice(0,mCount);
const MockBridge={
  state:()=>({phase:mPhase,pct:mPct,detail:mDetail,error:'',count:mCount,partial:mPhase!=='ready',repo:'F-Droid (demo)',address:'',timestamp:Date.now()}),
  load:()=>{mockStartLoad()},
  stats:()=>{const v=mockVisible();return{apps:v.filter(a=>a.cat!=='Games').length,games:v.filter(a=>a.cat==='Games').length,categories:new Set(v.map(a=>a.cat)).size,total:v.length}},
  categories:()=>{const v=mockVisible(),m={};v.forEach(a=>m[a.cat]=(m[a.cat]||0)+1);return Object.keys(m).map(k=>({name:k,count:m[k]})).sort((a,b)=>b.count-a.count)},
  list:(q,cat,sort,off,lim)=>{let h=mockVisible().filter(a=>(!cat||a.cat===cat)&&(!q||(a.name+a.pkg+a.sum).toLowerCase().includes(q.toLowerCase())));
    h=sort==='updated'?h.slice().sort((a,b)=>b.updated-a.updated):h.slice().sort((a,b)=>a.name.localeCompare(b.name));
    return{total:h.length,apps:h.slice(off,off+lim)}},
  detail:p=>demoAll.find(a=>a.pkg===p)||{},
  install:()=>({ok:false,error:'Installing only works inside the Android app.'}),
  progress:()=>({pkg:'',phase:'idle',pct:0,got:0,total:0,text:'',error:''}),
  canInstall:()=>({ok:false,message:'Not running on Android.'}),
  requestInstallPermission:()=>{},open:()=>{},uninstall:()=>{},cancel:()=>{},fetchImage:()=>{},imageData:()=>'',cancelLoad:()=>{},
  sources:()=>({custom:'',current:'https://f-droid.org/repo',list:[
    {url:'https://f-droid.org/repo',host:'f-droid.org'},
    {url:'https://mirror.hyd.albony.in/fdroid/repo',host:'mirror.hyd.albony.in'},
    {url:'https://cloudflare.f-droid.org/repo',host:'cloudflare.f-droid.org'}]}),
  setSource:()=>{}
};
const B = hasNative ? {
  state:()=>JSON.parse(Android.state()), load:f=>Android.load(!!f),
  stats:()=>JSON.parse(Android.stats()), categories:()=>JSON.parse(Android.categories()),
  list:(q,c,s,o,l)=>JSON.parse(Android.list(q,c,s,o,l)),
  detail:p=>JSON.parse(Android.detail(p)), install:p=>JSON.parse(Android.install(p)),
  progress:()=>JSON.parse(Android.progress()), canInstall:()=>JSON.parse(Android.canInstall()),
  requestInstallPermission:()=>Android.requestInstallPermission(),
  open:p=>Android.open(p), uninstall:p=>Android.uninstall(p), cancel:()=>Android.cancel(),
  cancelLoad:()=>Android.cancelLoad(), sources:()=>JSON.parse(Android.sources()), setSource:u=>Android.setSource(u)
} : MockBridge;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PALETTE=[['#4facfe','#1b4fd6'],['#ff9a44','#d6336c'],['#f857a6','#7b2ff7'],['#43c59e','#0a7d6b'],
               ['#5aa9e6','#2a3fa8'],['#ff7e5f','#b02a5b'],['#a86bd1','#3b2a99'],['#38d6c4','#1a6bb0']];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function pair(pkg){return PALETTE[hash(pkg)%PALETTE.length]}
function iconEl(a,cls){
  const c=pair(a.pkg), letter=esc((a.name||a.pkg||'?').trim().charAt(0).toUpperCase());
  return `<div class="ic ${cls||''}" style="background:linear-gradient(145deg,${c[0]},${c[1]})"><span class="ltr">${letter}</span>${imgTag(a)}</div>`;
}
const IMG_WAIT={};
/* Bytes we have already fetched for an image, as data URIs, most recently used
   last. Bounded: see imgCachePut(). */
const IMG_DONE=new Map();
/* How long a parked icon may keep costing us a bridge call. Longer than the
   native fetch can possibly take (8s connect + 15s read), so a slow icon is
   never dropped while it is still downloading. */
const IMG_WAIT_MS=30000;
function imgCandidates(a){
  if(a.iconCand&&a.iconCand.length) return a.iconCand.filter(Boolean);
  return a.icon?[a.icon,a.iconAlt||''].filter(Boolean):[];
}
const IMG_REQ={};
/* Every requestImage() call makes exactly one fetchImage(), and the bridge
   answers each one with exactly one 'image' event - on failure too. So when
   the events seen catch up with the requests made, every fetch we are waiting
   on has already reported, and any parked URL with nothing in the cache is
   dead for good. */
let IMG_REQ_N=0, IMG_EV_N=0;
/* The cache used to be a plain object that only ever grew: every icon and every
   screenshot the WebView failed to load was decoded once through the bridge and
   then held as a base64 data URI for the rest of the session. Nothing evicted it,
   and a screenshot is up to 900 KB of bytes - 1.2 M characters of string - so
   browsing twenty app pages left 40 MB of image data resident, with no ceiling
   however long the store stayed open. It is now an LRU with a byte budget: the
   images on screen stay, the ones scrolled past are dropped. Nothing visual
   changes - a dropped URL simply takes the same path it took the first time it
   was shown, which re-reads it from the native file cache on the next render. */
const IMG_DONE_MAX=6*1024*1024;
let IMG_DONE_BYTES=0;
function imgCacheGet(url){
  const d=IMG_DONE.get(url);
  if(d===undefined) return '';
  IMG_DONE.delete(url);IMG_DONE.set(url,d);      /* most recently used goes last */
  return d;
}
function imgCachePut(url,d){
  const old=IMG_DONE.get(url);
  if(old!==undefined){IMG_DONE_BYTES-=old.length;IMG_DONE.delete(url)}
  IMG_DONE.set(url,d);IMG_DONE_BYTES+=d.length;
  while(IMG_DONE_BYTES>IMG_DONE_MAX&&IMG_DONE.size>1){
    const k=IMG_DONE.keys().next().value;
    IMG_DONE_BYTES-=IMG_DONE.get(k).length;
    IMG_DONE.delete(k);
    /* forget that we ever asked, so a later render can ask again instead of
       being told the URL is already spoken for */
    delete IMG_REQ[k];
  }
}
/* One request per URL, ever. Both the renderer and imgFail want the same icon
   and the same icon is drawn in several places (big card, row, detail sheet),
   so asking unconditionally meant a dozen parallel downloads of one file. The
   native cache writes each URL to a single temp path, so those parallel
   downloads clobbered each other and left a truncated icon cached for good. */
function requestImage(url){
  if(!hasNative||!url||IMG_DONE.has(url)||IMG_REQ[url]) return;
  IMG_REQ[url]=1;IMG_REQ_N++;
  try{Android.fetchImage(url)}catch(e){}
}
function imgTagFor(cands,cls){
  if(!cands||!cands.length) return '';
  const cached=imgCacheGet(cands[0]);
  /* Fetch through the native cache immediately instead of waiting for the
     WebView's own request to fail - the WebView request is the flaky one. */
  if(!cached) requestImage(cands[0]);
  return '<img'+(cls?' class="'+cls+'"':'')+' data-cand="'+esc(cands.join('|'))+'" data-i="0" src="'+esc(cached||cands[0])+'" alt="" decoding="async"'+
    ' onload="this.style.opacity=1;this.parentNode.classList.add(\'has\')" onerror="imgFail(this)">';
}
function imgTag(a){return imgTagFor(imgCandidates(a),'')}
function imgFail(el){
  if(el.getAttribute('data-native')==='2'){el.remove();return}
  const cands=(el.getAttribute('data-cand')||'').split('|').filter(Boolean);
  const i=parseInt(el.getAttribute('data-i')||'0',10);
  if(i+1<cands.length){el.setAttribute('data-i',String(i+1));el.src=cands[i+1];return}
  const url=cands[0]||el.src;
  if(url&&el.getAttribute('data-native')!=='1'&&hasNative){
    el.setAttribute('data-native','1');
    /* each parked URL remembers when it was parked, so a wait can expire */
    const w=IMG_WAIT[url]||(IMG_WAIT[url]={els:[],at:Date.now()});
    w.els.push(el);
    requestImage(url);
    /* The fetch can finish before the <img> has got through its own candidate
       chain, in which case its 'image' event has already been consumed and no
       later one is coming for this URL - the icon would stay blank until some
       unrelated image happened to arrive. requestImage() leaves IMG_REQ[url]
       at 2 once the bridge has reported that fetch (see applyImages), so the
       lookup is done here only in that case, and only for this URL. Pass
       false: no event has arrived here, and counting one anyway is what
       broke this. */
    if(IMG_REQ[url]===2) applyImages(url,false);
    return;
  }
  el.remove();
}
/* `countEvent` is false only for the pass imgFail() runs on its own behalf.
   Every other caller is the bridge reporting a finished fetch, so it is one
   event. Counting the manual pass as well left IMG_EV_N permanently ahead of
   IMG_REQ_N, and since the retirement test below is IMG_EV_N>=IMG_REQ_N it
   then read as "every fetch has reported" for the rest of the session: each
   later parked icon was dropped while its bytes were still in flight and
   stayed a letter placeholder instead of the real icon.

   `reported` is the URL whose fetch the bridge has just finished. The page is
   told which one now (see StoreBridge.pushImage) and only that URL's wait is
   looked up. Without it this loop asked imageData() about every parked image
   on every single image event, and imageData is a synchronous bridge call - a
   SHA-1 of the URL and then a file stat, on the thread that is also trying to
   paint. One screenful of forty icons therefore cost about forty calls per
   icon: measured on a 640-row catalogue, 22,699 imageData calls to page
   through it against 566 fetches. Now it is one call per fetch. */
function applyImages(reported, countEvent){
  if(countEvent!==false) IMG_EV_N++;
  /* 1 means requested, 2 means requested and answered - see requestImage() */
  if(reported) IMG_REQ[reported]=2;
  /* One pass over the images. Scanning the document once per cached URL made
     this quadratic - with a hundred cached icons it ran a hundred full DOM
     queries for every single image that arrived. */
  const imgs=document.querySelectorAll('img[data-cand]');
  for(let q=0;q<imgs.length;q++){
    const im=imgs[q];
    if(im.getAttribute('data-native')==='2') continue;
    const c=(im.getAttribute('data-cand')||'').split('|')[0];
    const d=imgCacheGet(c);
    if(!d) continue;
    im.setAttribute('data-native','2'); im.src=d; im.style.opacity=1;
    if(im.parentNode) im.parentNode.classList.add('has');
  }
  const now=Date.now(), settled=IMG_EV_N>=IMG_REQ_N;
  for(const url in IMG_WAIT){
    /* Only the URL the bridge just reported can have new bytes behind it.
       Every other parked image is still downloading, so asking about it would
       be a bridge call for a file that cannot be there yet.

       But once every fetch we made has reported, none of them is still in
       flight - and a parked URL with nothing in the cache can never be filled,
       because requestImage() remembers it has already been asked and will not
       ask again, and no second event will ever name it. So nothing would look
       at that entry again: it stayed in this table for the life of the page,
       holding the <img> elements of a list that had long since been
       re-rendered, one entry per icon the mirror did not have. Measured at 85
       after six screenfuls of a 200-row catalogue, and it only grows as the
       reader scrolls and opens app pages. Retire them here, with a map lookup
       and no bridge call: a file that was never fetched cannot be on disk. */
    if(url!==reported){
      if(settled&&!IMG_DONE.has(url)) delete IMG_WAIT[url];
      continue;
    }
    const w=IMG_WAIT[url];
    let d=imgCacheGet(url);
    if(!d){
      try{d=Android.imageData(url)}catch(e){d=''}
      if(!d){
        /* Nothing cached. Retire the wait instead of polling it for the life
           of the page: imageData is a synchronous bridge call (a file stat on
           the device), and a mirror that has no icon for an app never answers,
           so every dead URL used to stay in this table for good and cost one
           call per image event - quadratic in the number of missing icons. A
           re-render also left the detached <img> parked here. */
        let live=0;
        for(let k=0;k<w.els.length;k++) if(w.els[k].parentNode) live++;
        if(!live||settled||now-w.at>IMG_WAIT_MS){delete IMG_WAIT[url];continue}
        if(live!==w.els.length){
          const keep=[];
          for(let k=0;k<w.els.length;k++) if(w.els[k].parentNode) keep.push(w.els[k]);
          w.els=keep;
        }
        continue;
      }
      imgCachePut(url,d);
    }
    const els=w.els;
    for(let k=0;k<els.length;k++){
      const el=els[k]; el.setAttribute('data-native','2'); el.style.opacity=1;
      if(el.parentNode) el.parentNode.classList.add('has'); el.src=d;
    }
    delete IMG_WAIT[url];
  }
}
function dateText(ms){if(!ms)return'';const d=new Date(ms),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`}

function renderCategoryView(view,keep){
  const page=S.pages[view+':']||(S.pages[view+':']={offset:0,done:false});
  /* keep: re-draw for a state change (install progress, install result) and put
     back every page the user had already scrolled to. Without it a single
     progress tick threw away the paginated list and dropped the reader back to
     the first 40 rows. */
  const want=keep?page.offset:0;

  if(view==='apps'){

    h+=`<div class="chips"><button class="chip press ${S.category===''?'act':''}" data-cat="">All<span>${S.stats.total}</span></button>
      ${cats.map(c=>`<button class="chip press ${S.category===c.name?'act':''}" data-cat="${esc(c.name)}">${esc(c.name)}<span>${c.count}</span></button>`).join('')}</div>`;
  }

  h+=`<div class="sec ${view==='apps'?'':'first'}"><h2>${view==='games'?'Top Games':(S.category?esc(S.category):'All Apps')}</h2><span data-count></span></div><div data-listbox></div>`;
  const el=$('#view-'+view); el.innerHTML=h;
  page.offset=0;page.done=false;

function loadMore(view,cat,box,label,page,replace,want,q,sort){
  if(!box||page.done) return;
  /* one call for the whole restored range, not one per page */
  const limit=want&&want>40?want:40;
  /* q/sort are only supplied by search, which pages by relevance against a
     live query; the catalogue views keep sorting by name with no filter */
  const r=B.list(q||'',cat,sort||'name',page.offset,limit);
  if(label) label.textContent=r.total+(r.total===1?' app':' apps');
  if(replace) box.innerHTML='';
  if(r.apps.length===0&&page.offset===0) box.innerHTML='<div class="empty">No apps in this category.</div>';
  /* A chart number belongs to the catalogue lists, not to search results.
     Search draws its first page with rowHtml(a) and no rank, but it pages in
     through here, and this line numbered every row it appended: scroll a
     result list past sixty and the rows after it grew a 20px rank column,
     starting at "61" with nothing above it to count from, and every icon on
     them shifted right by that column - a list that changed shape halfway
     down and stayed that way. Rank only the lists that start at the top with
     a number; q is set only by search (see the note above). */
  else box.insertAdjacentHTML('beforeend',r.apps.map((a,i)=>rowHtml(a,q?0:page.offset+i+1)).join(''));
  page.offset+=r.apps.length;
  if(page.offset>=r.total||r.apps.length===0) page.done=true;
}
function renderSearch(){
  $('#view-search').innerHTML=head('Search')+`<div class="searchbar g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="searchInput" placeholder="Apps, games and more" autocomplete="off" spellcheck="false" value="${esc(S.query)}"></div><div id="searchOut"></div>`;
  const input=$('#searchInput');
  input.addEventListener('input',()=>{S.query=input.value;runSearch()});
  /* opening the tab starts at the top of the results, not where the last
     visit left off - the same thing switchTab does to the catalogue views */
  const sp=S.pages['search:']; if(sp) sp.q=null;
  runSearch();
  if(S.focusSearch){setTimeout(()=>input.focus(),80);S.focusSearch=false}
}
/* Search asked for one page of sixty and then stopped: the heading reported
   the true match count while the list under it held sixty rows and offered no
   way to reach the rest, so a query matching four hundred apps silently lost
   eight hits in every nine - and the reader had no sign anything was missing.
   It now pages in like Games and Apps do, against the same relevance order.

   A re-render for the same query puts back the pages already scrolled to, so
   an install tick or a returning tab no longer drops the reader back to the
   first page; a different query starts again at the top. */
function runSearch(){
  const out=$('#searchOut'); if(!out) return;
  const q=S.query.trim();
  const page=S.pages['search:']||(S.pages['search:']={offset:0,done:false,q:''});
  if(!q){
    page.offset=0;page.done=true;page.q='';
    out.innerHTML=`<div class="sec first"><h2>Popular Right Now</h2></div>`+B.list('','','updated',0,8).apps.map(a=>rowHtml(a)).join('');
    searchTop();
    return;
  }
  const changed=page.q!==q;
  const want=changed?0:page.offset;
  page.q=q;page.offset=0;page.done=false;
  const first=B.list(q,'','relevance',0,Math.max(60,want));
  if(!first.apps.length){
    page.done=true;
    out.innerHTML=`<div class="empty">No results for &ldquo;${esc(q)}&rdquo;.<br>Try &ldquo;player&rdquo;, &ldquo;keyboard&rdquo; or &ldquo;reader&rdquo;.</div>`;
    return;
  }
  out.innerHTML=`<div class="sec first"><h2>${first.total} Result${first.total===1?'':'s'}</h2></div><div data-listbox></div>`;
  const box=out.querySelector('[data-listbox]');
  box.insertAdjacentHTML('beforeend',first.apps.map(a=>rowHtml(a)).join(''));
  page.offset=first.apps.length;
  if(page.offset>=first.total) page.done=true;
  /* A new query must be read from its first result. The list is rebuilt in
     place, so the view kept the offset of the previous query's list - type a
     new search while scrolled to the bottom and you landed in the middle of
     the new matches, with the scroll handler firing straight away and pulling
     in a page nobody asked for. */
  if(changed) searchTop();
}
function searchTop(){const v=$('#view-search');if(v) v.scrollTop=0}

/* ---------- detail page ---------- */
/* Fill the sheet with a new page.

   The sheet body is one scrolling element that every page reuses, so its
   scrollTop survived the swap: open an app, read to the bottom, go back, tap
   another one, and that page appeared already scrolled to its end - the reader
   landed on the footer and the package line, with the icon, the name and the
   Get button far above the fold, and had to scroll up to find out which app
   they had just opened. Every page the sheet shows starts at its top now.

   keepScroll is for the one case that is not a new page: re-rendering the app

function openSheet(pkg){

    <div class="desc">${esc(a.description||a.summary||a.sum||'')}</div>

/* ---------- install ---------- */
function beginInstall(pkg){
  const r=B.install(pkg);
  if(r&&r.ok){S.installing[pkg]={pct:0};refreshVisible();pollStart();return}
  const msg=(r&&r.error)||'Could not start the install.';
  if(msg==='permission') showPermission(); else toast(msg);
}
function showPermission(){
  const c=B.canInstall();

    <div class="desc">${esc(c.message||'Android needs your permission before Liquid Store can install apps. This is a one-time switch - after that installs start straight from the store.')}</div>
    <div class="installrow"><button class="bigget g press" id="grantBtn"><span>Open settings</span></button></div>
    <div class="meta-list">Nothing else is requested: no account, no sign-in, no advertising identifier.</div>`);

/* One progress tick changes exactly one control: the ring on that package's
   Get button, and - if its detail page happens to be open - the fill of its
   pill. refreshVisible() rebuilt the entire visible list for that, so every
   half second of a download threw away and re-created every loaded row (and
   re-queried the catalogue behind it): 250 ms per tick over 240 rows on a
   throttled CPU, i.e. the list froze for the length of the download. Patch
   the two controls in place instead - same markup getBtnHtml() would emit,
   so nothing visual differs. */
function paintProgress(pkg){
  const inst=S.installing[pkg]; if(!inst) return;
  const html=getBtnHtml({pkg:pkg});
  const nodes=document.querySelectorAll('[data-detail]');
  for(let i=0;i<nodes.length;i++){
    const el=nodes[i];
    if(el.getAttribute('data-detail')!==pkg) continue;
    const btn=el.querySelector('.get');
    if(btn) btn.outerHTML=html;
  }

function pollInstall(){

  else if(p.phase==='failed'){delete S.installing[p.pkg];toast(p.error||'Install failed');refreshVisible();if(S.sheetPkg===p.pkg)openSheet(p.pkg);pollStop()}

/* The install poll belongs to an install, and only to an install.

   pollStart() used to be called from boot() and from doRefresh(), so every
   launch - and every refresh - opened a 500 ms interval that asked the bridge
   for install progress before any install existed, and pollStop() was reached
   only by an install that finished or by a catalogue that finished loading. A
   catalogue that never finishes - no network, every mirror down, the "Could
   not load" screen - therefore left that timer running for the rest of the
   session: two synchronous progress() calls across the WebView bridge every
   second, for ever, on a page that had nothing to report and no way to be rid
   of it. It is started by beginInstall() now, stopped by the terminal phase of
   the install that started it, and stopped by the error screen; a catalogue

function switchTab(v){

  }

     come back, and the reader landed at the bottom of the forty rows that had
     been rebuilt - every row above them gone - while the scroll handler,
     seeing a position near the end, pulled pages back in to cover the gap it

   landed after the previous event's classList.toggle() had dirtied style, so
   every pointermove paid a full style recalculation of the whole document:
   a 120-event drag cost 107 recalculations and 250 ms of style work on a
   desktop CPU, i.e. several times that on a phone, and the lens lagged the

let tgCache=null;
function tabGeom(){
  if(tgCache) return tgCache;
  tgCache=[...$('#tabbar').querySelectorAll('.tab')].map(t=>({view:t.dataset.view,x:t.offsetLeft+3,w:Math.max(0,t.offsetWidth-6)}));
  return tgCache;
}

   like a drop of liquid at mid-flight, then settles with a soft overshoot. */

  const active=bar.querySelector('.tab.on');
  if(!active){lens.style.opacity=0;return}
  lens.style.opacity=1;
  const tx=active.offsetLeft+3, tw=Math.max(0,active.offsetWidth-6);
  lens.style.width=tw+'px';

  const from=lensX==null?tx:lensX;
  lens.style.transform='translateX('+tx+'px)';       /* commit the end state first */
  lensX=tx;
  if(instant||Math.abs(from-tx)<1||REDUCED.matches||!lens.animate) return;
  const travel=Math.abs(tx-from);
  const stretch=1+Math.min(.6,travel/Math.max(1,tw)*.34);
  const mid=(from+tx)/2;
  lensAnim=lens.animate([
    {transform:'translateX('+from+'px) scale(1,1)'},
    {transform:'translateX('+mid+'px) scale('+stretch+',.93)',offset:.42},
    {transform:'translateX('+tx+'px) scale(1,1)'}

/* drag the lens across the bar, release to snap to the nearest tab */
(function(){

    down=true;drag=false;sx=e.clientX;tgCache=null;   /* fresh geometry for this drag */
    const act=bar.querySelector('.tab.on');
    sl=lensX!=null?lensX:(act?act.offsetLeft+3:0);
  });
  bar.addEventListener('pointermove',function(e){
    if(!down) return;
    const dx=e.clientX-sx;
    if(!drag&&Math.abs(dx)>8){
      drag=true;
      if(lensAnim){lensAnim.cancel();lensAnim=null}
      try{bar.setPointerCapture(e.pointerId)}catch(_){}
      lens.style.opacity=1;
    }
    if(!drag) return;
    const g=tabGeom();
    const x=Math.max(g[0].x,Math.min(g[g.length-1].x,sl+dx));
    lens.style.transform='translateX('+x+'px) scale(1.1,.96)';
    lensX=x;
    const c=x+g[0].w/2;
    let best=g[0],bd=1e9;
    g.forEach(function(t){const d=Math.abs(t.x+t.w/2-c);if(d<bd){bd=d;best=t}});
    bar.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.view===best.view)});
  });

    if(!down) return;
    down=false;
    if(!drag) return;
    drag=false;tabDragged=true;setTimeout(function(){tabDragged=false},120);
    const act=bar.querySelector('.tab.on');
    if(act&&act.dataset.view!==S.view) switchTab(act.dataset.view);
    else moveLens(false);
  }

})();

/* ---------- 4D depth ---------- */
const DEPTH_KEY='liquid.depth';
const D={on:true, amt:0.45, tilt:false, dx:0, dy:0, tx:0, ty:0, raf:0};
function depthLoad(){
  try{
    const raw=localStorage.getItem(DEPTH_KEY);
    if(raw){const o=JSON.parse(raw);if(typeof o.on==='boolean')D.on=o.on;if(typeof o.amt==='number')D.amt=o.amt;if(typeof o.tilt==='boolean')D.tilt=o.tilt}

}
function depthSave(){try{localStorage.setItem(DEPTH_KEY,JSON.stringify({on:D.on,amt:D.amt,tilt:D.tilt}))}catch(e){}}
function depthApply(){
  const r=document.documentElement;
  r.style.setProperty('--amt', D.on ? String(D.amt) : '0');
  if(!D.on){r.style.setProperty('--dx','0');r.style.setProperty('--dy','0')}
}
function depthFrame(){
  D.raf=0;
  const k=0.14;
  if(!depthActive()) return;
  D.dx+=(D.tx-D.dx)*k; D.dy+=(D.ty-D.dy)*k;
  const r=document.documentElement;
  r.style.setProperty('--dx',D.dx.toFixed(4));
  r.style.setProperty('--dy',D.dy.toFixed(4));
  if(Math.abs(D.tx-D.dx)>0.001||Math.abs(D.ty-D.dy)>0.001) D.raf=requestAnimationFrame(depthFrame);

/* Whether the depth effect can currently change a pixel.

   This is the most expensive thing on the page. --dx/--dy/--ax/--ay are
   inherited custom properties written on :root, so every write invalidates
   style for the whole document and the browser answers with a full style
   recalculation - measured at 31 ms per write here, i.e. several times that on
   a phone. The ambient sway writes two of them twenty times a second for as
   long as the screen is on.

   At Strength 0 none of that work can be seen. Every consumer of those four
   variables multiplies them by --amt (see the depth block in the stylesheet),
   and --amt is 0, so each layer's transform resolves to rotateY(0deg)
   rotateX(0deg) translateZ(0px) - identity, exactly as if no transform were
   there at all. The effect is off; the cost was not. The "Enable depth" switch
   stopped the work, but the Strength slider did not, and the panel tells the
   reader to "turn it down if it feels busy" - so the reader who turns it all
   the way down, the one the motion was bothering, kept roughly a fifth of a
   core busy restyling a document that could not look any different. Measured
   at Strength 0 before this: 60 full-document recalculations and 596 ms of
   style work per 3 idle seconds, every one of them invisible.

   the ambient sway - is gated on this now. Nothing visual changes: at any
   strength above 0 the behaviour is exactly what it was, and at 0 the pixels

function depthPoint(nx,ny){

function depthInit(){

  document.addEventListener('pointermove',function(e){
    if(!depthActive()||D.tilt) return;
    depthPoint((e.clientX/window.innerWidth)*2-1,(e.clientY/window.innerHeight)*2-1);
  },{passive:true});
  document.addEventListener('pointerleave',function(){ if(depthActive()&&!D.tilt) depthPoint(0,0) },{passive:true});
  /* device tilt, only when the user turns it on */
  window.addEventListener('deviceorientation',function(e){
    if(!depthActive()||!D.tilt) return;
    if(e.gamma==null&&e.beta==null) return;
    const g=Math.max(-35,Math.min(35,e.gamma||0))/35;
    const b=Math.max(-35,Math.min(35,(e.beta||0)-45))/35;

/* a slow, cheap sway so the depth is visible without touching the screen.
   It only feeds the background and chrome, so the rows are never restyled. */
var ambT=0, ambTimer=0;
function ambientStart(){

  if(ambTimer) return;
  ambTimer=setInterval(function(){
    if(!depthActive()||document.hidden) return;
    ambT+=0.055;
    const r=document.documentElement;
    r.style.setProperty('--ax',(Math.sin(ambT)*0.30).toFixed(3));
    r.style.setProperty('--ay',(Math.cos(ambT*0.73)*0.22).toFixed(3));

}
function ambientStop(){ if(!ambTimer) return; clearInterval(ambTimer); ambTimer=0;

/* The parallax offset is a custom property on :root, so every write makes the
   style engine re-resolve it for the whole document. It also saturates at

   value that had not changed. Remember what was last written and skip the
   no-op. Same helper on a tab switch, so the offset always belongs to the
   view that is actually on screen. */
let syLast=null, syRaf=0, syEl=null;

  const sy=String(Math.min(v?Math.max(0,v.scrollTop):0,400));

/* A scroll gesture fires many events per frame and every write of --sy on

    v.setAttribute('data-par','1');
    v.addEventListener('scroll',function(){
      if(!D.on) return;

    },{passive:true});
  });

function openDepth(){

      '<div class="cat">Layers tilt against each other as you move</div></div></div>'+
    '<div class="desc">The tab bar, cards and background sit at different depths, so the screen tilts like a window when you drag or tilt the phone. Turn it down if it feels busy.</div>'+
    '<div class="setrow"><div class="meta"><b>Enable depth</b><small>Off leaves everything flat</small></div>'+
      '<div class="sw'+(D.on?' on':'')+'" id="dOn" role="switch" aria-checked="'+D.on+'"><i></i></div></div>'+
    '<div class="setrow" style="display:block"><div class="meta"><b>Strength</b><small>How far the layers move</small></div>'+
      '<input type="range" class="rng" id="dAmt" min="0" max="100" step="1" value="'+Math.round(D.amt*100)+'">'+
      '<div class="rngval" id="dAmtVal">'+Math.round(D.amt*100)+'%</div></div>'+
    '<div class="setrow"><div class="meta"><b>Follow device tilt</b><small>Use the phone&rsquo;s sensors instead of touch</small></div>'+
      '<div class="sw'+(D.tilt?' on':'')+'" id="dTilt" role="switch" aria-checked="'+D.tilt+'"><i></i></div></div>'+
    footer());
  $('#sheet').classList.add('on');

  $('#dOn').addEventListener('click',function(){
    D.on=!D.on; this.classList.toggle('on',D.on); this.setAttribute('aria-checked',String(D.on));
    depthApply(); depthSave(); if(!D.on){D.tx=0;D.ty=0;depthKick();ambientStop()}
    else ambientStart();
    toast(D.on?'Depth on':'Depth off');
  });
  $('#dTilt').addEventListener('click',function(){
    D.tilt=!D.tilt; this.classList.toggle('on',D.tilt); this.setAttribute('aria-checked',String(D.tilt));
    depthSave(); if(D.tilt){D.tx=0;D.ty=0;depthKick()}
    toast(D.tilt?'Following device tilt':'Following touch');
  });
  const rng=$('#dAmt');
  rng.addEventListener('input',function(){
    D.amt=(+this.value)/100; $('#dAmtVal').textContent=this.value+'%';
    depthApply(); depthKick();
    /* starts the sway again when the reader drags back above 0, and parks it
       when they reach 0, where it could only restyle for nothing */
    ambientStart();
  });
  rng.addEventListener('change',function(){depthSave()});
}

depthInit();
ambientStart();
bindScrollParallax();

function openSources(){
  const s=B.sources();
  const rows=s.list.map(m=>{
    const inUse=s.current===m.url;
    return '<div class="row"><div class="meta"><b>'+esc(m.host)+'</b><small>'+esc(m.url)+'</small></div>'+
      (inUse?'<span class="badge">In use</span>':'<button class="get" data-usesrc="'+esc(m.url)+'">Use</button>')+'</div>';
  }).join('');
  sheetBody(
    '<div class="sheet-head"><div style="flex:1"><h2>Sources</h2><div class="cat">Where the catalogue and apps come from</div></div></div>'+
    '<div class="desc">Liquid Store asks every source at once and downloads from whichever answers fastest. If loading keeps failing, pick one below, or enter your own repository address.</div>'+
    '<div class="searchbar g"><input id="srcInput" placeholder="https://your.mirror/fdroid/repo" autocomplete="off" spellcheck="false" value="'+esc(s.custom||'')+'"></div>'+
    '<div class="installrow"><button class="bigget g press" id="srcSave"><span>Save and reload</span></button></div>'+
    '<div class="eyebrow">Official mirrors</div>'+rows+footer());
  $('#sheet').classList.add('on');
  const save=$('#srcSave');
  if(save) save.addEventListener('click',function(){
    const v=$('#srcInput').value.trim();B.setSource(v);closeSheet();
    toast(v?'Source set to '+v:'Using the fastest source');doRefresh();
  });
}

/* scroll: compact nav title + pagination */
document.querySelectorAll('.view').forEach(function(v){
  v.addEventListener('scroll',function(){
    if(v.classList.contains('on')) $('#navbar').classList.toggle('show',v.scrollTop>50);
    if(!S.ready) return;
    if(v.scrollTop+v.clientHeight<v.scrollHeight-400) return;
    const view=v.id.replace('view-','');
    if(view!=='games'&&view!=='apps'&&view!=='search'&&view!=='arcade') return;
    const page=S.pages[view+':'], box=v.querySelector('[data-listbox]'), label=v.querySelector('[data-count]');
    if(!page||!box) return;
    if(view==='search'){
      /* only extend a list that belongs to the query still in the box */
      const q=S.query.trim();
      if(!q||page.q!==q) return;
      loadMore(view,'',box,label,page,false,0,q,'relevance');
      return;
    }
    const cat=(view==='games'||view==='arcade')?'Games':S.category;
    loadMore(view,cat,box,label,page,false,0,'','name');
  },{passive:true});
});
window.addEventListener('error',function(ev){try{toast('Something went wrong: '+(ev.message||'unknown'))}catch(e){}});
(function(){
  const h=(location.hash||'').replace(/^#/,''); if(!h) return;
  if(h.indexOf('app/')===0){setTimeout(()=>openSheet(h.slice(4)),200);return}
  if(h==='sources'){setTimeout(openSources,250);return}
  if(TITLES[h]) setTimeout(()=>switchTab(h),200);
})();

/* ================= Bounce + water sound ================= */
(function(){
  var SEL='button,.press,[data-detail],[data-cat],.tab,.chip,.mi,.get,.pill,.pill2,.bigget,.iconbtn,.avatar,.row,a[href]';
  var down=null,pressAnim=null,canAnim=!!(document.documentElement.animate);

  function depth(el){
    var w=el.getBoundingClientRect().width;
    return w>220?0.97:w>110?0.94:0.86;   /* big cards move a little, small buttons a lot */
  }
  function pressIn(el){
    if(!canAnim)return;
    try{
      var s=depth(el);
      pressAnim=el.animate([{scale:'1'},{scale:String(s)}],{duration:110,easing:'ease-out',fill:'forwards'});
    }catch(e){}
  }
  function release(el){
    if(!canAnim||!el)return;
    try{
      var s=depth(el);
      if(pressAnim){pressAnim.cancel();pressAnim=null}
      el.animate([
        {scale:String(s)},
        {scale:String(Math.min(1.12,1+(1-s)*0.9)),offset:.35},
        {scale:String(1-(1-s)*0.3),offset:.6},
        {scale:String(1+(1-s)*0.12),offset:.82},
        {scale:'1'}
      ],{duration:520,easing:'cubic-bezier(.2,.8,.3,1)'});
    }catch(e){}
  }

  /* ---- water drop sound (synthesised, no audio file needed) ---- */
  var ac=null;
  function ctx(){
    try{
      if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}
      if(ac.state==='suspended')ac.resume();
      return ac;
    }catch(e){return null}
  }
  function bloop(c,t,f0,f1,dur,vol){
    var o=c.createOscillator(),g=c.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.45);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+dur+0.02);
  }
  function waterSound(){
    var c=ctx();if(!c)return;
    var t=c.currentTime+0.005;
    bloop(c,t,   320, 980, 0.24,0.34);   /* main drop  */
    bloop(c,t+0.07,520,1500,0.17,0.16);  /* small bubble */
    bloop(c,t+0.15,210, 560,0.22,0.14);  /* low glug   */
    /* soft splash */
    var len=Math.floor(c.sampleRate*0.28),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    var n=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
    n.buffer=buf;bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=0.7;
    g.gain.value=0.07;
    n.connect(bp);bp.connect(g);g.connect(c.destination);n.start(t);
  }

  document.addEventListener('pointerdown',function(e){
    ctx();                               /* unlock audio on first touch */
    var el=e.target.closest&&e.target.closest(SEL);
    if(!el||el.disabled)return;
    down=el;pressIn(el);
  },true);
  function up(){if(down){release(down);down=null}}
  document.addEventListener('pointerup',up,true);
  document.addEventListener('pointercancel',up,true);

  /* Get / Update button -> water sound */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-install]');
    if(b)waterSound();
  },true);
})();
</script>
