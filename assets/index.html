  return `<div class="railwrap"><div class="rail" id="${id}">${list.map(a=>tile(a,art)).join('')}</div>`+
    `<button class="railnav prev g press" data-nav="-1" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`+
    `<button class="railnav next g press" data-nav="1" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>`;
}
function wireRails(root){
  if(!root) return;
  root.querySelectorAll('.railwrap').forEach(function(wrap){
    const rail=wrap.querySelector('.rail'); if(!rail) return;
    const step=function(){const t=rail.querySelector('.tile');return t?Math.round(t.getBoundingClientRect().width+12):250};
    const pad=function(){return (parseFloat(getComputedStyle(rail).paddingLeft)||0)+2};
    const sync=function(){
      const max=rail.scrollWidth-rail.clientWidth;
      wrap.querySelectorAll('.railnav').forEach(function(n){
        const dir=+n.dataset.nav;
        n.style.display=max<=2?'none':'';
        n.disabled=dir<0?rail.scrollLeft<=pad():rail.scrollLeft>=max-2;
      });
    };
    wrap.querySelectorAll('.railnav').forEach(function(n){
      n.addEventListener('click',function(){rail.scrollBy({left:(+n.dataset.nav)*step(),behavior:'smooth'});setTimeout(sync,360)});
    });
    rail.addEventListener('scroll',sync,{passive:true});
    let down=false,startX=0,startLeft=0,dragged=false;
    rail.addEventListener('pointerdown',function(e){
      if(e.pointerType!=='mouse'||e.button!==0) return;
      down=true;dragged=false;startX=e.clientX;startLeft=rail.scrollLeft;
    });
    rail.addEventListener('pointermove',function(e){
      if(!down) return;
      const dx=e.clientX-startX;
      if(!dragged&&Math.abs(dx)<5) return;
      if(!dragged){dragged=true;rail.classList.add('dragging')}
      rail.scrollLeft=startLeft-dx;
    });
    const release=function(){
      if(!down) return;
      down=false;rail.classList.remove('dragging');
      if(dragged){const s=step();rail.scrollTo({left:Math.round(rail.scrollLeft/s)*s,behavior:'smooth'});setTimeout(sync,360)}
    };
    rail.addEventListener('pointerup',release);
    rail.addEventListener('pointercancel',release);
    rail.addEventListener('pointerleave',release);
    rail.addEventListener('click',function(e){
      if(!dragged) return;
      dragged=false;e.preventDefault();e.stopPropagation();
    },true);
    sync();
  });
}

function renderArcade(keep){

     reply, and then threw all forty away: the rows under that heading come
     from loadMore() at the end of this function, which asks for its own first
     page. So every Arcade redraw - a tab switch, every install event, every
     batch of a streaming refresh - serialised forty full catalogue entries in
     Java (each with its name, summary, category, version, size, icon URL and
     the two-to-four candidate URLs behind it, plus its installed flags),
     shipped them across the bridge as JSON, parsed them here, and drew none of
     them. .total does not depend on the limit, so one row answers exactly the
     same question.

     Measured on a 1,200-app catalogue, one Arcade render asked for 88 rows and
     52 KB of JSON, and 40 of those rows - 23.7 KB, 45% of the payload - were
     read only for .total and discarded; ten redraws (what a refresh or a run
     of install events costs) moved 522 KB, 237 KB of it thrown away. F-Droid's
     real index is four times that, with longer summaries.

     Nothing changes on screen: .total is hits.size(), which the limit cannot
     affect, so the heading counts the same games and the empty-list test below
     takes the same branch at the same moment.

     That last sentence is also why the second query is gone. The count was
     still being fetched with its own call - B.list('','Games','name',0,1),
     asking for one row only to read .total off the reply - and the reply
     already in hand, the one for the "New This Week" row above, carries the
     same number: it is the same filter (category Games, no search term), and
     .total is hits.size(), which neither the limit nor the sort order can
     touch. Two calls where one answers both questions.

     It was not free. StoreBridge.query() keys its cache on the sort order, so
     ('','Games','updated') and ('','Games','name') are two entries, and the
     first Arcade render after a catalogue is published scans the whole index
     and sorts the Games subset twice; the second reply is then encoded in
     Java, shipped across the bridge, parsed here and dropped. On a 6,000-app
     catalogue that is a second full pass over the games list and a wasted JSON
     round trip on every Arcade redraw - a tab switch, every install event,
     every batch of a streaming refresh (refreshVisible() calls renderArcade).
     Measured with a stand-in bridge over 6,000 entries: three list() calls per

  const want=keep?page.offset:0;

     the tab switch that had forgotten. The category chips were the last one
     left out - they are drawn inside the Apps view itself, so tapping one
     calls renderCategoryView('apps') directly, never switchTab(), and the
     view kept the offset of the longer list it was showing. Pick a category

     list they had never seen, with the chip row and the heading - the only
     way to pick a different category - scrolled out of view above them. The
     rebuild also shrank the list under them, which fires a scroll event, and

function loadMore(view,cat,box,label,page,replace,want,q,sort){

  /* one call for the whole restored range, not one per page */
  const limit=want&&want>40?want:40;
  /* q/sort are only supplied by search, which pages by relevance against a
     live query; the catalogue views keep sorting by name with no filter */

  if(r.apps.length===0&&page.offset===0) box.innerHTML='<div class="empty">No apps in this category.</div>';

     Search draws its first page with rowHtml(a) and no rank, but it pages in
     through here, and this line numbered every row it appended: scroll a
     result list past sixty and the rows after it grew a 20px rank column,
     starting at "61" with nothing above it to count from, and every icon on
     them shifted right by that column - a list that changed shape halfway
     down and stayed that way. Rank only the lists that start at the top with
     a number; q is set only by search (see the note above). */

function renderSearch(){
  $('#view-search').innerHTML=head('Search')+`<div class="searchbar g hasglass"><liquid-glass class="glassback" variant="clear" shape="capsule" tint="var(--lg-field)" aria-hidden="true"></liquid-glass><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>

/* Search asked for one page of sixty and then stopped: the heading reported

   way to reach the rest, so a query matching four hundred apps silently lost
   eight hits in every nine - and the reader had no sign anything was missing.
   It now pages in like Games and Apps do, against the same relevance order.

   A re-render for the same query puts back the pages already scrolled to, so
   an install tick or a returning tab no longer drops the reader back to the
   first page; a different query starts again at the top. */
function runSearch(){
  const out=$('#searchOut'); if(!out) return;
  const q=S.query.trim();

  if(!q){
    page.offset=0;page.done=true;page.q='';
    out.innerHTML=`<div class="sec first"><h2>Popular Right Now</h2></div>`+B.list('','','updated',0,8).apps.map(a=>rowHtml(a)).join('');

  }

  const want=changed?0:page.offset;

  out.innerHTML=`<div class="sec first"><h2>${first.total} Result${first.total===1?'':'s'}</h2></div><div data-listbox></div>`;

     place, so the view kept the offset of the previous query's list - type a
     new search while scrolled to the bottom and you landed in the middle of
     the new matches, with the scroll handler firing straight away and pulling

function searchTop(){const v=$('#view-search');if(v) v.scrollTop=0}

/* ---------- detail page ---------- */
/* Fill the sheet with a new page.

   scrollTop survived the swap: open an app, read to the bottom, go back, tap
   another one, and that page appeared already scrolled to its end - the reader
   landed on the footer and the package line, with the icon, the name and the
   Get button far above the fold, and had to scroll up to find out which app
   they had just opened. Every page the sheet shows starts at its top now.

   keepScroll is for the one case that is not a new page: re-rendering the app
   that is already on screen, which happens when an install finishes or the
   installed list changes. That must leave the reader where they were. */
function sheetBody(html,keepScroll){
  const b=$('#sheetBody');

/* Every way into the screenshot strip that is not a swipe. Native horizontal
   panning is left alone for touch (touch-action:pan-x); the pointer drag here
   is for a mouse, where a scroll container has no gesture at all. A drag that
   ends over a screenshot must not also open the full-screen viewer, so the
   click that follows a drag is swallowed in the capture phase. */
function wireShots(){
  const wrap=$('#shotsWrap'), strip=$('#shots');
  if(!wrap||!strip) return;
  const gap=12;
  const step=function(){
    const c=strip.querySelector('.shot');
    return c?Math.round(c.getBoundingClientRect().width+gap):170;
  };
  const maxScroll=function(){return Math.max(0,strip.scrollWidth-strip.clientWidth)};
  /* the strip is padded, so "scrolled to the start" is the padding, not zero:
     the snap points line the first card up 20px in */
  const startAt=function(){return (parseFloat(getComputedStyle(strip).paddingLeft)||0)+2};
  const sync=function(){
    const max=maxScroll();
    wrap.querySelectorAll('.shotnav').forEach(function(n){
      const dir=+n.dataset.nav;
      n.style.display=max<=2?'none':'';
      n.disabled=dir<0?strip.scrollLeft<=startAt():strip.scrollLeft>=max-2;
    });
  };
  const go=function(dir){
    strip.scrollBy({left:dir*step(),behavior:'smooth'});
    setTimeout(sync,360);
  };
  wrap.querySelectorAll('.shotnav').forEach(function(n){
    n.addEventListener('click',function(){go(+n.dataset.nav)});
  });
  strip.addEventListener('scroll',sync,{passive:true});
  wrap.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();go(e.key==='ArrowRight'?1:-1);
    }
  });

  let down=false,startX=0,startLeft=0,dragged=false,pid=null;
  strip.addEventListener('pointerdown',function(e){
    if(e.pointerType!=='mouse'||e.button!==0) return;
    down=true;dragged=false;pid=e.pointerId;startX=e.clientX;startLeft=strip.scrollLeft;
  });
  strip.addEventListener('pointermove',function(e){
    if(!down||e.pointerId!==pid) return;
    const dx=e.clientX-startX;
    if(!dragged&&Math.abs(dx)<5) return;
    if(!dragged){dragged=true;strip.classList.add('dragging');}
    strip.scrollLeft=startLeft-dx;
  });
  const release=function(){
    if(!down) return;
    down=false;pid=null;
    strip.classList.remove('dragging');
    if(dragged){
      const s=step();
      strip.scrollTo({left:Math.round(strip.scrollLeft/s)*s,behavior:'smooth'});
      setTimeout(sync,360);
    }
  };
  strip.addEventListener('pointerup',release);
  strip.addEventListener('pointercancel',release);
  strip.addEventListener('pointerleave',release);
  strip.addEventListener('click',function(e){
    if(!dragged) return;
    dragged=false;
    e.preventDefault();e.stopPropagation();
  },true);
  /* a vertical wheel over the strip scrolls it sideways */
  strip.addEventListener('wheel',function(e){
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
    strip.scrollLeft+=e.deltaY;
    e.preventDefault();
  },{passive:false});
  sync();
}
function openSheet(pkg){

/* The actions row of an app page, drawn from that app's catalogue entry.

   to a page that is not an app's, so those pages inherited whichever app had
   been open before them.

   from inside an app's page: open an app, tap Get on a device that has not
   allowed installs from this source yet, and the page that replaces it is
   still filed under that app. Its More button then opened that app's source

function sheetApp(pkg){ S.sheetPkg=pkg||null }

   hold was still pinned in the DOM afterwards, where nothing evicts it. The

/* ---------- install ---------- */
/* Starting an install changes the same two controls a progress tick does.
 *
 * beginInstall() rebuilt the whole visible view for it - refreshVisible() -
 * which is the call paintProgress() was written to replace. That fix covered
 * every tick of a download and left the first one on the old path, so the
 * most expensive frame of the whole install was the one the reader paid by
 * tapping Get: the list was thrown away and re-created from a fresh bridge
 * query, to turn one button into its ring.
 *
 * Measured on this page with 320 rows scrolled into Apps, tapping Get on one
 * of them: refreshVisible() re-queried the catalogue once for all 320 rows,
 * shipped them back as JSON, parsed them, and wrote 225 KB of HTML over a
 * view that was already correct - one list() call, two innerHTML writes and
 * 320 rows rebuilt, on the thread that is also starting the download. The
 * ring it drew is byte for byte the markup getBtnHtml() produces from
 * S.installing alone, which is exactly what paintProgress() patches in.
 *
 * So patch the two controls and nothing else. The list keeps every row it
 * had (and its scroll position, which the rebuild used to clamp to 0 and put
 * back), and the app page keeps its pill - renderSheetActions() draws that
 * from the same S.installing entry, so it reads the same as it did. Nothing
 * that was drawn changes: the same ring appears on the same buttons at the
 * same moment, and the rows around them were never different.
 *
 * The other paths that answer "an install started" are untouched - the
 * progress ticks still go through paintProgress() (see there), and the end of
 * an install still redraws the view through refreshVisible(), because that
 * one really does change every row it touches: the button becomes Open, the
 * badge appears and the size line is rewritten. */
function beginInstall(pkg){
  const r=B.install(pkg);
  if(r&&r.ok){
    S.installing[pkg]={pct:0};
    paintProgress(pkg);
    if(S.sheetPkg===pkg) renderSheetActions(B.detail(pkg));
    pollStart();return
  }
  const msg=(r&&r.error)||'Could not start the install.';
  if(msg==='permission') showPermission(); else toast(msg);
}
function showPermission(){
  const c=B.canInstall();
  sheetBody(`<div class="sheet-head"><div style="flex:1"><h2>One permission needed</h2><div class="cat">Install unknown apps</div></div></div>

   re-queried the catalogue behind it): 250 ms per tick over 240 rows on a
   throttled CPU, i.e. the list froze for the length of the download. Patch
   the two controls in place instead - same markup getBtnHtml() would emit,

/* drag the lens across the bar, release to snap to the nearest tab.
 *
 * The drag belongs to the pointer that started it, and it ends when that
 * pointer is released - wherever that release happens. Both halves of that
 * were missing. `down` and `drag` were set from a pointerdown on the bar and
 * cleared only by a pointerup or pointercancel delivered *to the bar*, and the
 * bar is a 66px strip at the bottom of the frame. A press that leaves it
 * before the 8px drag threshold - the ordinary way to change your mind about a
 * tap - takes the release with it, and nothing else ever clears the flag, so
 * the bar stays "pressed" for the rest of the session. The same happens to any
 * gesture the system interrupts rather than completes: the app goes to the
 * background under a finger, or the pointer is taken away. That is the way a
 * reader on a phone reaches it.

 * pointermove over the bar is read as a drag: the lens slides and the .on
 * highlight follows the pointer with no button held, so a tab is selected by
 * hovering, and a tap on it afterwards switches to whatever the pointer
 * happened to be over. The lens is also left in the drag pose - scale(1.1,.96)
 * - because the only code that settles it back to scale(1,1) is moveLens(),
 * which runs from end(). It stays squashed and off its tab until the reader
 * switches tabs again.
 *

 * bar, then move the pointer across the bar without pressing - the lens went
 * translateX(9px) to translateX(163px) scale(1.1,0.96) and .tab.on moved from
 * "today" to "apps" on hover alone, and stayed there.

 * ends, and the pointerId is carried through so a second finger lifting does
 * not end the first finger's drag. Nothing about a normal drag changes: the
 * same pointerdown, the same 8px threshold, the same capture, the same snap on
 * release - and a plain tap still falls through to the click handler, because
 * end() returns before it touches the highlight when no drag had started. */

  bar.addEventListener('pointerdown',function(e){
    down=true;drag=false;pid=e.pointerId;sx=e.clientX;tgCache=null;   /* fresh geometry for this drag */

  });
  bar.addEventListener('pointermove',function(e){
    if(!down||e.pointerId!==pid) return;
    const dx=e.clientX-sx;
    if(!drag&&Math.abs(dx)>8){
      drag=true;
      if(lensAnim){lensAnim.cancel();lensAnim=null}
      try{bar.setPointerCapture(e.pointerId)}catch(_){}
      lens.style.opacity=1;
    }
    if(!drag) return;
    const g=tabGeom();
    const x=Math.max(g[0].x,Math.min(g[g.length-1].x,sl+dx));
    lens.style.transform='translateX('+x+'px) scale(1.1,.96)';

    g.forEach(function(t){const d=Math.abs(t.x+t.w/2-c);if(d<bd){bd=d;best=t}});

    if(!down) return;
    /* a second finger lifting is not the end of the first one's drag */

    if(!drag) return;

   translateY is --sy*0.08px and the cards' is --sy*-0.05px, so they kept
   moving the layers after the rotation that --amt scales had gone. Measured
   on this page: scroll Today to 400 with depth on, then Depth panel -> Enable
   depth off - the stage stayed translated 32px and the App of the Day card
   was drawn 20px above the box it is laid out in, overlapping the "Today"
   heading, and scrolling back to the top changed nothing because no scroll
   handler was listening any more. The offset only cleared on the next tab
   switch, which passes null to setScrollOffset() for exactly this reason.

   true: the two layers resolve to the rest pose the reader's next tab switch
   would have given them anyway. Nothing else changes - while depth is on,

     the rest of the way to the stale target with no finger on the screen.

     the slider branch was left out.

   and 1.0-1.5 s of style work per 3 idle seconds on a desktop CPU, several
   times that on a phone; with the loader up, a cold start paid the same price
   for the length of the catalogue download, exactly when the device is
   busiest. Nothing moves and nothing is lost: the timer keeps running, the
   phase (ambT) simply stops advancing while it is covered, and the first tick
   after the surface goes resumes from where it left off - the same value it
   would have written anyway, one step on.

   layout, where the phone frame is a rounded card with the stage drifting

   previous tick had dirtied style, so every one of them forced the
   recalculation synchronously instead of letting the engine do it once for the

     everything, on rgba(0,0,0,.96), and nothing inside it is one of the
     layers the sway moves - .lb and .lbx are not in the depth selector list,
     and the <img> fills the screen. So a reader who taps a screenshot and
     looks at it for a while paid the full ambient price for a document they
     could not see: measured with the viewer open, 54 style recalculations and
     916 ms of task time per 3 idle seconds, against 4 ms with depth switched

     viewer is exactly where a reader lingers, so it was the worst of the
     three. Pausing here is the same trade the sheet already makes: ambT stops

   change you can see. The viewer holds neither: it is z-index 130 over the
   whole frame on rgba(0,0,0,.96), and its only children are the <img> and the
   .lbx close button, neither of which is in that list.

   So a move that arrives while the viewer is open can only buy a restyle of a
   document nobody can see - and it is the most expensive restyle on the page:
   --dx/--dy are inherited custom properties written on :root, so one write
   invalidates style for every element under it. Measured on a 1,980-element
   document (80 rows loaded), CPU throttled 4x, ambient sway stopped: 60 pointer
   moves cost 61 full recalculations and 7.9 s of style work with nothing open,
   and 62 and 9.0 s with the viewer up - every millisecond of the second run
   invisible. On a phone that is the main thread saturated for the whole of the
   swipe that closes the viewer, which is the one gesture the viewer has.

   Nothing visual changes. Opening the viewer is a tap, and the tap's own
   pointerleave has already sprung --dx/--dy back to rest, so the store behind
   the viewer is level while it is up and level when it closes; a tilt sensor
   that is paused here reports again on its next event, which is the same angle
   it was already at. pointerleave stays ungated on purpose: it is the write
   that puts the layers back at rest, and it costs a handful of frames rather
   than a stream of them. */
function viewerCovers(){
  /* same element covered() already resolved - see coverSurfaces(). This one is
     called from the pointermove and deviceorientation handlers, so during a
     drag it ran at pointer rate, and each call walked the document for an id
     that never changes. */
  const b=coverSurfaces().lb;
  return !!(b&&b.classList.contains('on'));
}
/* The sway is written from the frame's animation callback, not from a timer.

   --ax/--ay are inherited custom properties on :root, so one write invalidates
   style for the whole document and the browser answers with a full style
   recalculation - the most expensive single write on the page (see
   depthActive()). A setInterval does not know where the frame is: it fires
   wherever 50 ms of wall clock happens to land, which is usually between an
   input event and the frame that follows it. The scroll handlers below read
   geometry - scrollTop, clientHeight, scrollHeight - so every one of them that
   lands after such a write forces the recalculation, and the layout it drags
   with it, synchronously in the middle of the frame; then the frame's own
   style pass does the same work again.

   Measured in the harness on a 200-row catalogue, 60 wheel-scrolled frames of
   the Apps list, three runs of each build: 194-200 forced layouts, 3.5-4.0 s
   of style recalculation and 6.9-7.4 s of main-thread task time with the
   timer; 111-119, 2.0-2.3 s and 4.6-5.7 s with this frame loop. With the sway
   switched off altogether the same 60 frames cost about 40 layouts and 0.1 s
   of style work, so the sway is the whole difference and this takes roughly
   40% of it back - on a phone, several times the absolute numbers, off the
   thread that is trying to keep the list at 60 fps.

   From requestAnimationFrame the same two values are written in the one slot
   where the engine wants them: after every input event for that frame has been
   dispatched, before style, layout and paint. The scroll handlers then read a
   clean style tree and the frame pays for one recalculation instead of three.
   The motion itself is unchanged - same two curves, same amplitudes, same
   sweep rate (see the phase note below). Nothing else changes either:
   covered() and depthActive() still park it, ambientStop() still cancels it,
   and a hidden page stops asking for frames instead of running a timer whose
   every tick it would throw away. */
const AMBIENT_MS=50;
var ambLast=0;
function ambientFrame(ts){
  ambTimer=0;
  if(!depthActive()) return;
  /* the clock starts on the first frame, so the first tick still arrives one
     AMBIENT_MS after the sway starts, exactly as the interval did */
  if(!ambLast){ ambLast=ts; ambTimer=requestAnimationFrame(ambientFrame); return; }
  const dt=ts-ambLast;
  if(dt<AMBIENT_MS){ ambTimer=requestAnimationFrame(ambientFrame); return; }
  ambLast=ts;
  if(!document.hidden&&!covered()&&!document.documentElement.classList.contains('scrolling')){
    /* The phase advances with the clock, not once per tick. The timer added a
       fixed 0.055 every 50 ms and so swept 1.1 radians a second whatever the
       display was doing; a frame loop cannot promise 20 callbacks a second on
       a device that is only painting 25 frames, and adding 0.055 per callback
       there would have slowed the sway to half speed - a change you can see.
       Measuring the elapsed time instead keeps the sweep at 1.1 a second
       everywhere, and simply draws the intermediate positions the display
       could never have shown. On a device that does paint 60 frames a second
       a tick still lands every third frame, i.e. every 50 ms, and the phase
       still steps by exactly 0.055: the numbers written are the ones the timer
       wrote. The elapsed time is capped at two ticks so a long stall - a
       catalogue parse, a tab in the background - cannot jump the sway across
       a visible arc. While the sway is covered nothing is added either way, so
       it still resumes from where it paused. */
    ambT+=Math.min(dt,AMBIENT_MS*2)*0.055/AMBIENT_MS;
    const r=document.documentElement;
    r.style.setProperty('--ax',(Math.sin(ambT)*0.30).toFixed(3));
    r.style.setProperty('--ay',(Math.cos(ambT*0.73)*0.22).toFixed(3));
  }
  ambTimer=requestAnimationFrame(ambientFrame);
}
function ambientStart(){
  /* never hold a frame loop that has nothing to draw - see depthActive() */
  if(!depthActive()){ ambientStop(); return; }
  if(ambTimer) return;
  ambLast=0;
  ambTimer=requestAnimationFrame(ambientFrame);
}
function ambientStop(){ if(!ambTimer) return; cancelAnimationFrame(ambTimer); ambTimer=0;
  const r=document.documentElement; r.style.setProperty('--ax','0'); r.style.setProperty('--ay','0'); }

/* The parallax offset is a custom property on :root, so every write makes the
   style engine re-resolve it for the whole document. It also saturates at
   400px: on any list scrolled further than that, each scroll event re-wrote
   the identical number - dozens of full style recalculations a second for a
   value that had not changed. Remember what was last written and skip the
   no-op. Same helper on a tab switch, so the offset always belongs to the
   view that is actually on screen. */
let syLast=null, syRaf=0, syEl=null, syStage=null;
/* --sy is read by exactly two rules: the background (.stage) and the two card
   layers that lag behind it (.hero/.bigcard). It used to be written on :root,
   so every element in the document inherited a new value on every scroll
   frame and the style engine re-resolved all of them - 1460 elements, for a
   variable only three of them can see. Measured on a 640-row catalogue with
   the ambient sway stopped: one write cost 8.7 ms and twenty frames of
   scrolling 587 ms of style work, on a desktop CPU, several times that on a
   phone. Stamped on the two things that read it instead - the stage, which
   already repaints every frame for the sway, and the cards themselves - the
   same write costs 1.1 ms and the same twenty frames 164 ms. Every consumer
   resolves to the identical value, so nothing about the motion changes.
   renderToday() re-stamps after it rebuilds the cards, because a fresh
   .bigcard has no --sy of its own until it is given one. */
/* The .bigcard query below used to be `document.querySelectorAll('.bigcard')`,
   and stampSy() runs on every parallax frame - so the hottest handler on the
   page walked the entire document, every frame, to find at most two nodes.

   Only the Today view can hold a .bigcard: bigCard() is called from
   renderToday() and from nowhere else, and renderToday() writes into
   #view-today. On Apps, Games, Arcade or Search the answer is always the empty
   list, so the walk found nothing and cost the same for it. Scoped to that one
   subtree the query sees the same two cards (or none) and touches a few dozen
   elements instead of thousands.

   Measured with 466 rows loaded (4580 elements in the document) over 120
   scroll frames, CPU throttled 4x: setScrollOffset() cost 270 ms in total and
   50 ms of that - 19%, 0.42 ms per frame - was this one query. Scoped to the
   subtree, the same 120 frames cost 149 ms and the query does not register at
   all: 45% off the parallax path, about 1 ms of main thread returned to every
   scrolled frame. The stage and the cards are stamped with the identical value
   at the identical moment - checked at ten scroll positions across the whole
   0-400px range, byte for byte - so nothing about the motion changes. */
/* The offset stamped on Today's cards is Today's own, and it is written once
   per change rather than once per scroll frame of every other tab.

   --sy is one number for two different things. On .stage it is the offset of
   the view on screen, and switchTab() hands it the incoming view's scrollTop
   for exactly that reason. On .bigcard it is the offset of the list those
   cards are in - and they are only ever in Today. Stamping syLast on both made
   those two disagree the moment the reader left Today, in the one window where
   the disagreement can be seen: Today is the only view that keeps its scroll
   position when you leave it (see switchTab - the paged views are reset to
   their top), and .fading keeps the view we just left painting for 600 ms
   while the new one fades in over it. So the cards were drawn at Today's
   offset, and 0 ms later - on the same switchTab() call - they were rewritten
   with the incoming view's offset of 0 and slid up to 20px (400 * -0.05)
   under the reader in the middle of the cross-fade. Measured on this page:
   scroll Today to 400, tap Apps, read --sy on the two .bigcard elements -
   400 before the switch, 0 on the very next sample, with #view-today still
   carrying .fading for another 600 ms.

   Everywhere else it was the other half of the same line: the cards are not
   painted at all while another tab is on screen (Today is .view:not(.on):
   not(.fading), so content-visibility:hidden - see the stylesheet), yet
   stampSy() ran its query and rewrote both of them on every parallax frame of
   every scroll in Apps, Games, Arcade and Search, invalidating two
   3D-transformed layers that produce nothing. setScrollOffset() is 13% of the
   JavaScript on a scrolled frame in this harness; the card half of it is dead
   work on four tabs out of five.

   So the cards keep Today's offset and are only written when it changes. The
   motion is untouched wherever it can be seen: while Today is on screen syLast
   *is* Today's offset and the cards are stamped with it, on the same frames as
   before, and a view that is fading out keeps the value it was already drawn
   with. syCardsLast is cleared by renderToday(), because the cards it rebuilds
   are new nodes with no --sy of their own. */
let syToday=null, syCards=null, syCardsLast=null;
function stampSy(){
  if(syLast===null) return;
  if(!syStage) syStage=document.querySelector('.stage');
  if(syStage) syStage.style.setProperty('--sy',syLast);
  if(!syToday) syToday=document.getElementById('view-today');
  if(!syToday) return;
  /* Today's own offset, which is syLast exactly while Today is the view on
     screen - and is left alone while it fades out, so the cards hold the value
     they are being painted with */
  if(syToday.classList.contains('on')) syCards=syLast;
  if(syCards===null||syCards===syCardsLast) return;
  syCardsLast=syCards;
  const cards=syToday.querySelectorAll('.bigcard');
  for(let i=0;i<cards.length;i++) cards[i].style.setProperty('--sy',syCards);
}
function setScrollOffset(v){
  const sy=String(Math.min(v?Math.max(0,v.scrollTop):0,400));
  if(sy===syLast) return;
  syLast=sy;
  stampSy();
}
/* A scroll gesture fires many events per frame and every write of --sy on
   :root invalidates style for the whole document. Written straight from the
   scroll handler, that write sat between the pagination handler's geometry
   reads (clientHeight / scrollHeight), so each of those reads forced a full
   style recalc plus layout of every row on screen - roughly 5 ms an event on
   a desktop CPU, i.e. tens of ms on a phone, for a value the browser can only
   paint once a frame anyway. Coalesce to a single read and write per frame:
   the parallax lands on exactly the same numbers, at the rate it is drawn. */
function queueScrollOffset(v){
  syEl=v;
  if(syRaf) return;
  syRaf=requestAnimationFrame(function(){
    syRaf=0;
    const el=syEl; syEl=null;
    setScrollOffset(el);
  });
}
/* scroll parallax: the background and hero lag behind the list */
function bindScrollParallax(){
  document.querySelectorAll('.view').forEach(function(v){
    if(v.getAttribute('data-par')==='1') return;
    v.setAttribute('data-par','1');
    v.addEventListener('scroll',function(){
      if(!D.on) return;
      /* only the view on screen owns the parallax offset - see the note on the
         pagination handler below, which is the same phantom event */
      if(!v.classList.contains('on')) return;
      queueScrollOffset(v);
    },{passive:true});
  });
}

/* scroll: compact nav title + pagination.

   Only the view on screen may act on a scroll event.

   All five views stay in the document and each one is its own scroll box, and
   a view that is not on screen is skipped by the stylesheet -
   .view:not(.on):not(.fading){content-visibility:hidden}. Skipping the contents
   also collapses that box: with nothing laid out inside it, scrollHeight falls
   back to clientHeight and the browser clamps scrollTop to 0. Changing scrollTop
   fires a scroll event, so leaving a scrolled view fires exactly one more of
   them, on the view being left, the moment its fade-out ends and .fading is
   dropped (see switchTab).

   Both scroll handlers - this one and bindScrollParallax() above - then
   treated it as a reader scrolling:

   - Pagination. The near-the-end test was scrollTop+clientHeight < scrollHeight-400,
     which for a collapsed box is 0+clientHeight < clientHeight-400 - false, so it
     read as "the reader is at the bottom" and pulled the next page in. Measured
     on a 420-app catalogue, four tab switches away from a part-loaded Apps list:
     one list('', '', 'name', 40, 40) each time - a synchronous bridge call that
     builds and sorts the page in Java and ships it back as JSON - and forty rows
     of HTML inserted into a view nobody can see, 40 rows growing to 80, then
     thrown away by the next renderCategoryView(). 3-5 ms of JavaScript thread per
     switch on a desktop CPU, several times that on a phone, for output that is
     always discarded. It also left S.pages['apps:'].offset ahead of the rows that
     exist, which is the count refreshVisible()/paintNow() restore from.

   - Parallax. The same event reached bindScrollParallax(), where scrollTop is now
     0, so setScrollOffset() wrote --sy=0 over the offset of the view the reader
     had just moved to. Measured: scroll Apps to 500, switch to Games, scroll Games
     to 300 - --sy on .stage reads 300, then snaps to 0 about 600 ms later while
     the reader is still on Games. The background and Today's cards lost their lag
     and only got it back on the next scroll event.

   The view being left can show neither of them, so both handlers return here. The
   view on screen is unaffected: it carries .on, its box is not collapsed, and its
   own scroll events take the same path they always did. */
document.querySelectorAll('.view').forEach(function(v){
  v.addEventListener('scroll',function(){
    if(!v.classList.contains('on')) return;
    $('#navbar').classList.toggle('show',v.scrollTop>50);
    if(!S.ready) return;
    if(v.scrollTop+v.clientHeight<v.scrollHeight-400) return;
    const view=v.id.replace('view-','');
    if(view!=='games'&&view!=='apps'&&view!=='search'&&view!=='arcade') return;
    const page=S.pages[view+':'], box=v.querySelector('[data-listbox]'), label=v.querySelector('[data-count]');
    if(!page||!box) return;
    if(view==='search'){
      /* only extend a list that belongs to the query still in the box */
      const q=S.query.trim();
      if(!q||page.q!==q) return;
      loadMore(view,'',box,label,page,false,0,q,'relevance');
      return;
    }
    const cat=(view==='games'||view==='arcade')?'Games':S.category;
    loadMore(view,cat,box,label,page,false,0,'','name');
  },{passive:true});
});

/* ================= Bounce + water sound ================= */
(function(){
  var SEL='button,.press,[data-detail],[data-cat],.tab,.chip,.mi,.get,.pill,.pill2,.bigget,.iconbtn,.avatar,.row,a[href]';
  /* One press per control, one press per finger.

     `down` and `pressAnim` were two single variables for the whole page, so a
     second pointer's pointerdown overwrote both: the first control's press
     animation was never cancelled, and it is created with fill:'forwards', so
     it goes on holding that control at 0.86-0.97 scale. Press a row with one
     thumb and another row with the other, then lift both: the first row stays
     at scale 0.97 with a finished animation still in effect - a control left
     visibly smaller than the ones beside it until its list happens to be
     re-rendered, plus an animation object the document keeps alive with it.

     Keyed by element and by pointer, every press has its own lifetime, and
     the one-finger path is exactly what it was: one entry in, one entry out. */
  var pressed=new Map(),downBy=new Map(),canAnim=!!(document.documentElement.animate);

  function depth(el){
    var w=el.getBoundingClientRect().width;
    return w>220?0.97:w>110?0.94:0.86;   /* big cards move a little, small buttons a lot */
  }
  function pressIn(el){
    if(!canAnim)return;
    var old=pressed.get(el);
    if(old){old.cancel();pressed.delete(el)}
    try{
      var s=depth(el);
      pressed.set(el,el.animate([{scale:'1'},{scale:String(s)}],{duration:110,easing:'ease-out',fill:'forwards'}));
    }catch(e){}
  }
  function release(el){
    if(!canAnim||!el)return;
    /* the control's own press animation, not whatever was pressed last */
    var held=pressed.get(el);
    if(held){held.cancel();pressed.delete(el)}
    try{
      var s=depth(el);
      el.animate([
        {scale:String(s)},
        {scale:String(Math.min(1.12,1+(1-s)*0.9)),offset:.35},
        {scale:String(1-(1-s)*0.3),offset:.6},
        {scale:String(1+(1-s)*0.12),offset:.82},
        {scale:'1'}
      ],{duration:520,easing:'cubic-bezier(.2,.8,.3,1)'});
    }catch(e){}
  }

  /* ---- water drop sound (synthesised, no audio file needed) ---- */
  var ac=null;
  function ctx(){
    try{
      if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}
      if(ac.state==='suspended')ac.resume();
      return ac;
    }catch(e){return null}
  }
  function bloop(c,t,f0,f1,dur,vol){
    var o=c.createOscillator(),g=c.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.45);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+dur+0.02);
  }
  function waterSound(){
    var c=ctx();if(!c)return;
    var t=c.currentTime+0.005;
    bloop(c,t,   320, 980, 0.24,0.34);   /* main drop  */
    bloop(c,t+0.07,520,1500,0.17,0.16);  /* small bubble */
    bloop(c,t+0.15,210, 560,0.22,0.14);  /* low glug   */
    /* soft splash */
    var len=Math.floor(c.sampleRate*0.28),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    var n=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
    n.buffer=buf;bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=0.7;
    g.gain.value=0.07;
    n.connect(bp);bp.connect(g);g.connect(c.destination);n.start(t);
  }

  document.addEventListener('pointerdown',function(e){
    ctx();                               /* unlock audio on first touch */
    var el=e.target.closest&&e.target.closest(SEL);
    if(!el||el.disabled)return;
    downBy.set(e.pointerId,el);
    pressIn(el);
  },true);
  /* release the control this pointer pressed - a finger that lifts must not
     let go of a control another finger is still holding */
  function up(e){
    var el=downBy.get(e.pointerId);
    if(el===undefined)return;
    downBy.delete(e.pointerId);
    release(el);
  }
  document.addEventListener('pointerup',up,true);
  document.addEventListener('pointercancel',up,true);

var PRESETS={orig:{gl:27,blur:22,sat:190,rim:70,sbg:0,hbg:0,ic:0,glassOn:false},crystal:{glassOn:true,gl:94,blur:8,sat:220,rim:85,sbg:82,hbg:92,ic:100},clear:{glassOn:true,gl:78,blur:16,sat:190,rim:70,sbg:62,hbg:70,ic:100},frost:{glassOn:true,gl:35,blur:26,sat:170,rim:55,sbg:30,hbg:30,ic:70}};

function hScroll(el){
  while(el&&el!==phoneEl&&el.nodeType===1){
    if(el.scrollWidth>el.clientWidth+4){var ox=getComputedStyle(el).overflowX;if(ox==='auto'||ox==='scroll')return true}
    el=el.parentNode;
  }
  return false;
}
function gStart(x,y,tg){
  var body=$('#sheetBody');
  G={a:true,x0:x,y0:y,x:x,y:y,t:performance.now(),
     inDock:!!(tg.closest&&tg.closest('.dock')),inSheet:!!(tg.closest&&tg.closest('#sheet')),
     field:!!(tg.closest&&tg.closest('input,textarea,select')),hx:hScroll(tg),top:!!body&&body.scrollTop<=2};
}
function gMove(x,y){
  if(!G.a||reduced&&false)return;
  var dx=x-G.x,dy=y-G.y,ay=Math.abs(y-G.y0),ax=Math.abs(x-G.x0);
  if($('#lb').classList.contains('on')){if(ay>90&&ay>ax){G.a=false;closeLb()}return}
  if(mw.classList.contains('on')){if(ay>60&&ay>ax){G.a=false;closeMenu()}return}
  if(sheet.classList.contains('on')){
    if(F.gClose&&G.inSheet&&G.top&&!G.hx&&G.x0>30&&y-G.y0>120&&ax<70){G.a=false;closeSheet();buzz()}
    return;
  }
  if(F.gDock&&!G.inDock&&!G.field&&Math.abs(dy)>36&&Math.abs(dy)>Math.abs(dx)*1.2){
    if(dy<0)dockShow();else dockHide();
    G.x=x;G.y=y;
  }
}
function gEnd(x,y){
  var g=G;G={a:false};
  if(!g.a||sheet.classList.contains('on')||mw.classList.contains('on')||$('#lb').classList.contains('on'))return;
  var dx=x-g.x0,dy=y-g.y0;
  if(F.gTab&&!g.hx&&!g.inDock&&!g.field&&g.x0>24&&Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2.4&&performance.now()-g.t<700){
    var cur=ORDER.indexOf(S.view),n=cur+(dx<0?1:-1);
    if(cur>=0&&n>=0&&n<ORDER.length){switchTab(ORDER[n]);buzz()}
  }
}
phoneEl.addEventListener('touchstart',function(e){if(e.touches.length!==1){G.a=false;return}var t=e.touches[0];gStart(t.clientX,t.clientY,e.target)},{passive:true});
phoneEl.addEventListener('touchmove',function(e){var t=e.touches[0];if(t)gMove(t.clientX,t.clientY)},{passive:true});
phoneEl.addEventListener('touchend',function(e){var t=e.changedTouches[0];if(t)gEnd(t.clientX,t.clientY)},{passive:true});
phoneEl.addEventListener('touchcancel',function(){G={a:false}},{passive:true});
/* a mouse on a desktop browser gets the same gestures */
phoneEl.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button===0)gStart(e.clientX,e.clientY,e.target)});
phoneEl.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'&&e.buttons)gMove(e.clientX,e.clientY)});
addEventListener('pointerup',function(e){if(e.pointerType==='mouse'&&G.a)gEnd(e.clientX,e.clientY)});
/* tap the tab you are on: back to the top. Hold Today: refresh. */
var lp=0,lpDone=false,tabbarEl=$('#tabbar');
tabbarEl.addEventListener('pointerdown',function(e){
  var t=e.target.closest('.tab');lpDone=false;clearTimeout(lp);
  if(t&&t.dataset.view==='today')lp=setTimeout(function(){lpDone=true;buzz();say('Refreshing catalogue');try{doRefresh()}catch(x){}},650);
});
['pointerup','pointercancel','pointerleave'].forEach(function(n){tabbarEl.addEventListener(n,function(){clearTimeout(lp)})});
tabbarEl.addEventListener('pointermove',function(e){if(Math.abs(e.movementX)+Math.abs(e.movementY)>6)clearTimeout(lp)});
document.addEventListener('click',function(e){
  if(lpDone){lpDone=false;e.stopPropagation();e.preventDefault();return}
  var t=e.target.closest&&e.target.closest('#tabbar .tab,.dock .fab');
  if(t&&t.classList.contains('on')){
    var v=$('#view-'+t.dataset.view);if(v&&v.scrollTop>4){v.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});dockShow()}
  }
},true);
