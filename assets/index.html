<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Liquid Store</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f7; --card:#ffffff; --ink:#000; --dim:#6c6c70; --dimmer:#aeaeb2;
  --sep:rgba(60,60,67,.16); --blue:#007aff; --fill:rgba(120,120,128,.12); --getbg:rgba(120,120,128,.14);
  --glass:rgba(255,255,255,.46); --glass-hi:rgba(255,255,255,.70);
  --rim:rgba(255,255,255,.85); --rim-lo:rgba(255,255,255,.25); --shadow:rgba(20,30,70,.16);
  /* The last stop is a scrim, not a colour: it is what the glass pane above it
     refracts, and what keeps the reader's wallpaper from swallowing the text
     when the app is running see-through over it. */
  --stage:radial-gradient(60% 40% at 0% 0%,rgba(223,233,255,.78) 0%,transparent 70%),radial-gradient(55% 40% at 100% 20%,rgba(255,228,241,.72) 0%,transparent 70%),radial-gradient(60% 40% at 20% 100%,rgba(220,255,244,.72) 0%,transparent 70%),rgba(242,242,247,.64);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000; --card:#1c1c1e; --ink:#fff; --dim:#98989f; --dimmer:#636366;
    --sep:rgba(84,84,88,.55); --blue:#0a84ff; --fill:rgba(120,120,128,.24); --getbg:rgba(120,120,128,.30);
    --glass:rgba(44,44,50,.46); --glass-hi:rgba(70,70,80,.62);
    --rim:rgba(255,255,255,.30); --rim-lo:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.55);
    --stage:radial-gradient(60% 40% at 0% 0%,rgba(40,70,160,.45) 0%,transparent 70%),radial-gradient(55% 40% at 100% 20%,rgba(150,50,120,.35) 0%,transparent 70%),radial-gradient(60% 40% at 20% 100%,rgba(20,130,110,.35) 0%,transparent 70%),rgba(0,0,0,.74);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000; --card:#1c1c1e; --ink:#fff; --dim:#98989f; --dimmer:#636366;
  --sep:rgba(84,84,88,.55); --blue:#0a84ff; --fill:rgba(120,120,128,.24); --getbg:rgba(120,120,128,.30);
  --glass:rgba(44,44,50,.46); --glass-hi:rgba(70,70,80,.62);
  --rim:rgba(255,255,255,.30); --rim-lo:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.55);
  --stage:radial-gradient(60% 40% at 0% 0%,rgba(40,70,160,.45) 0%,transparent 70%),radial-gradient(55% 40% at 100% 20%,rgba(150,50,120,.35) 0%,transparent 70%),radial-gradient(60% 40% at 20% 100%,rgba(20,130,110,.35) 0%,transparent 70%),rgba(0,0,0,.74);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:transparent;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
.stage{position:fixed;inset:0;background:var(--stage)}

/* The phone frame's height is the one declaration the whole layout hangs on:
   every child of .phone is absolutely positioned, so if this line is dropped
   the frame measures zero and the store draws nothing but its background.

   dvh arrived in Chrome 108, two years after everything else in this
   stylesheet - inset (87), aspect-ratio (88), content-visibility (85) - and
   WebView only gets it when the device updates it. On an Android 7-9 phone
   whose WebView has not been updated since 2022 (no Play Store, a frozen
   WebView, an AOSP build) the dvh declaration is invalid at parse time, the
   fallback below is what the frame gets, and the store looks exactly as it
   did before dvh existed. Where dvh is understood the second declaration wins
   and nothing about the layout changes by a pixel. */
.phone{position:relative;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:transparent}
@media (min-width:640px){
  body{display:grid;place-items:center}
  .phone{height:min(900px,94vh);height:min(900px,94dvh);border-radius:48px;background:var(--bg);border:1px solid var(--sep);box-shadow:0 40px 90px rgba(0,0,0,.35)}
}

/* ================= Liquid Glass ================= */
.g{position:relative;isolation:isolate;
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(190%) brightness(1.04);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.04);
  border:.5px solid var(--rim);
  box-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim-lo),inset 0 0 16px rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.08),0 10px 30px var(--shadow)}
.g::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.40) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.18) 100%)}
.press{transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.press:active{transform:scale(.94)}

/* ================= LiquidGlass 1.0.0 framework =================
   The <liquid-glass> custom element from the LiquidGlass framework (Apache-2.0,
   shayann07/liquidglass) is bundled inline below and drives every floating
   surface from here on. It is the real material, not a blur: an SVG
   displacement filter generated from the shader's own geometry bends what is
   painted behind the glass, with a rim light and a measured tint on top, so the
   tab bar, the lens that travels along it, the menu, the toast, the loader and
   the search field all refract the page under them.

   Every use is a *backplate*: the glass is an absolutely positioned child that
   fills the control's own box from behind (.glassback), so no control moves, no
   hit target shrinks, no focus order changes and nothing new takes a tap. The
   control's own translucent fill is switched off with .hasglass, because a
   backdrop-filter samples what is painted beneath it - including an ancestor's
   background - and an opaque fill would hide the refraction.

   Two surfaces stay out of it on purpose. Cards, rows, chips and the small
   pills inside them sit under the 3D depth transform, and a backdrop-filter
   inside a transformed layer is exactly what makes WebView tile and flash; they
   keep the older, cheaper translucency from .g. And engine="canvas" (the exact
   shader through CanvasKit) is left off: it would add 7.3 MB of WebAssembly to
   an APK that is 250 kB, to draw the same glass the HTML engine already draws
   in WebView's Chromium. */
liquid-glass{display:block}
.glassback{position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none}
.hasglass{position:relative;isolation:isolate;
  background:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
  border-color:transparent !important;box-shadow:none !important}
.hasglass::before{display:none}
liquid-glass.lens{background:none !important;border:none !important;box-shadow:none !important}
/* The full-frame pane: the app's background, drawn as glass.

   A pane this size has its lens band at the edge of the screen, which on a phone
   is mostly off the edge of the glass - so the sheet needs a second cue to read
   as glass at all: the sheen of light across it (the same 155deg highlight the
   .g surfaces carry) and the bright rim where the pane meets the frame. Both are
   the host's own box, drawn above the component's material, so the refraction
   underneath is untouched. */
.bgpane{position:absolute;inset:0;z-index:0;pointer-events:none;display:block;border-radius:inherit;
  box-shadow:inset 0 0 0 .5px var(--rim-lo),inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim-lo)}
.bgpane::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 64%,rgba(255,255,255,.12) 100%)}
:root[data-theme="dark"] .bgpane::after{
  background:linear-gradient(155deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 66%,rgba(255,255,255,.05) 100%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .bgpane::after{
    background:linear-gradient(155deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 66%,rgba(255,255,255,.05) 100%)}
}
/* ---------- the tint of every glass surface, in one place ----------
   Transparent: no surface paints a colour of its own. What a reader sees through
   the tab bar, the orb, the lens, the menu, the toast, the loader or the search
   field is the page behind it - bent at the rim, dispersion and the edge light,
   which is the whole of the effect. Each surface still carries its `tint`
   attribute, pointing here, so raising any one of them is a one-line change:
   give it a colour with an alpha, e.g. rgb(255 255 255 / .5) for light and
   rgb(20 20 26 / .55) for dark, and that surface alone stops being see-through. */
:root{--lg-bg:transparent;--lg-lens:transparent;--lg-dock:transparent}
/* nothing opaque behind the pane: the stage gradient is what it refracts */
body{background:transparent}
.phone{background:transparent}
/* The two backgrounds the app offers, switched from the menu and remembered:
   "glass" is the see-through sheet above, "black" is the same app on a plain
   black field - the pane and the ambient orbs are switched off rather than
   tinted, because a glass pane over black is just black with a filter bill. */
:root[data-bg="black"]{--stage:#000}
:root[data-bg="black"] .orbs,
:root[data-bg="black"] .bgpane{display:none}
:root[data-bg="black"] .loader{background:#000}
/* Glass.Clear, everywhere: the material's transparent variant, a 4% tint with
   no lift, so the page behind the glass is seen, not covered. Its refraction
   band is wider than the regular material's (28 dp against 14) and it carries
   the dispersion and the rim, which is what makes a fully see-through surface
   still read as glass rather than as a hole.
   The three surfaces that carry text - the menu, the toast, the loader - add a
   whisper of tint on top (Glass.tint() at 10-18%), because the lens keeps its
   middle readable by design and a menu's own labels should still win against the
   list behind it. The alpha is a theme variable, so it follows the Appearance
   switch with everything else. Set these to 0 for a completely bare pane. */
:root{--lg-panel:transparent;--lg-menu:transparent;--lg-field:transparent}

/* the store's own theme switch writes data-theme on <html>; the component reads
   prefers-color-scheme, so the scheme is handed to every glass surface below */


/* ================= Top chrome ================= */
.navbar{position:absolute;top:0;left:0;right:0;z-index:55;height:calc(60px + var(--safe-t));
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;
  background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  border-bottom:.5px solid var(--sep);opacity:0;transition:opacity .2s;pointer-events:none}
.navbar.show{opacity:1}
.navbar b{font-size:17px;font-weight:600}

.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(56px + var(--safe-t)) 20px 150px;
  -webkit-overflow-scrolling:touch;opacity:0;visibility:hidden;transform:translateY(10px) scale(.995);
  transition:opacity .28s ease,transform .28s ease,visibility .28s}
.view.on{opacity:1;visibility:visible;transform:none}
/* A view that is not on screen is already invisible, but its whole subtree was
   still restyled on every write of the depth variables: all five views are
   rendered and kept in the document, and the four that are off screen hold
   about five sixths of every element, so the ambient sway alone re-resolved
   them ~13 times a second to produce nothing anyone can see. Skipping a
   skipped view is invisible by construction, and it takes roughly three
   quarters of the idle style work with it. .fading is the view we have just
   left: it keeps its contents painted until its fade-out has finished, so the
   cross-fade between tabs looks exactly as it did. */
.view:not(.on):not(.fading){content-visibility:hidden}
.view::-webkit-scrollbar{display:none}

.lt{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 0 12px;gap:12px}
.lt h1{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.lt .eb{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.avatar svg{width:20px;height:20px}
/* The menu button is three dots, and it answers: the dots lean in and the middle
   one steps back while the menu is open, so the control that opened the sheet is
   the control that shows it is open. Every part of it is on the same spring the
   rest of the app uses. */
.menu-btn .dots{display:flex;align-items:center;gap:3.6px;transition:transform .5s var(--spring, cubic-bezier(.34,1.45,.64,1))}
.menu-btn .dots i{width:4.6px;height:4.6px;border-radius:50%;background:currentColor;
  transition:transform .45s var(--spring, cubic-bezier(.34,1.45,.64,1)),opacity .25s ease}
.menu-btn.on .dots{transform:rotate(90deg)}
.menu-btn.on .dots i:nth-child(1){transform:translateX(3.2px) scale(1.25)}
.menu-btn.on .dots i:nth-child(2){opacity:.35;transform:scale(.55)}
.menu-btn.on .dots i:nth-child(3){transform:translateX(-3.2px) scale(1.25)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px;gap:10px;padding-top:14px;border-top:.5px solid var(--sep)}
.sec h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.sec span{font-size:15px;color:var(--blue);font-weight:500;white-space:nowrap}
.sec.first{border-top:none;margin-top:6px;padding-top:0}

/* ================= Big Today cards ================= */
.bigcard{position:relative;display:block;width:100%;aspect-ratio:.86;max-height:480px;border-radius:30px;overflow:hidden;margin-bottom:18px;
  color:#fff;cursor:pointer;text-align:left;isolation:isolate;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 18px 40px var(--shadow),0 2px 6px rgba(0,0,0,.12);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.bigcard:active{transform:scale(.97)}
.bc-art{position:absolute;inset:0;z-index:-1;overflow:hidden}
.bc-art::before{content:"";position:absolute;width:150%;aspect-ratio:1;left:-25%;top:-35%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.5),rgba(255,255,255,.08) 45%,transparent 68%)}
.bc-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 30%,transparent 55%,rgba(0,0,0,.26))}
.bc-ltr{position:absolute;right:-6%;top:12%;font-size:260px;font-weight:900;line-height:1;color:rgba(255,255,255,.16);letter-spacing:-10px}
.bc-top{padding:22px 22px 0}
.bc-tag{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.9}
.bc-top h3{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:6px 0 8px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.bc-top p{font-size:15px;line-height:1.4;opacity:.92;max-width:88%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.bc-foot{position:absolute;left:10px;right:10px;bottom:10px;border-radius:22px;padding:10px 12px;display:flex;align-items:center;gap:12px;color:#fff;
  background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
.bc-foot .meta b{color:#fff}.bc-foot .meta small{color:rgba(255,255,255,.82)}
.bc-foot .get{background:rgba(255,255,255,.92);color:#007aff}
.bc-foot .get.ring{background:rgba(255,255,255,.25)}

/* ================= Rows ================= */
.row{position:relative;display:flex;align-items:center;gap:14px;padding:11px 0;content-visibility:auto;contain-intrinsic-size:84px}
.row::after{content:"";position:absolute;left:76px;right:0;bottom:0;height:.5px;background:var(--sep)}
.row:last-child::after{display:none}
.ic{width:62px;height:62px;border-radius:22.5%;flex:0 0 auto;position:relative;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.4)}
.ic .ltr{font-size:26px;font-weight:700;color:rgba(255,255,255,.95)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ic.has{background:none !important}.ic.has .ltr{display:none}
.ic.sm{width:48px;height:48px}.ic.sm .ltr{font-size:20px}
.ic.lg{width:76px;height:76px}.ic.lg .ltr{font-size:31px}
.ic.xl{width:118px;height:118px;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 10px 24px var(--shadow),inset 0 1px 0 rgba(255,255,255,.45)}.ic.xl .ltr{font-size:50px}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;background:var(--fill);color:var(--dim);vertical-align:1px}
.badge.up{background:rgba(255,149,0,.18);color:#ff9500}
.rank{width:20px;text-align:center;font-size:17px;font-weight:700;flex:0 0 auto}

/* GET button + progress ring */
.get{min-width:74px;height:30px;padding:0 16px;border-radius:15px;background:var(--getbg);color:var(--blue);
  font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;display:inline-grid;place-items:center;flex:0 0 auto;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.get:active{transform:scale(.92)}
.get.open{font-weight:700}
.get.ring{min-width:30px;width:30px;padding:0;background:none;position:relative}
.get.ring svg{position:absolute;inset:0;width:30px;height:30px;transform:rotate(-90deg)}
.get.ring circle{fill:none;stroke-width:2.6}
.get.ring .trk{stroke:var(--getbg)}
.get.ring .prg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:69.115;transition:stroke-dashoffset .3s}
.get.ring i{width:10px;height:10px;border-radius:2.5px;background:var(--blue);display:block}
.bc-foot .get.ring .prg{stroke:#fff}.bc-foot .get.ring .trk{stroke:rgba(255,255,255,.3)}.bc-foot .get.ring i{background:#fff}

/* paged columns of 3 */
.cols{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 88%;scroll-snap-align:start;min-width:0}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:18px;font-size:14px;font-weight:600;white-space:nowrap;background:var(--card);color:var(--ink);
  box-shadow:0 0 0 .5px var(--sep)}
.chip span{color:var(--dim);margin-left:6px;font-weight:500}
.chip.act{background:var(--blue);color:#fff;box-shadow:none}.chip.act span{color:rgba(255,255,255,.8)}

/* ---------- Today: the rails ----------
   The App Store's Today page is a stack of horizontal rails: a heading, a row
   of cards that snaps card by card, and the next heading. Same idea here, built
   out of the catalogue the store already has - the cards are the same app
   entries as the rows, drawn as tiles instead. Three ways in, as everywhere
   else in this app: a finger (native pan-x), a mouse drag, and the arrow buttons
   that appear over the rail whenever there is something to scroll. */
.railwrap{position:relative;margin:0 -20px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:6px 20px 12px;scroll-snap-type:x mandatory;
  scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.rail.dragging .tile{pointer-events:none}
.tile{flex:0 0 auto;width:236px;border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px;
  scroll-snap-align:start;text-align:left;background:var(--card);color:var(--ink);
  box-shadow:0 0 0 .5px var(--sep),0 10px 24px var(--shadow);
  transition:transform .32s var(--spring,cubic-bezier(.34,1.45,.64,1)),box-shadow .3s}
.tile:active{transform:scale(.965)}
.tile .tile-top{display:flex;align-items:flex-start;gap:10px}
.tile .tile-top .get{margin-left:auto;flex:0 0 auto}
.tile b{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{font-size:12.5px;color:var(--dim);line-height:1.32;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.art{background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;box-shadow:0 16px 34px var(--shadow)}
.tile.art b,.tile.art small{color:#fff}
.tile.art small{opacity:.86}
.tile.art .get{background:rgba(255,255,255,.94);color:#0a84ff}
.tile .art-ltr{position:absolute;right:-6px;bottom:-18px;font-size:96px;font-weight:900;color:rgba(255,255,255,.14);line-height:1}
.tile.art{position:relative;overflow:hidden;isolation:isolate}
.railnav{position:absolute;top:50%;margin-top:-23px;z-index:4;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;padding:0;opacity:.95;transition:opacity .2s}
.railnav svg{width:15px;height:15px}
.railnav.prev{left:2px}.railnav.next{right:2px}
.railnav[disabled]{opacity:0;pointer-events:none}
.hcards{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hcards::-webkit-scrollbar{display:none}
.hcard{flex:0 0 auto;width:158px;border-radius:26px;padding:14px;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;background:var(--card);box-shadow:0 0 0 .5px var(--sep),0 8px 20px var(--shadow)}
.hcard b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard>span{font-size:12.5px;color:var(--dim);line-height:1.35;height:34px;overflow:hidden}
.hcard .get{align-self:flex-start}

/* ---------- depth: every surface sits at its own depth ----------
   perspective() goes inside each transform so the effect does not depend on
   an ancestor chain of preserve-3d, which would force a huge layer tree.
   Each layer reads the touch tilt (--dx/--dy) plus a slow ambient sway
   (--ax/--ay), so the depth is visible even when nothing is being touched.

   --dx and --dy carry a 0 fallback like every other variable here, and it is
   not decoration. They are written by depthFrame(), which only ever runs from
   a pointer move, and depthApply() only writes them when depth is switched
   off - so on a normal launch, with depth on, they were simply not defined.
   A var() with no fallback and no value makes the whole declaration invalid
   at computed-value time, so all of these surfaces - every row, card, chip,
   the tab bar, the navbar, the stage - resolved to transform:none instead of
   the perspective they were written for, and the ambient sway wrote --ax/--ay
   twenty times a second into declarations that could not resolve. The depth
   the store is built around was therefore absent from first paint until the
   reader first touched the screen, at which point every one of those layers
   jumped to its depth at once. With the fallback the same layers resolve to
   the rest pose (dx=dy=0, the state the sway animates around) from the first
   frame, which is what the transform above always described. */
/* .tabbar, .navbar, .searchbar and .loadcard used to be tilted with
   everything else. They now draw the LiquidGlass material, and a
   backdrop-filter inside a 3D-transformed layer does not refract in WebView:
   it tiles, flashes or drops out. The chrome sits flat and the glass bends
   what scrolls under it instead - the depth cue the tilt was standing in for,
   and the one iOS 26 actually uses. */
.hero,.bigcard,.row,.tile,.hcard,.chip,.mi,.ic,
.pagebar,.setrow,.stat,.shot,.pill,.pill2,.bigget,.get,.arc,.avatar,
.sheet-body>*{
  transform:perspective(700px)
            rotateY(calc((var(--dx,0) + var(--ax,0)) * var(--amt) * var(--r,0deg)))
            rotateX(calc((var(--dy,0) + var(--ay,0)) * var(--amt) * var(--r,0deg) * -1))
            translateZ(calc(var(--z,0px) * var(--amt)))
}
/* near things lean more, far things barely move */
.tabbar{--z:34px;--r:9deg}
.hero,.bigcard{--z:26px;--r:11deg}
.pagebar{--z:22px;--r:7deg}
.navbar{--z:18px;--r:5deg}
.chip,.mi,.tile,.hcard,.arc{--z:16px;--r:7deg}
.row,.setrow,.stat,.sheet-body>*{--z:10px;--r:4.5deg}
.ic,.shot,.pill,.pill2,.bigget,.get,.avatar{--z:5px;--r:2.5deg}
/* the hero lags slightly behind the rows while the list scrolls */
.hero,.bigcard{transform:perspective(700px)
            rotateY(calc((var(--dx,0) + var(--ax,0)) * var(--amt) * var(--r,0deg)))
            rotateX(calc((var(--dy,0) + var(--ay,0)) * var(--amt) * var(--r,0deg) * -1))
            translateZ(calc(var(--z,0px) * var(--amt)))
            translateY(calc(var(--sy,0) * -0.05px))}
/* the background drifts against everything else, and lags the scroll */
.stage{transform:translate3d(calc((var(--dx,0) + var(--ax,0)) * var(--amt) * -34px),
                            calc((var(--dy,0) + var(--ay,0)) * var(--amt) * -30px + var(--sy,0) * 0.08px),
                            0) scale(1.08)}

/* With the effect off, the depth transforms resolve to identity - and the
   compositor cannot tell.

   perspective(700px) rotateY(0deg) rotateX(0deg) translateZ(0px) maps every
   point of a flat element to itself, so at Strength 0, and with "Enable depth"
   off (where --amt is 0), those layers draw exactly what they would draw with
   no transform at all. What they also do is hold a compositor layer each:
   measured on a 420-row Apps list with the effect off, 518 layers against 137
   for the same document without the transforms, and 120 scrolled frames cost
   5.2-7.2 s of main-thread task time at 83-100 ms a frame, against 1.7-3.1 s
   at 17-33 ms. That is the state the panel offers to a reader whose device is
   struggling - "turn it down if it feels busy" - and until now it bought back
   the style work but not the layers.

   So when the effect cannot move anything, the transforms are dropped. The
   selector is the depth list above minus .hero/.bigcard: those two carry the
   scroll parallax (--sy), which is deliberately not scaled by --amt and is
   still visible at Strength 0, and .stage is not in that list at all.
   Nothing about the drawing changes: the geometry of all 479 rows, icons,
   buttons, cards and chrome is identical to the hundredth of a pixel with and
   without this rule, and screenshots of Today, Apps and an app page differ
   only in antialiasing rounding - a level or two on glyph and gradient edges -
   because the same pixels are rasterised directly instead of through a layer
   of their own. */
:root.flat .row,:root.flat .tile,:root.flat .hcard,:root.flat .chip,
:root.flat .searchbar,:root.flat .mi,:root.flat .ic,:root.flat .tabbar,
:root.flat .navbar,:root.flat .pagebar,:root.flat .setrow,:root.flat .stat,
:root.flat .shot,:root.flat .pill,:root.flat .pill2,:root.flat .bigget,
:root.flat .get,:root.flat .arc,:root.flat .loadcard,:root.flat .avatar,
:root.flat .sheet-body>*{transform:none}

/* ---- bounce: JS drives the spring via the independent `scale` property ---- */

/* =====================================================================
   Liquid Glass 2 - material, motion and transitions.
   Layered on top of the existing store: nothing above is removed, and the
   bridge / catalogue logic is untouched. Everything here is progressive:
   if a browser lacks a feature it falls back to the blur glass above.
   ===================================================================== */
@property --glow{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --spring:cubic-bezier(.34,1.45,.64,1);          /* replaced at runtime by a real spring, see lg.js */
  --spring-soft:cubic-bezier(.22,1,.36,1);
  --glass-lo:rgba(255,255,255,.30);
  --hl:1;                                          /* highlight strength */
  --ang:215deg;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-lo:rgba(70,70,82,.34);--hl:.55}}
:root[data-theme="dark"]{--glass-lo:rgba(70,70,82,.34);--hl:.55}

/* ---------- ambient orbs: give the glass something to refract ---------- */
.orbs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;width:86%;aspect-ratio:1;border-radius:50%;}
.orbs i:nth-child(1){left:-30%;top:-8%;background:radial-gradient(circle,rgba(80,140,255,.42),transparent 66%)}
.orbs i:nth-child(2){right:-38%;top:30%;background:radial-gradient(circle,rgba(255,100,170,.34),transparent 66%);animation-duration:29s;animation-delay:-9s}
.orbs i:nth-child(3){left:-14%;bottom:-22%;background:radial-gradient(circle,rgba(50,220,190,.34),transparent 66%);animation-duration:27s;animation-delay:-15s}
@keyframes orb{to{transform:translate3d(18%,12%,0) scale(1.2)}}
:root[data-theme="dark"] .orbs i{opacity:1.2}
@media (min-width:640px){.phone{background:transparent}}

/* ---------- the material ---------- */
.g{
  background:var(--glass-lo);
  backdrop-filter:blur(14px) saturate(185%) brightness(1.06);-webkit-backdrop-filter:blur(14px) saturate(185%) brightness(1.06);
  border:0;
  box-shadow:
    inset 0 1.5px 2px -.5px rgba(255,255,255,calc(.95*var(--hl))),
    inset 0 -2px 5px -2px rgba(255,255,255,calc(.40*var(--hl))),
    0 10px 26px var(--shadow);
  transition:--glow .8s ease;
}
/* pressed light: a soft glow that follows the finger */
.g::before{
  background:
    radial-gradient(130px circle at var(--px,50%) var(--py,0%),rgba(255,255,255,calc(var(--glow)*.55*var(--hl))),transparent 70%),
    linear-gradient(150deg,rgba(255,255,255,calc(.38*var(--hl))) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,calc(.16*var(--hl))) 100%);
}
.g.lit{--glow:1;transition-duration:.12s}
/* specular rim: a bright edge that leans toward the light */
.g::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:conic-gradient(from var(--ang) at 50% 50%,
    rgba(255,255,255,calc(.95*var(--hl))),rgba(255,255,255,.06) 20%,rgba(255,255,255,0) 42%,
    rgba(255,255,255,calc(.60*var(--hl))) 56%,rgba(255,255,255,.06) 76%,rgba(255,255,255,calc(.95*var(--hl))));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.press{transition:--glow .8s ease}

/* ---------- dock: bar + orb, minimises while you scroll down ---------- */
.dock{transition:transform .6s var(--spring-soft),opacity .35s ease}
#tabbar{transition:height .4s cubic-bezier(.22,1,.36,1),--glow .8s ease}
.fab{transition:width .4s cubic-bezier(.22,1,.36,1),height .4s cubic-bezier(.22,1,.36,1),flex-basis .4s cubic-bezier(.22,1,.36,1),--glow .8s ease}
.tab span{display:block;height:12px;line-height:12px;overflow:hidden;transition:opacity .3s ease,height .45s var(--spring-soft),margin .45s var(--spring-soft)}
.dock.mini #tabbar{height:60px}
.dock.mini .fab{flex-basis:60px;width:60px;height:60px}
.dock.mini .tab span{opacity:0;height:0;margin-top:-3px}
.dock.mini .tab svg{width:22px;height:22px}
/* ---------- the dock follows the scroll ----------
   Reading on (the list moving up under the thumb) puts the bar away in two
   steps: it drops to the compact bar first, then slides off the bottom edge
   entirely, so the last thing the reader sees is a bar leaving rather than one
   blinking out. Scrolling back brings it in the same two steps in reverse, and
   at the top of a list it is always full size. Everything is the app's own
   spring, and nothing here runs while the sheet is open - .phone.sheet-open
   already owns the dock then. */
.dock.away{transform:translateY(150%) scale(.96);opacity:0;pointer-events:none}
.lens{
  background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.24));
  border:0;
  box-shadow:inset 0 1px 1.5px rgba(255,255,255,.95),inset 0 -3px 7px rgba(255,255,255,.45),0 6px 18px rgba(30,40,90,.16);
  scale:1;transition:scale .6s var(--spring),background .35s,box-shadow .35s,opacity .25s;
}
:root[data-theme="dark"] .lens{background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.08))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lens{background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.08))}}
/* lifted: the lens swells into clear glass while you hold or drag it */
#tabbar.lifted .lens{
  scale:1.17 1.15;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),inset 0 2px 3px rgba(255,255,255,.95),inset 0 -10px 18px rgba(255,255,255,.30),0 12px 28px rgba(30,40,90,.28);
}
.tab.on svg{transform:translateY(-1px) scale(1.1)}
#tabbar.lifted .tab.on svg{transform:translateY(-1px) scale(1.22)}

/* ---------- screens: directional, springy, staggered ---------- */
.view{
  opacity:0;transform:translate3d(var(--vx,0px),0,0);
  transition:opacity .3s ease,transform .55s cubic-bezier(.22,1,.36,1),visibility .55s;
}
.view.on{transform:none}
.view.enter .lt,.view.enter .bigcard,.view.enter .sec,.view.enter .hcard,.view.enter .row,.view.enter .chip,.view.enter .searchbar,.view.enter .arc,.view.enter .tile{
  animation:rise .6s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*42ms);
}
@keyframes rise{from{opacity:0;translate:0 18px}}

/* ---------- app page: grows out of the thing you tapped ---------- */
.sheet{transform:none;transition:none;visibility:hidden;box-shadow:none}
.sheet.on{visibility:visible}
.sheet.dragging{box-shadow:-18px 0 44px rgba(0,0,0,.2)}
.sheet .edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:9;touch-action:pan-y}
.phone.sheet-open .navbar{opacity:0}
.phone.sheet-open .dock{transform:translateY(130%) scale(.92);opacity:0}
.phone.dragging .dock{transition:none}
.scrim{position:absolute;inset:0;z-index:65;background:#000;opacity:0;pointer-events:none;transition:opacity .5s ease}
.phone.sheet-open .scrim{opacity:.22}
.phone.dragging .scrim{transition:none}
.pagebar .iconbtn{animation:none}

/* ---------- menu: the popover ----------
   Opens the way a macOS popover does and the way an iOS context menu does at the
   same time, because both are the same motion: the panel grows out of the
   control that opened it (transform-origin is the button's corner), overshoots
   once on the app's spring, and its blur clears as it settles - a popover that
   is sharp at frame one reads as a cut, not as a surface arriving. The rows
   follow it in with a stagger of their own and leave in reverse. Closing is the
   same film played backwards and faster, which is what makes a dismissal feel
   like a response rather than a delay. The scrim behind is the third element:
   it dims and blurs the page a little, so the popover is legible over anything
   without being opaque. */
.menu{animation:none;transform-origin:top right;will-change:transform,opacity,filter}
.menuwrap::before{content:"";position:absolute;inset:0;background:rgba(8,10,18,.16);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .34s ease}
.menuwrap.on::before{opacity:1}
.menuwrap.out::before{opacity:0;transition-duration:.2s}
.menuwrap.on .menu{animation:menuIn .52s var(--spring, cubic-bezier(.34,1.45,.64,1)) both}
.menuwrap.out .menu{animation:menuOut .26s cubic-bezier(.4,0,.7,.25) both}
.menuwrap.on .mi{animation:miIn .46s var(--spring-soft, cubic-bezier(.22,1,.36,1)) backwards}
.menuwrap.on .mi:nth-of-type(1){animation-delay:.03s}
.menuwrap.on .mi:nth-of-type(2){animation-delay:.07s}
.menuwrap.on .mi:nth-of-type(3){animation-delay:.11s}
.menuwrap.on .mi:nth-of-type(4){animation-delay:.15s}
.menuwrap.on .mi:nth-of-type(5){animation-delay:.19s}
.menuwrap.out .mi{animation:miOut .16s ease both}
.menuwrap.out .mi:nth-of-type(5){animation-delay:.02s}
.menuwrap.out .mi:nth-of-type(4){animation-delay:.04s}
.menuwrap.out .mi:nth-of-type(3){animation-delay:.06s}
.menuwrap.out .mi:nth-of-type(2){animation-delay:.08s}
@keyframes menuIn{
  0%{opacity:0;transform:translate3d(8px,-12px,0) scale(.68,.56)}
  100%{opacity:1;transform:none}}
@keyframes menuOut{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:translate3d(6px,-8px,0) scale(.9,.84)}}
@keyframes miIn{from{opacity:0;translate:0 -10px;scale:.97}}
@keyframes miOut{to{opacity:0;translate:0 -4px}}
@media (prefers-reduced-motion:reduce){
  .menuwrap.on .menu,.menuwrap.out .menu,.menuwrap.on .mi,.menuwrap.out .mi{animation-duration:.01ms !important}
  .menu-btn .dots,.menu-btn .dots i{transition:none}
}
.toast{transition:opacity .3s ease,transform .6s var(--spring),--glow .8s ease;transform:translate(-50%,28px) scale(.85)}
.toast.on{transform:translate(-50%,0)}

/* ---------- controls in the same material ---------- */
.chip{transition:background .35s ease,color .35s ease,transform .3s var(--spring)}
.chip.act{background:linear-gradient(180deg,rgba(80,160,255,.95),rgba(0,122,255,.95));box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 6px 16px rgba(0,122,255,.35)}
.get{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 2px rgba(255,255,255,.18);transition:transform .3s var(--spring),background .3s}
.pill{background:linear-gradient(180deg,#4fa6ff,#007aff);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 8px 18px rgba(0,122,255,.38)}
.sw{width:54px;height:32px;border-radius:16px;box-shadow:inset 0 1px 3px rgba(0,0,0,.15);transition:background .35s ease}
.sw i{width:36px;height:26px;top:3px;left:3px;border-radius:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(240,240,245,.92));
  box-shadow:0 2px 8px rgba(0,0,0,.28),inset 0 1px 1px #fff;
  transition:transform .55s var(--spring),width .35s var(--spring)}
.sw.on i{transform:translateX(12px)}
.sw:active i{width:44px}.sw.on:active i{transform:translateX(4px)}
.rng::-webkit-slider-thumb{width:38px;height:26px;border-radius:13px;background:linear-gradient(180deg,#fff,#f1f1f6);
  box-shadow:0 2px 8px rgba(0,0,0,.28),inset 0 1px 1px #fff;transition:transform .3s var(--spring)}
.rng:active::-webkit-slider-thumb{transform:scale(1.18)}
.hcard,.bigcard{transition:transform .5s var(--spring),box-shadow .4s}


@media (prefers-reduced-motion:reduce){.orbs i{animation:none !important}}

/* ---------- stability: no tilted glass, no blur inside moving layers ----------
   backdrop-filter inside a 3D-transformed or animating parent is what makes
   WebView tile and flash. These surfaces keep their look but drop the tilt,
   and the ones that sit on flat colour use plain translucency instead. */
.bigcard,.pagebar,.avatar,.searchbar,.arc,.loadcard,.bc-foot{transform:none !important}
.bc-foot,.avatar.g{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
.bc-foot{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.14))}
.avatar.g{background:var(--glass-hi)}
.bc-foot::after,.avatar::after,.strip::after,.loadcard::after,.bigget::after{display:none}
.hcard,.bigcard{transition:box-shadow .3s}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="lgDefs"></defs></svg>
<div class="stage"></div>

<div class="phone">
  <!-- The app's own background, as glass. A full-frame pane of the same
       material as the chrome, sitting above the ambient gradient (.stage) and
       below everything the store draws: the gradient bends at the frame's rim,
       and the tint gives the sheet an edge you can see without hiding the
       colour behind it. It takes no taps (pointer-events:none) and it is one
       layer, so it costs one backdrop pass, not one per card. -->
  <liquid-glass class="bgpane" shape="rect" radius="0" variant="clear" tint="var(--lg-bg)" aria-hidden="true"></liquid-glass>
  <div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="navbar hasglass" id="navbar"><liquid-glass class="glassback" variant="clear" shape="rect" radius="0" aria-hidden="true"></liquid-glass><b id="navTitle">Today</b></div>


  <div class="strip g" id="strip">
    <div class="strip-bar"><i id="stripBar"></i></div>
    <div class="strip-text" id="stripText"></div>
  </div>

  <div class="views">
    <section class="view on" id="view-today"></section>
    <section class="view" id="view-games"></section>
    <section class="view" id="view-apps"></section>
    <section class="view" id="view-arcade"></section>
    <section class="view" id="view-search"></section>
  </div>

  <div class="dock">
    <nav class="g hasglass" id="tabbar" aria-label="Sections">
      <liquid-glass class="glassback" variant="clear" shape="capsule" tint="var(--lg-dock)" aria-hidden="true"></liquid-glass>
      <liquid-glass class="lens" id="tabLens" shape="capsule" variant="clear" tint="var(--lg-lens)" aria-hidden="true"></liquid-glass>
      <button class="tab on" data-view="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2.5V5M16 2.5V5M3 9h18"/></svg>
        <span>Today</span></button>
      <button class="tab" data-view="games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h3M7.5 6.5v3M16 9h.01M18.5 11.5h.01"/><rect x="2.5" y="5.5" width="19" height="13" rx="5.5"/></svg>
        <span>Games</span></button>
      <button class="tab" data-view="apps">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/></svg>
        <span>Apps</span></button>
      <button class="tab" data-view="arcade">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4l2.3 5 5.4.7-4 3.7 1.1 5.3L12 15.5l-4.8 2.6 1.1-5.3-4-3.7 5.4-.7z"/></svg>
        <span>Arcade</span></button>
    </nav>
    <button class="tab fab g press hasglass" data-view="search" aria-label="Search"><liquid-glass class="glassback" variant="clear" shape="capsule" tint="var(--lg-dock)" aria-hidden="true"></liquid-glass>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    </button>
  </div>

  <div class="menuwrap" id="menuwrap">
    <div class="menu g hasglass"><liquid-glass class="glassback" variant="clear" shape="rect" radius="24" tint="var(--lg-menu)" aria-hidden="true"></liquid-glass>
      <button class="mi" data-m="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5 6.6 6.6 0 0 1-8.5-8.5Z"/></svg>Appearance</button>
      <button class="mi" data-m="bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3.5"/><path d="M3 15.5 8.6 10l4.4 4.4 3-3L21 16"/></svg>Background<b class="mstate" id="bgState">Glass</b></button>
      <button class="mi" data-m="depth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 3 7.4l9 4.6 9-4.6z"/><path d="M3 12.2l9 4.6 9-4.6"/><path d="M3 16.9l9 4.6 9-4.6"/></svg>Depth</button>
      <button class="mi" data-m="src"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4 3.6 7.7 12 12l8.4-4.3z"/><path d="M3.6 12.2 12 16.5l8.4-4.3"/><path d="M3.6 16.7 12 21l8.4-4.3"/></svg>Sources</button>
      <button class="mi" data-m="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 4v7h-7"/></svg>Refresh catalogue</button>
    </div>
  </div>

  <div class="toast g hasglass" id="toast"><liquid-glass class="glassback" variant="clear" shape="capsule" tint="var(--lg-menu)" aria-hidden="true"></liquid-glass><span id="toastText"></span></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="pagebar">
      <button class="iconbtn g press hasglass" id="sheetClose" aria-label="Back"><liquid-glass class="glassback" variant="clear" shape="capsule" aria-hidden="true"></liquid-glass><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="spacer"></span>
      <button class="iconbtn g press hasglass" id="sheetMore" aria-label="More"><liquid-glass class="glassback" variant="clear" shape="capsule" aria-hidden="true"></liquid-glass><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="lb" id="lb" aria-hidden="true">
    <img id="lbImg" alt="Screenshot">
    <button class="lbx" id="lbClose" aria-label="Close">&#10005;</button>
  </div>

  <div class="loader" id="loader">
    <div class="loadcard g hasglass"><liquid-glass class="glassback" variant="clear" shape="rect" radius="32" tint="var(--lg-panel)" aria-hidden="true"></liquid-glass>
      <div class="spin" id="spin"></div>
      <h3 id="loadTitle">Loading catalogue</h3>
      <p id="loadText">Contacting the app repository&hellip;</p>
      <div class="bar"><i id="loadBar"></i></div>
      <button class="bigget g press" id="loadAction" style="display:none"><span>Retry</span></button>
    </div>
  </div>
</div>
