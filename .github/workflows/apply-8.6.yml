name: apply-8.6-asset-patch

# One-shot helper for the 8.6 maintenance run. It applies the index.html fix
# from an exact-string patch, refuses to push unless the resulting file hashes
# to the value the release was built from, and is deleted again straight after
# it runs. Nothing here ships in the APK.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply the patch and verify it byte for byte
        run: |
          python3 - <<'PY'
          import hashlib, io, sys

          PATH = 'assets/index.html'
          WANT = 'e83500ce23892b11a44397e59ef5e5a27bc7493e4b02eb0a1ea9bfe5a133cb8b'

          s = io.open(PATH, encoding='utf-8', newline='').read()
          before = hashlib.sha256(s.encode('utf-8')).hexdigest()

          def rep(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  sys.exit('expected exactly one match, found %d for: %r' % (n, old[:70]))
              s = s.replace(old, new, 1)

          rep(
              "  document.addEventListener('pointermove',function(e){\n"
              "    if(!depthActive()||D.tilt) return;",
              "  document.addEventListener('pointermove',function(e){\n"
              "    if(!depthActive()||D.tilt||viewerCovers()) return;")

          rep(
              "  window.addEventListener('deviceorientation',function(e){\n"
              "    if(!depthActive()||!D.tilt) return;",
              "  window.addEventListener('deviceorientation',function(e){\n"
              "    if(!depthActive()||!D.tilt||viewerCovers()) return;")

          ANCHOR = (
              "  return !!((s&&s.classList.contains('on'))\n"
              "         ||(l&&l.classList.contains('on'))\n"
              "         ||(b&&b.classList.contains('on')));\n"
              "}\n"
              "function ambientStart(){")

          ADDED = (
              "  return !!((s&&s.classList.contains('on'))\n"
              "         ||(l&&l.classList.contains('on'))\n"
              "         ||(b&&b.classList.contains('on')));\n"
              "}\n"
              "/* Whether the full-screen screenshot viewer is between the reader and every\n"
              "   layer the depth effect can move.\n"
              "\n"
              "   The sway above asks covered() - the sheet, the loader, the viewer - because\n"
              "   none of them can show it. The input path could only ask a narrower question,\n"
              "   because two of those three surfaces hold depth layers of their own that\n"
              "   really do tilt: the sheet is .sheet-body>* and the loader card is .loadcard,\n"
              "   both in the depth selector list, so pausing the tilt for either would be a\n"
              "   change you can see. The viewer holds neither: it is z-index 130 over the\n"
              "   whole frame on rgba(0,0,0,.96), and its only children are the <img> and the\n"
              "   .lbx close button, neither of which is in that list.\n"
              "\n"
              "   So a move that arrives while the viewer is open can only buy a restyle of a\n"
              "   document nobody can see - and it is the most expensive restyle on the page:\n"
              "   --dx/--dy are inherited custom properties written on :root, so one write\n"
              "   invalidates style for every element under it. Measured on a 1,980-element\n"
              "   document (80 rows loaded), CPU throttled 4x, ambient sway stopped: 60 pointer\n"
              "   moves cost 61 full recalculations and 7.9 s of style work with nothing open,\n"
              "   and 62 and 9.0 s with the viewer up - every millisecond of the second run\n"
              "   invisible. On a phone that is the main thread saturated for the whole of the\n"
              "   swipe that closes the viewer, which is the one gesture the viewer has.\n"
              "\n"
              "   Nothing visual changes. Opening the viewer is a tap, and the tap's own\n"
              "   pointerleave has already sprung --dx/--dy back to rest, so the store behind\n"
              "   the viewer is level while it is up and level when it closes; a tilt sensor\n"
              "   that is paused here reports again on its next event, which is the same angle\n"
              "   it was already at. pointerleave stays ungated on purpose: it is the write\n"
              "   that puts the layers back at rest, and it costs a handful of frames rather\n"
              "   than a stream of them. */\n"
              "function viewerCovers(){\n"
              "  const b=$('#lb');\n"
              "  return !!(b&&b.classList.contains('on'));\n"
              "}\n"
              "function ambientStart(){")

          rep(ANCHOR, ADDED)

          got = hashlib.sha256(s.encode('utf-8')).hexdigest()
          if got != WANT:
              sys.exit('patched file hashes to %s, expected %s' % (got, WANT))
          if before == got:
              sys.exit('patch was a no-op')
          io.open(PATH, 'w', encoding='utf-8', newline='').write(s)
          print('patched %s: %s -> %s' % (PATH, before, got))
          PY
          git config user.name 'Liquid Store maintenance'
          git config user.email 'maintenance@liquid.store'
          git add assets/index.html
          git commit -m "Stop the depth tilt working behind the screenshot viewer"
          git push origin HEAD:main
