name: attach-apk

# Uploads the built APK in dist/ to a release as a release asset, so
# releases/latest/download/LiquidStore.apk resolves again. Defaults to the
# current version's tag; pass another one when re-attaching an older build.
on:
  repository_dispatch:
    types: [attach-apk]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to
        required: false
        default: v14.5

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach dist/LiquidStore.apk to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || 'v14.5' }}
        run: |
          set -euo pipefail
          ls -l dist/LiquidStore.apk
          gh release upload "$TAG" dist/LiquidStore.apk --clobber
          echo "assets now:"
          gh release view "$TAG" --json assets -q '.assets[] | .name + " " + (.size|tostring) + "B"'
